lors[selStatus || 'pendente'] || statusColors.pendente;\n      item.selectedStatusLabel = sc.label;\n      item.selectedStatusColor = sc.color;\n      item.selectedStatusBg = sc.bg;\n      item.historico = item.analiseButtons.map(b => {\n        const st = trail.get(b.numero) || null;\n        const s = statusColors[st || 'pendente'] || statusColors.pendente;\n        return { numero: b.numero, statusLabel: s.label, statusColor: s.color };\n      });\n      delete item._norm;\n    }\n\n    return { items, hasItems: items.length > 0, noItems: items.length === 0 };\n  }\n\n  buildGeoObservacoesRaw() {\n    const analises = [\n      { numero: 1, data: '09/06/2025', docs: this.analise1DocsData },\n      { numero: 2, data: '11/07/2025', docs: this.analise2DocsData },\n      { numero: 3, data: '08/08/2025', docs: this.analise3DocsData },\n      { numero: 4, data: '10/12/2025', docs: this.analise4DocsData },\n      { numero: 5, data: '10/02/2026', docs: this.analise5DocsData },\n    ];\n    const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9\\s]/g, '').replace(/\\s+/g, ' ').trim();\n    const parseDate = (d) => { const [dd, mm, yyyy] = d.split('/').map(Number); return new Date(yyyy, mm - 1, dd); };\n    const ultimaData = parseDate(analises[analises.length - 1].data);\n\n    const boilerplate = new Set([\n      norm('O item encontra-se em condições de aprovação.'),\n    ]);\n\n    const map = new Map();\n    for (const an of analises) {\n      const perAnaliseSeen = new Map(); // key -> status (dedupe within this análise)\n      for (const doc of an.docs) {\n        for (const it of doc.items) {\n          const text = typeof it === 'string' ? it : it.text;\n          const status = typeof it === 'string' ? null : it.status;\n          if (!text || text.startsWith('[')) continue;\n          const key = norm(text);\n          if (!key || boilerplate.has(key)) continue;\n          if (!map.has(key)) map.set(key, { text, occurrences: [] });\n          // keep the last-seen status within this análise if the phrase appears in multiple docs\n          perAnaliseSeen.set(key, status);\n        }\n      }\n      for (const [key, status] of perAnaliseSeen) {\n        map.get(key).occurrences.push({ numero: an.numero, status, data: an.data });\n      }\n    }\n\n    const statusMap = { atendido: 'Atendido', parcial: 'Atendido Parcialmente', nao: 'Não Atendido', novo: 'Novo', pendente: 'Aguardando resposta' };\n    const items = [];\n    for (const entry of map.values()) {\n      if (entry.occurrences.length < 3) continue;\n      const occ = entry.occurrences.slice().sort((a, b) => a.numero - b.numero);\n      const first = occ[0];\n      const last = occ[occ.length - 1];\n      const currentStatusKey = last.status || 'pendente';\n      const diasSemSolucao = currentStatusKey === 'atendido' ? 0 : Math.round((ultimaData - parseDate(first.data)) / 86400000);\n      items.push({\n        text: entry.text,\n        analisesNumeros: occ.map(o => o.numero),\n        totalRepeticoes: occ.length,\n        statusKey: currentStatusKey,\n        statusLabel: statusMap[currentStatusKey] || 'Aguardando resposta',\n        diasSemSolucao,\n        ultimaAnaliseNumero: last.numero,\n      });\n    }\n    items.sort((a, b) => b.totalRepeticoes - a.totalRepeticoes || b.diasSemSolucao - a.diasSemSolucao || b.ultimaAnaliseNumero - a.ultimaAnaliseNumero);\n    return items;\n  }\n\n  buildGeoObservacoes() {\n    const raw = this.buildGeoObservacoesRaw();\n    const filter = this.state.geoObsFilter;\n    const statusColors = {\n      atendido: { color: '#2f8f4f', bg: '#eef8f0' },\n      parcial: { color: '#b5541f', bg: '#fdf1e8' },\n      nao: { color: '#c0392b', bg: '#fbeaea' },\n      novo: { color: '#2f6690', bg: '#eaf1f7' },\n      pendente: { color: '#8a94a3', bg: '#f4f6f8' },\n    };\n    let filtered = raw;\n    if (filter === '3') filtered = raw.filter(i => i.totalRepeticoes === 3);\n    else if (filter === '4') filtered = raw.filter(i => i.totalRepeticoes === 4);\n    else if (filter === '5+') filtered = raw.filter(i => i.totalRepeticoes >= 5);\n    else if (filter === 'nao') filtered = raw.filter(i => i.statusKey === 'nao');\n    else if (filter === 'parcial') filtered = raw.filter(i => i.statusKey === 'parcial');\n    else if (filter === 'criticos') filtered = raw.filter(i => i.totalRepeticoes >= 4 && i.statusKey !== 'atendido').sort((a, b) => b.diasSemSolucao - a.diasSemSolucao || b.totalRepeticoes - a.totalRepeticoes);\n\n    const items = filtered.map((i, idx) => ({\n      ...i, n: idx + 1,\n      analisesLabel: i.analisesNumeros.map(n => 'Análise ' + n).join(' · '),\n      statusColor: (statusColors[i.statusKey] || statusColors.pendente).color,\n      statusBg: (statusColors[i.statusKey] || statusColors.pendente).bg,\n    }));\n\n    const filterDefs = [\n      { key: 'todos', label: 'Todos' },\n      { key: '3', label: '3 Repetições' },\n      { key: '4', label: '4 Repetições' },\n      { key: '5+', label: '5+ Repetições' },\n      { key: 'nao', label: 'Não Atendidos' },\n      { key: 'parcial', label: 'Atendido Parcialmente' },\n      { key: 'criticos', label: 'Críticos' },\n    ];\n    const filterButtons = filterDefs.map(f => ({\n      key: f.key, label: f.label,\n      bg: filter === f.key ? (this.props.primaryColor ?? '#1f3a5f') : '#f4f6f8',\n      fg: filter === f.key ? '#fff' : '#5b6774',\n      select: () => this.setGeoObsFilter(f.key),\n    }));\n\n    return { items, filterButtons, hasItems: items.length > 0, noItems: items.length === 0, totalRecorrentes: raw.length };\n  }\n\n  buildGeoInsights() {\n    const totals = [this.analise1DocsData, this.analise2DocsData, this.analise3DocsData, this.analise4DocsData, this.analise5DocsData]\n      .map(docs => docs.reduce((s, d) => s + d.items.length, 0));\n    const n = totals.length;\n    const insights = [];\n    if (n >= 2) {\n      const last = totals[n - 1], prev = totals[n - 2];\n      const pct = prev ? Math.round(((last - prev) / prev) * 100) : 0;\n      const verbo = pct >= 0 ? 'aumento' : 'redução';\n      insights.push('A disciplina Geometria apresentou ' + verbo + ' de ' + Math.abs(pct) + '% no número de questionamentos entre as análises ' + (n - 1) + ' e ' + n + '.');\n    }\n    const labelTotals = {};\n    for (const docs of [this.analise1DocsData, this.analise2DocsData, this.analise3DocsData, this.analise4DocsData, this.analise5DocsData])\n      for (const d of docs) labelTotals[d.label] = (labelTotals[d.label] || 0) + d.items.length;\n    const topAssuntos = Object.entries(labelTotals).sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);\n    if (topAssuntos.length) {\n      insights.push('Os assuntos mais recorrentes continuam concentrados em ' + topAssuntos.join(' e ') + '.');\n    }\n    const raw = this.buildGeoObservacoesRaw();\n    insights.push('Atualmente existem ' + raw.length + ' ' + (raw.length === 1 ? 'item repetido' : 'itens repetidos') + ' há 3 ou mais análises consecutivas.');\n    return insights;\n  }\n\n  buildGeoDashboard() {\n    const allDocs = [this.analise1DocsData, this.analise2DocsData, this.analise3DocsData, this.analise4DocsData, this.analise5DocsData];\n    const totals = allDocs.map(docs => docs.reduce((s, d) => s + d.items.length, 0));\n    const totalQuestionamentos = totals.reduce((a, b) => a + b, 0);\n    const media = totalQuestionamentos / totals.length;\n\n    const statusOf = (it) => (typeof it === 'string' ? null : it.status);\n    const tally = (docs) => {\n      let atendido = 0, parcial = 0, nao = 0, novo = 0, pendente = 0, semStatus = 0;\n      for (const d of docs) for (const it of d.items) {\n        const s = statusOf(it);\n        if (s === 'atendido') atendido++;\n        else if (s === 'parcial') parcial++;\n        else if (s === 'nao') nao++;\n        else if (s === 'novo') novo++;\n        else if (s === 'pendente') pendente++;\n        else semStatus++;\n      }\n      return { atendido, parcial, nao, novo, pendente, semStatus };\n    };\n    const tallies = allDocs.map(tally);\n\n    const barMax = Math.max(...totals);\n    const questionamentosChart = totals.map((t, i) => ({ numero: i + 1, total: t, barPct: Math.round((t / barMax) * 100) }));\n    const evolColors = ['#4f8fc0', '#4f8fc0', '#4f8fc0', '#4f8fc0', '#e05a4e'];\n    const questionamentosChartV = totals.map((t, i) => ({ numero: i + 1, total: t, hPct: Math.round((t / barMax) * 100), color: i === totals.length - 1 ? '#e05a4e' : '#4f8fc0' }));\n\n    // Assuntos: aggregate item counts per document label across all análises\n    const labelTotals = {};\n    for (const docs of allDocs) for (const d of docs) {\n      labelTotals[d.label] = (labelTotals[d.label] || 0) + d.items.length;\n    }\n    const assuntoEntries = Object.entries(labelTotals).sort((a, b) => b[1] - a[1]);\n    const assuntoMax = Math.max(...assuntoEntries.map(e => e[1]));\n    const assuntosChart = assuntoEntries.map(([label, total]) => ({ label, total, barPct: Math.round((total / assuntoMax) * 100) }));\n    const assuntosChartV = assuntoEntries.map(([label, total], i) => ({ label, total, hPct: Math.round((total / assuntoMax) * 100), color: i % 2 === 0 ? '#4f8fc0' : '#7fb3d9' }));\n\n    // Comparativo sequencial (N vs N-1), % computed vs current análise's own total (except % atendidos, which is vs the PREVIOUS análise's total, per user's formula)\n    const comparativos = [];\n    for (let i = 1; i < totals.length; i++) {\n      const t = tallies[i];\n      const totalAtual = totals[i];\n      const totalAnterior = totals[i - 1];\n      const pct = (n, d) => d ? Math.round((n / d) * 100) : 0;\n      const pieSlices = [\n        { label: 'Atendidos', value: t.atendido, color: '#4f8fc0' },\n        { label: 'Novos', value: t.novo, color: '#e05a4e' },\n        { label: 'Reiterados', value: t.pendente, color: '#8aa5bd' },\n        { label: 'Parcial', value: t.parcial, color: '#f0a35a' },\n        { label: 'Não atendidos', value: t.nao, color: '#9b2c22' },\n      ].filter(s => s.value > 0);\n      const pieTotal = pieSlices.reduce((s, x) => s + x.value, 0) || 1;\n      let acc = 0;\n      const gradientStops = pieSlices.map(s => {\n        const start = (acc / pieTotal) * 360;\n        acc += s.value;\n        const end = (acc / pieTotal) * 360;\n        return s.color + ' ' + start.toFixed(1) + 'deg ' + end.toFixed(1) + 'deg';\n      });\n      const pieGradient = 'conic-gradient(' + gradientStops.join(', ') + ')';\n      const pieLegend = pieSlices.map(s => ({ ...s, pct: Math.round((s.value / pieTotal) * 100) }));\n\n      comparativos.push({\n        numero: i + 1, anterior: i,\n        totalAtual, totalAnterior,\n        pctAtendidos: pct(t.atendido, totalAnterior),\n        pctNovos: pct(t.novo, totalAtual),\n        pctReiterados: pct(t.atendido + t.parcial + t.nao + t.pendente, totalAtual),\n        pctParcial: pct(t.parcial, totalAtual),\n        pctNao: pct(t.nao, totalAtual),\n        pieGradient, pieLegend,\n      });\n    }\n\n    const filter = this.state.geoDashFilter;\n    const filterButtons = ['geral', '1', '2', '3', '4', '5'].map(f => ({\n      key: f, label: f === 'geral' ? 'Geral' : 'Análise ' + f,\n      bg: filter === f ? (this.props.primaryColor ?? '#1f3a5f') : '#fff',\n      fg: filter === f ? '#fff' : '#5b6774',\n      select: () => this.setGeoDashFilter(f),\n    }));\n\n    const itensRepetidos = this.buildGeoItensRepetidosSimple();\n\n    let focusTally = null;\n    if (filter !== 'geral') {\n      const idx = parseInt(filter) - 1;\n      const t = tallies[idx];\n      const total = totals[idx];\n      const pct = (n) => total ? Math.round((n / total) * 100) : 0;\n      focusTally = { numero: idx + 1, total, atendido: t.atendido, parcial: t.parcial, nao: t.nao, novo: t.novo,\n        pctAtendido: pct(t.atendido), pctParcial: pct(t.parcial), pctNao: pct(t.nao), pctNovo: pct(t.novo) };\n    }\n\n    return {\n      totalAnalises: totals.length,\n      totalQuestionamentos,\n      media: media.toFixed(1),\n      ultimaAnalise: 'Análise nº ' + totals.length,\n      questionamentosChart,\n      questionamentosChartV,\n      assuntosChart,\n      assuntosChartV,\n      comparativos,\n      itensRepetidos,\n      filterButtons,\n      isGeral: filter === 'geral',\n      focusTally,\n    };\n  }\n\n  buildGeoItensRepetidosSimple() {\n    const raw = this.buildGeoObservacoesRaw();\n    const statusColors = {\n      atendido: { color: '#4f8fc0', label: 'Atendido' },\n      parcial: { color: '#f0a35a', label: 'Atendido Parcialmente' },\n      nao: { color: '#e05a4e', label: 'Não Atendido' },\n      novo: { color: '#4f8fc0', label: 'Item Novo' },\n      pendente: { color: '#9fb3c8', label: 'Reiterando Análise Anterior' },\n    };\n    const pending = raw.filter(i => i.totalRepeticoes >= 3 && i.statusKey !== 'atendido');\n    const items = pending.map((i, idx) => ({\n      n: idx + 1, text: i.text,\n      statusLabel: (statusColors[i.statusKey] || statusColors.pendente).label,\n      statusColor: (statusColors[i.statusKey] || statusColors.pendente).color,\n      analiseNumeros: i.analisesNumeros,\n    }));\n    return { items, hasItems: items.length > 0, noItems: items.length === 0 };\n  }\n\n  buildAnaliseDisciplinas() {\n    const discOpen = (key) => !!this.state.expanded['disc-' + key];\n    return this.materiaMeta.map(m => {\n      const key = 'disc-' + m.key;\n      const analises = m.key === 'geometria' ? this.buildGeoAnalises() : [];\n      const dashboard = m.key === 'geometria' ? this.buildGeoDashboard() : null;\n      const observacoes = m.key === 'geometria' ? this.buildGeoObservacoes() : null;\n      return {\n        key: m.key, code: m.code, label: m.label,\n        iconBg: analises.length ? '#2f6690' : '#b7c0ca',\n        isOpen: discOpen(m.key), chevron: discOpen(m.key) ? '−' : '+', toggle: () => this.toggleCard('disc-' + m.key),\n        analises, hasAnalises: analises.length > 0, noAnalises: analises.length === 0, dashboard, observacoes,\n      };\n    });\n  }\n\n  renderVals() {\n    const active = this.state.active;\n    const navItems = [\n      { key: 'home', code: 'VG', label: 'Visão Geral', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'home' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('home') },\n      { key: 'analise', code: 'AN', label: 'Análise', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'analise' ? 'rgba(255,255,255,0.14)' : 'transparent', status: 'Aguardando dados', statusColor: 'rgba(255,255,255,0.5)', select: () => this.setActiveSection('analise') },\n      ...this.materiaMeta.map((m, i) => ({\n        key: m.key, code: m.code, label: m.label,\n        iconBg: m.modeled ? '#2f6690' : 'rgba(255,255,255,0.18)',\n        bg: active === m.key ? 'rgba(255,255,255,0.14)' : 'transparent',\n        status: m.modeled ? 'Modelo pronto' : 'Aguardando dados',\n        statusColor: m.modeled ? '#8fd3a0' : 'rgba(255,255,255,0.5)',\n        select: () => this.setActiveSection(m.key),\n      })),\n      { key: 'avisos', code: 'AV', label: 'Avisos', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'avisos' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('avisos') },\n      { key: 'consultas', code: 'CO', label: 'Consultas', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'consultas' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('consultas') },\n    ];\n\n    const materiaCards = this.materiaMeta.map(m => ({\n      key: m.key, code: m.code, label: m.label, desc: m.desc,\n      iconBg: m.modeled ? '#2f6690' : '#b7c0ca',\n      status: m.modeled ? 'Modelo pronto' : 'Aguardando dados',\n      statusColor: m.modeled ? '#2f8f4f' : '#8a94a3',\n      select: () => this.setActiveSection(m.key),\n    }));\n\n    const phaseColors = ['#2f6690', '#2f6690', '#b7c0ca', '#b7c0ca', '#b7c0ca', '#b7c0ca', '#b7c0ca'];\n    const timelinePhases = this.materiaMeta.map((m, i) => ({\n      label: m.label, color: phaseColors[i], left: i * (100 / 7), width: 100 / 7 - 1.5,\n    }));\n\n    const placeholderSections = this.materiaMeta.filter(m => !m.modeled).map((m, i) => ({\n      key: m.key, label: m.label, order: String(i + 3).padStart(2, '0'),\n      isActive: active === m.key,\n      topics: this.placeholderTopics[m.key],\n    }));\n\n    const scrub = this.state.terraScrub;\n    const vals = this.interp(scrub);\n    const diff = vals.terr - vals.proj;\n\n    return {\n      primaryColor: this.props.primaryColor ?? '#1f3a5f',\n      showIllustrativeTags: this.props.showIllustrativeTags ?? true,\n      isHome: active === 'home',\n      isGeometria: active === 'geometria',\n      isTerraplenagem: active === 'terraplenagem',\n      isAnalise: active === 'analise',\n      isAvisos: active === 'avisos',\n      isConsultas: active === 'consultas',\n      avisosTimeline: this.state.avisos.slice().sort((a, b) => (a.data < b.data ? 1 : -1)).map(a => ({ ...a, remove: () => this.removeAviso(a.id) })),\n      hasAvisos: this.state.avisos.length > 0,\n      noAvisos: this.state.avisos.length === 0,\n      avisoForm: this.state.avisoForm,\n      onAvisoData: (e) => this.setAvisoField('data', e.target.value),\n      onAvisoAutor: (e) => this.setAvisoField('autor', e.target.value),\n      onAvisoTexto: (e) => this.setAvisoField('texto', e.target.value),\n      onAddAviso: () => this.addAviso(),\n      consultasList: this.state.consultas.map(c => ({ ...c, remove: () => this.removeConsulta(c.id) })),\n      hasConsultas: this.state.consultas.length > 0,\n      onConsultaFile: (e) => this.addConsultaFile(e.target.files),\n      navItems,\n      materiaCards,\n      timelinePhases,\n      todayLeft: 26,\n      placeholderSections,\n      homeStats: { extensao: '35', materias: 7, modelos: 2 },\n      geoNums: { extensao: '32,02', classe: '1B', curvasPlanta: '40,1', curvasPerfil: '47,75', faixasAdicionais: 3 },\n      geoZoom: this.state.geoZoom,\n      geoPanX: this.state.geoPan.x,\n      geoPanY: this.state.geoPan.y,\n      geoCursor: this.state.dragging ? 'grabbing' : 'grab',\n      onZoomChange: (e) => this.onZoomChange(e),\n      onPanStart: (e) => this.onPanStart(e),\n      onPanMove: (e) => this.onPanMove(e),\n      onPanEnd: () => this.onPanEnd(),\n      geoTopics: this.geoTopicsData.map(t => ({\n        ...t, isOpen: !!this.state.expanded[t.key],\n        chevron: this.state.expanded[t.key] ? '−' : '+',\n        toggle: () => this.toggleCard(t.key),\n      })),\n      terraNums: { escavado: '850.000', aterro: '620.000', botafora: '230.000', dmt: '1.850' },\n      terraTerrPath: this.buildPath('terr'),\n      terraProjPath: this.buildPath('proj'),\n      terraMarkerX: scrub * 10,\n      terraMarkerTerrY: 220 - vals.terr,\n      terraMarkerProjY: 220 - vals.proj,\n      onScrubChange: (e) => this.onScrubChange(e),\n      terraScrub: scrub,\n      terraReadout: {\n        estaca: Math.round(scrub * 18.55),\n        terr: (vals.terr / 10 + 320).toFixed(1),\n        proj: (vals.proj / 10 + 320).toFixed(1),\n        diffLabel: (diff > 0 ? '+' : '') + (diff / 10).toFixed(1) + ' m (' + (diff > 0 ? 'corte' : 'aterro') + ')',\n        diffColor: diff > 0 ? '#1f3a5f' : '#b5541f',\n      },\n      terraTopics: this.terraTopicsData.map(t => ({\n        ...t, isOpen: !!this.state.expanded[t.key],\n        chevron: this.state.expanded[t.key] ? '−' : '+',\n        toggle: () => this.toggleCard(t.key),\n      })),\n      analiseDisciplinas: this.buildAnaliseDisciplinas(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
