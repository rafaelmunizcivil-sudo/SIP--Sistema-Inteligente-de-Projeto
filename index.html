  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"58586223-de3b-48a6-bc5e-3e33c0b82a3b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <style>\n    body{margin:0;font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}\n    a{color:#2f6690;}\n    a:hover{color:#1f3a5f;}\n    ::-webkit-scrollbar{width:10px;height:10px;}\n    ::-webkit-scrollbar-thumb{background:#c4ccd6;border-radius:6px;}\n  <\u002Fstyle>\n  \n  <script src=\"ee7e6990-1493-46e4-bdc6-7c76109bef0e\"><\u002Fscript>\n  <script src=\"7762b31d-c0f8-4d93-b876-b297f7324655\"><\u002Fscript>\n  <script src=\"f4a99e5a-6c12-4a9a-aca3-3c57bad2fcd1\"><\u002Fscript>\n  <script>\n    if (!window.__sipFirebaseApp) {\n      window.__sipFirebaseApp = firebase.initializeApp({\n        apiKey: \"AIzaSyDNBXkzFJFAsOKefmBesSWmwRHgS0i7ACA\",\n        authDomain: \"sip-sistema-intelig-de-projeto.firebaseapp.com\",\n        projectId: \"sip-sistema-intelig-de-projeto\",\n        storageBucket: \"sip-sistema-intelig-de-projeto.firebasestorage.app\",\n        messagingSenderId: \"957059964424\",\n        appId: \"1:957059964424:web:30ba5c315b713c2c05bbbd\"\n      });\n    }\n  <\u002Fscript>\n<\u002Fhelmet>\n\n\n<div style=\"display:flex;min-height:100vh;background:#eef1f4;color:#1f2933;\">\n\n  <nav style=\"width:264px;flex:0 0 264px;background:{{ primaryColor }};display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;\">\n    <div style=\"padding:20px 22px 18px;border-bottom:1px solid rgba(255,255,255,0.12);\">\n      <div style=\"background:#fff;border-radius:8px;padding:8px 12px;display:inline-block;margin-bottom:14px;\">\n        <img src=\"c998dbf2-fe20-470a-9549-ea9b5f256c6c\" alt=\"Consol Engenheiros Consultores\" style=\"display:block;height:28px;width:auto;\">\n      <\u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:0.12em;color:rgba(255,255,255,0.55);text-transform:uppercase;margin-bottom:4px;\">Rodovia MG-259<\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:700;color:#fff;line-height:1.3;\">Serro – Trinta Reis<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"8\">\n        <div sc-camel-on-click=\"{{ item.select }}\" style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ item.bg }};\" style-hover=\"background:rgba(255,255,255,0.08);\">\n          <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:{{ item.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;\">{{ item.code }}<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-size:13.5px;font-weight:600;color:#fff;white-space:pre-line;line-height:1.25;\">{{ item.label }}<\u002Fdiv>\n            <sc-if value=\"{{ item.status }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:10.5px;color:{{ item.statusColor }};margin-top:1px;\">{{ item.status }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ item.isGroup }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:14px;color:rgba(255,255,255,0.6);\">{{ item.chevron }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ item.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ item.children }}\" as=\"child\" hint-placeholder-count=\"7\">\n            <div sc-camel-on-click=\"{{ child.select }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 12px 8px 34px;border-radius:8px;cursor:pointer;background:{{ child.bg }};\" style-hover=\"background:rgba(255,255 nsRepetidos.noItems }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px;color:#9fb3c8;text-align:center;padding:10px;\">Nenhum item pendente com 3 ou mais repetições.<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ externaNoDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:40px;background:#f8f9fb;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n            <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Aguardando dados desta disciplina.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== AVISOS ===================== -->\n    <sc-if value=\"{{ isAvisos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Avisos\">\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Avisos<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Reuniões e Comunicados<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">Espaço para registrar o que foi conversado em reuniões com chefes de equipe e coordenadores, organizado como uma linha do tempo.<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasAvisos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:relative;padding-left:28px;\">\n            <div style=\"position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:#dde3ea;\"><\u002Fdiv>\n            <sc-for list=\"{{ avisosTimeline }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div style=\"position:relative;margin-bottom:22px;\">\n                <div style=\"position:absolute;left:-28px;top:4px;width:14px;height:14px;border-radius:50%;background:{{ primaryColor }};border:3px solid #eef1f4;\"><\u002Fdiv>\n                <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px 18px;\">\n                  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px;\">\n                    <div style=\"font-size:12.5px;font-weight:700;color:#1f3a5f;\">{{ a.data }}<\u002Fdiv>\n                    <div style=\"font-size:11px;font-weight:600;color:#2f6690;background:#eaf1f7;border-radius:20px;padding:2px 10px;\">{{ a.autor }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13px;color:#374151;line-height:1.55;margin-bottom:10px;\">{{ a.texto }}<\u002Fdiv>\n                  <a href=\"{{ a.arquivo }}\" target=\"_blank\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#2f6690;\">\n                    <span style=\"font-size:11px;font-weight:700;color:#fff;background:#c0392b;border-radius:4px;padding:2px 6px;\">PDF<\u002Fspan>\n                    {{ a.arquivoNome }}\n                  <\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noAvisos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:24px;background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;text-align:center;\">\n            <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhum registro ainda.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== CONSULTAS ===================== -->\n    <sc-if value=\"{{ isConsultas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Consultas\">\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Consultas<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Documentos para Consulta<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">Repositório de arquivos em PDF (normas, manuais, pareceres) para consulta rápida da equipe.<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasConsultas }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n            <sc-for list=\"{{ consultasList }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;\">\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:#c0392b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;\">PDF<\u002Fdiv>\n                  <div style=\"font-size:12.5px;font-weight:700;color:#1f2933;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ c.nome }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#8a94a3;\">Enviado em {{ c.dataUpload }}<\u002Fdiv>\n                <a href=\"{{ c.url }}\" target=\"_blank\" style=\"font-size:12px;font-weight:700;color:#2f6690;\">Abrir<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== MEDIÇÃO ===================== -->\n    <sc-if value=\"{{ isMedicao }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Medição\">\n\n        <sc-if value=\"{{ medicaoLocked }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-bottom:24px;\">\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Medição<\u002Fdiv>\n            <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Área restrita<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">Digite a senha para acessar o cronograma físico-financeiro.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #eef1f4;border-radius:10px;padding:24px;max-width:360px;\">\n            <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Senha<\u002Fdiv>\n            <input type=\"password\" value=\"{{ medicaoPasswordDraft }}\" sc-camel-on-change=\"{{ onMedicaoPasswordChange }}\" sc-camel-on-key-down=\"{{ onMedicaoPasswordKeyDown }}\" placeholder=\"Senha de acesso\" style=\"width:100%;font-size:13px;font-family:inherit;color:#1f2933;border:1px solid #dde3ea;border-radius:6px;padding:9px 12px;box-sizing:border-box;margin-bottom:12px;\">\n            <sc-if value=\"{{ showMedicaoPasswordError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:11.5px;color:#c0392b;margin-bottom:10px;\">Senha incorreta.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div sc-camel-on-click=\"{{ onMedicaoPasswordSubmit }}\" style=\"font-size:12.5px;font-weight:700;color:#fff;background:{{ primaryColor }};padding:9px 18px;border-radius:8px;cursor:pointer;width:fit-content;\">Entrar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ medicaoUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;\">\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Medição<\u002Fdiv>\n            <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Cronograma Físico-Financeiro<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:680px;line-height:1.6;\">Acompanhamento do orçamento da obra: quantidades e valores contratados x medidos, por item de serviço.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:10px;\">\n          <div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv>\n          <a href=\"NovaMedicao.html\" target=\"_blank\" rel=\"noopener\" style=\"display: block; box-sizing: border-box; text-align: center; font-size: 14px; font-weight: 700; color: #fff; background: {{ primaryColor }}; padding: 10px 14px; border-radius: 8px; white-space: nowrap\">+ Nova Medição<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px;\">\n          <div style=\"background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;padding:16px 18px;\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Total Contratado<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;color:#1f2933;\">{{ medicao.totalContrato }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;padding:16px 18px;\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Total Já Medido<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;color:#2f8f4f;\">{{ medicao.totalJaMedido }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;padding:16px 18px;\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Total a Medir<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;color:#b5541f;\">{{ medicao.totalASerMedido }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;padding:16px 18px;\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">% Medido Geral<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;color:#1f3a5f;\">{{ medicao.pctGeral }}%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;padding:16px 18px;\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Itens<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;color:#1f2933;\">{{ medicao.totalItens }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0f2942;border-radius:12px;padding:22px 24px;margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;color:#9fb3c8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px;\">Valor Medido por Mês (Cronograma)<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:14px;height:130px;\">\n            <sc-for list=\"{{ medicao.mensalChart }}\" as=\"mc\" hint-placeholder-count=\"8\">\n              <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;\">\n                <div style=\"font-size:9.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;\">{{ mc.valor }}<\u002Fdiv>\n                <div style=\"width:26px;background:#4f8fc0;border-radius:4px 4px 0 0;height:{{ mc.hPct }}%;min-height:3px;\"><\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#9fb3c8;\">{{ mc.mes }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <input value=\"{{ medicao.search }}\" sc-camel-on-change=\"{{ medicao.onSearchChange }}\" placeholder=\"Buscar por descrição do serviço...\" style=\"width:100%;font-size:13px;font-family:inherit;color:#1f2933;border:1px solid #dde3ea;border-radius:8px;padding:10px 14px;box-sizing:border-box;margin-bottom:10px;\">\n\n        <div sc-camel-on-click=\"{{ onToggleDescricoes }}\" style=\"width: 100%; box-sizing: border-box; text-align: left; font-size: 14px; font-weight: 700; color: {{ primaryColor }}; background: #fff; border: 1px solid {{ primaryColor }}; padding: 10px 14px; border-radius: 8px; cursor: pointer; margin-bottom: 16px\">Descrição dos Itens ({{ medicao.totalItens }})<\u002Fdiv>\n\n        <sc-if value=\"{{ medicaoShowDescricoes }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-if value=\"{{ medicao.hasRows }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <sc-for list=\"{{ medicao.rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <div style=\"background:#fff;border:1px solid #eef1f4;border-radius:10px;padding:14px 18px;\">\n                <div sc-camel-on-click=\"{{ r.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;flex-wrap:wrap;\">\n                  <div style=\"display:flex;align-items:center;gap:12px;flex:1;min-width:260px;\">\n                    <div style=\"font-size:11px;font-weight:700;color:#8a94a3;flex:0 0 auto;min-width:22px;\">{{ r.numero }}.<\u002Fdiv>\n                    <div style=\"font-size:13.5px;font-weight:600;color:#1f2933;\">{{ r.descricao }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#8a94a3;background:#f4f6f8;border-radius:10px;padding:2px 8px;white-space:nowrap;\">{{ r.unidade }}<\u002Fdiv>\n                  <\u002Fdiv>\n sec.order }} · {{ sec.label }}<\u002Fdiv>\n              <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">{{ sec.label }}<\u002Fh1>\n              <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">\n                Esta seção segue o mesmo padrão de Geometria e Terraplenagem. Assim que os dados\n                desta matéria forem enviados, os indicadores e gráficos serão adicionados aqui.\n              <\u002Fp>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:600;color:#8a94a3;background:#f4f6f8;border:1px solid #dde3ea;padding:5px 10px;border-radius:20px;white-space:nowrap;\">Aguardando dados<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n            <sc-for list=\"{{ sec.topics }}\" as=\"top\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1.5px dashed #c9d2db;border-radius:10px;padding:20px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;\">\n                <div style=\"font-size:13.5px;font-weight:700;color:#5b6774;\">{{ top }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#a5aeb8;margin-top:14px;\">Aguardando conteúdo<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;primaryColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f3a5f&quot;,&quot;options&quot;:[&quot;#1f3a5f&quot;,&quot;#14304f&quot;,&quot;#2f6690&quot;,&quot;#0f2942&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;showIllustrativeTags&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aparência&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    active: 'home',\n    expanded: {},\n    geoZoom: 1,\n    geoPan: { x: 0, y: 0 },\n    dragging: false,\n    dragStart: null,\n    terraScrub: 45,\n    geoDashFilter: 'geral',\n    geoObsFilter: 'todos',\n    timelineDisc: 'geometria',\n    timelineObs: {},\n    firestoreObs: {},\n    itensRepSelected: {},\n    itensRepHistorico: {},\n    medicaoUnlocked: false, medicaoPasswordDraft: '', medicaoPasswordError: false,\n    medicaoReal: {},\n  };\n\n  componentDidMount() {\n    this.waitForFirebaseObs(0);\n    this.waitForFirebaseMedicao(0);\n  }\n\n  medicaoSenha = 'consol2026';\n\n  waitForFirebaseMedicao(attempt) {\n    if (window.firebase && firebase.firestore) {\n      if (!firebase.apps || !firebase.apps.length) {\n        firebase.initializeApp({\n          apiKey: \"AIzaSyDNBXkzFJFAsOKefmBesSWmwRHgS0i7ACA\",\n          authDomain: \"sip-sistema-intelig-de-projeto.firebaseapp.com\",\n          projectId: \"sip-sistema-intelig-de-projeto\",\n          storageBucket: \"sip-sistema-intelig-de-projeto.firebasestorage.app\",\n          messagingSenderId: \"957059964424\",\n          appId: \"1:957059964424:web:30ba5c315b713c2c05bbbd\"\n        });\n      }\n      try {\n        firebase.firestore().collection('medicaoReal').onSnapshot(snap => {\n          const map = {};\n          snap.forEach(doc => {\n            const d = doc.data();\n            if (!map[d.numero]) map[d.numero] = {};\n            map[d.numero][d.mes] = d;\n          });\n          this.setState({ medicaoReal: map });\n        });\n      } catch (e) { console.error('Firestore medicao error:', e); }\n      return;\n    }\n    if (attempt > 100) return;\n    setTimeout(() => this.waitForFirebaseMedicao(attempt + 1), 100);\n  }\n\n  onMedicaoPasswordChange(e) {\n    this.setState({ medicaoPasswordDraft: e.target.value, medicaoPasswordError: false });\n  }\n\n  onMedicaoPasswordKeyDown(e) {\n    if (e && e.key === 'Enter') this.submitMedicaoPassword();\n  }\n\n  submitMedicaoPassword() {\n    if (this.state.medicaoPasswordDraft === this.medicaoSenha) {\n      this.setState({ medicaoUnlocked: true, medicaoPasswordError: false });\n    } else {\n      this.setState({ medicaoPasswordError: true });\n    }\n  }\n\n  waitForFirebaseObs(attempt) {\n    if (window.firebase && firebase.firestore) {\n      if (!firebase.apps || !firebase.apps.length) {\n        firebase.initializeApp({\n          apiKey: \"AIzaSyDNBXkzFJFAsOKefmBesSWmwRHgS0i7ACA\",\n          authDomain: \"sip-sistema-intelig-de-projeto.firebaseapp.com\",\n          projectId: \"sip-sistema-intelig-de-projeto\",\n          storageBucket: \"sip-sistema-intelig-de-projeto.firebasestorage.app\",\n          messagingSenderId: \"957059964424\",\n          appId: \"1:957059964424:web:30ba5c315b713c2c05bbbd\"\n        });\n      }\n      try {\n        firebase.firestore().collection('linhaTempoObservacoes').where('disc', '==', 'geometria')\n          .onSnapshot(snap => {\n            const map = {};\n            snap.forEach(doc => {\n              const d = doc.data();\n              if (!map[d.obsKey]) map[d.obsKey] = [];\n              map[d.obsKey].push(d);\n            });\n            this.setState({ firestoreObs: map });\n          });\n      } catch (e) { console.error('Firestore obs error:', e); }\n      this.syncAnalisesAgenda();\n      return;\n    }\n    if (attempt > 100) return;\n    setTimeout(() => this.waitForFirebaseObs(attempt + 1), 100);\n  }\n\n  // Espelha as datas de recebido/concluído de cada análise no Firestore, pra o Power\n  // Automate ler o status de prazo/atraso sem depender do código do site. Idempotente\n  // (set com merge) — roda toda vez que o site carrega, sem duplicar nada.\n  syncAnalisesAgenda() {\n    try {\n      const db = firebase.firestore();\n      Object.keys(this.disciplinaAnalisesReais).forEach(disc => {\n        const m risco geológico nas condições atuais, que pode se agravar com a execução do corte proposto — recomendada avaliação geomecânica pós-execução na fase de obra.', arquivo: 'assets/avisos/nota-tecnica-geologica.pdf', arquivoNome: 'Nota Técnica — Avaliação Geológica.pdf' },\n    { id: 4, data: '2026-06-10', autor: 'Andrea de Oliveira Prado (DER-MG) → Pedro Ladislau (Consol)', texto: 'DER-MG aprova o Plano de Sondagem do trecho MGC-259 Serro – Trinta Réis (restauração com implantação de acostamentos), em resposta ao RAP CE 026-2026. Observação: as coordenadas dos furos permanecem as mesmas das planilhas anteriores após as mudanças de posição.', arquivo: 'assets/avisos/aprovacao-plano-sondagem.pdf', arquivoNome: 'Aprovação do Plano de Sondagem.pdf' },\n    { id: 5, data: '2026-06-15', autor: 'Ismar Linhares Stangherlin (DER-MG, Núcleo de Projetos de Contenção) → Vilma Froes (Consol)', texto: 'Análise 01 do Núcleo de Projetos de Contenção para a rodovia MGC-259, trecho Serro – Trinta Réis.', arquivo: 'assets/avisos/analise-contencao.pdf', arquivoNome: 'Análise 01 — Núcleo de Projetos de Contenção.pdf' },\n  ];\n\n  consultasData = [\n    { id: 'anexo-i-termo-referencia', nome: 'ANEXO I - Termo de Referência', url: 'assets/docs/ANEXO I - Termo de Referencia.pdf', dataUpload: '15/07/2026' },\n  ];\n\n  // Dados reais extraídos da planilha \"260319 Planejamento 2026 TRINTA REIS FINAL REV01 Mapf.xlsx\"\n  // (cronograma físico-financeiro / orçamento da obra). Renumerado sequencialmente 1-74 (a planilha original pulava do item 73 pro 75, sem existir item 74).\n  medicaoItemsData = [{\"numero\":1,\"descricao\":\"Coordenação\",\"unidade\":\"u\",\"qtdContrato\":1,\"valorUnitContrato\":87136.95,\"totalContrato\":87136.95,\"qtdReal\":1,\"totalReal\":87136.95,\"totalJaMedido\":17775.9378,\"totalASerMedido\":69361.0122,\"pctMedidoAteFev\":0.20400000000000001,\"cronograma\":{\"maio\":{\"pct\":0.1,\"valor\":6936.1012200000005},\"junho\":{\"pct\":0.1,\"valor\":6936.1012200000005},\"julho e Interseções.', status: 'atendido' },\n      { text: 'Interseção 3: apresentar todos os elementos da interseção devidamente cotados.', status: 'atendido' },\n      { text: 'Interseção 3: a gota central da interseção deve avançar até a faixa de segurança do lado esquerdo da via.', status: 'novo' },\n      { text: 'Interseção 3: apresentar os estudos de curvas em planta com o Vehicle Tracking, utilizando o veículo tipo de projeto.', status: 'novo' },\n      { text: 'Interseção 3: apresentar malha de coordenadas na planta da interseção.', status: 'novo' },\n      { text: 'Interseção 3: apresentar o eixo auxiliar estaqueado que complementa a interseção junto às alças.', status: 'novo' },\n      { text: 'Interseção 3: apresentar a concordância horizontal entre os elementos da interseção.', status: 'novo' },\n      { text: 'Interseção 3: apresentar quadro de curvas dos eixos da interseção.', status: 'novo' },\n      { text: 'Interseção 3: apresentar perfil longitudinal da Alça B no padrão DER-MG, representando início e fim (estaca e cota) do alinhamento.', status: 'novo' },\n      { text: 'Interseção 3: apresentar compatibilização vertical (cotas) entre os alinhamentos considerando as superelevações.', status: 'novo' },\n    ] },\n    { key: 'anexo3d', label: 'Anexo 3D (Notas de Serviço e Planilhas de Volume)', items: [\n      { text: 'Apresentar nota de serviço do trecho.', status: 'novo' },\n      { text: 'Apresentar as notas de serviço das interseções.', status: 'novo' },\n      { text: 'Apresentar planilha de volumes do trecho.', status: 'novo' },\n      { text: 'Apresentar as planilhas de volume das interseções.', status: 'novo' },\n    ] },\n  ];\n\n  buildGeoAnalises() {\n    const a1docs = this.analise1DocsData.map(d => {\n      const items = d.items.map((text, i) => ({ n: i + 1, text, statusLabel: null, statusColor: '', statusBg: '' }));\n      return { key: 'a1-' + d.key, label: d.label, count: items.length, items, toggle: () => this.toggleCard('a1-' + d.key), isOpen: !!this.state.expanded['a1-' + d.key], chevron: this.state.expanded['a1-' + d.key] ? '−' : '+' };\n    });\n    const total1 = a1docs.reduce((s, d) => s + d.count, 0);\n\n    const buildDocs = (docsData, prefix) => docsData.map(d => {\n      const items = d.items.map((it, i) => ({ n: i + 1, text: it.text, statusLabel: this.statusMeta[it.status].label, statusColor: this.statusMeta[it.status].color, statusBg: this.statusMeta[it.status].bg }));\n      const key = prefix + '-' + d.key;\n      return { key, label: d.label, count: items.length, items, toggle: () => this.toggleCard(key), isOpen: !!this.state.expanded[key], chevron: this.state.expanded[key] ? '−' : '+' };\n    });\n    const tally = (docsData) => {\n      let atendido = 0, parcial = 0, nao = 0, novo = 0, pendente = 0;\n      for (const d of docsData) for (const it of d.items) {\n        if (it.status === 'atendido') atendido++;\n        else if (it.status === 'parcial') parcial++;\n        else if (it.status === 'nao') nao++;\n        else if (it.status === 'novo') novo++;\n        else if (it.status === 'pendente') pendente++;\n      }\n      const reiterando = atendido + parcial + nao + pendente;\n      return { atendido, parcial, nao, novo, pendente, reiterando };\n    };\n\n    const a2docs = buildDocs(this.analise2DocsData, 'a2');\n    const total2 = a2docs.reduce((s, d) => s + d.count, 0);\n    const { atendido, parcial, nao, novo, reiterando } = tally(this.analise2DocsData);\n\n    const a3docs = buildDocs(this.analise3DocsData, 'a3');\n    const total3 = a3docs.reduce((s, d) => s + d.count, 0);\n    const comp3 = tally(this.analise3DocsData);\n\n    const a4docs = buildDocs(this.analise4DocsData, 'a4');\n    const total4 = a4docs.reduce((s, d) => s + d.count, 0);\n    const comp4 = tally(this.analise4DocsData);\n\n    const a5docs = buildDocs(this.analise5DocsData, 'a5');\n    const total5 = a5docs.reduce((s, d) => s + d.count, 0);\n    const comp5 = tally(this.analise5DocsData);\n\n    const cardOpen = (key) => this.state.expanded[key] === undefined ? true : this.state.expanded[key];\n\n    return [\n      {\n        key: 'geo-analise-1', numero: 1, isFirst: true,\n        recebido: '02/06/2025', concluido: '09/06/2025', prazo: '20 dias', analista: 'Gabriel Angelo Felix da Silva',\n        total: total1, docs: a1docs,\n        isOpen: cardOpen('geo-analise-1'), chevron: cardOpen('geo-analise-1') ? '−' : '+', toggle: () => this.toggleCard('geo-analise-1'),\n      },\n      {\n        key: 'geo-analise-2', numero: 2, isFirst: false,\n        recebido: '07/07/2025', concluido: '11/07/2025', prazo: '20 dias', analista: 'Gabriel Angelo Felix da Silva',\n        total: total2, docs: a2docs,\n        comparativo: { reiterando, novo, atendido, parcial, nao },\n        isOpen: cardOpen('geo-analise-2'), chevron: cardOpen('geo-analise-2') ? '−' : '+', toggle: () => this.toggleCard('geo-analise-2'),\n      },\n      {\n        key: 'geo-analise-3', numero: 3, isFirst: false,\n        recebido: '31/07/2025', concluido: '08/08/2025', prazo: '20 dias', analista: 'Gabriel Angelo Felix da Silva',\n        total: total3, docs: a3docs,\n        comparativo: comp3,\n        isOpen: cardOpen('geo-analise-3'), chevron: cardOpen('geo-analise-3') ? '−' : '+', toggle: () => this.toggleCard('geo-analise-3'),\n      },\n      {\n        key: 'geo-analise-4', numero: 4, isFirst: false,\n        recebido: '28/11/2025', concluido: '10/12/2025', prazo: '20 dias', analista: 'Gabriel Angelo Felix da Silva',\n        total: total4, docs: a4docs,\n        comparativo: comp4,\n        isOpen: cardOpen('geo-analise-4'), chevron: cardOpen('geo-analise-4') ? '−' : '+', toggle: () => this.toggleCard('geo-analise-4'),\n      },\n      {\n        key: 'geo-analise-5', numero: 5, isFirst: false,\n        recebido: '30/01/2026', concluido: '10/02/2026', prazo: '20 dias', analista: 'Gabriel Angelo Felix da Silva',\n        total: total5, docs: a5docs,\n        comparativo: comp5,\n        isOpen: cardOpen('geo-analise-5'), chevron: cardOpen('geo-analise-5') ? '−' : '+', toggle: () => this.toggleCard('geo-analise-5'),\n      },\n    ];\n  }\n\n  setGeoDashFilter(f) {\n    this.setState({ geoDashFilter: f });\n  }\n\n  setTimelineDisc(key) {\n    this.setState({ timelineDisc: key });\n  }\n\n  setTimelineObs(key, value) {\n    this.setState(s => ({ timelineObs: { ...s.timelineObs, [key]: value } }));\n  }\n\n  parseBR(s) {\n    const [d, m, y] = s.split('/').map(Number);\n    return new Date(y, m - 1, d);\n  }\n\n  diffDays(a, b) {\n    return Math.round((b - a) / 86400000);\n  }\n\n  // Reads the Projetista's justification history for a late leg from Firestore (filled\n  // externally via ObservacaoProjetista.dc.html). New observation required day 1 of atraso,\n  // then again every 10 days while the atraso persists — each entry keeps its own date.\n  buildObsInfo(obsKey, atrasado) {\n    const formLink = 'ObservacaoProjetista.html';\n    const list = (this.state.firestoreObs[obsKey] || []).slice().sort((a, b) => this.tsMillis(a.criadoEm || a.preenchidoEm) - this.tsMillis(b.criadoEm || b.preenchidoEm));\n    const historico = list.map(d => ({ texto: d.texto || '', autor: d.nome || '', data: this.fmtTimestamp(d.criadoEm || d.preenchidoEm) }));\n    let obsPendente = false, proximaEm = '';\n    if (atrasado) {\n      if (!list.length) {\n        obsPendente = true;\n      } else {\n        const last = list[list.length - 1];\n        const lastTs = last.criadoEm || last.preenchidoEm;\n        const lastDate = lastTs && lastTs.toDate ? lastTs.toDate() : null;\n        if (lastDate) {\n          const dias = this.diffDays(lastDate, new Date());\n          obsPendente = dias >= 10;\n          if (!obsPendente) {\n            const prox = new Date(lastDate.getTime() + 10 * 86400000);\n            proximaEm = String(prox.getDate()).padStart(2, '0') + '/' + String(prox.getMonth() + 1).padStart(2, '0') + '/' + prox.getFullYear();\n          }\n        }\n      }\n    }\n    return { obsKey, obsPreenchida: historico.length > 0, historico, formLink, obsPendente, proximaEm };\n  }\n\n  tsMillis(ts) {\n    if (ts && ts.toMillis) return ts.toMillis();\n    return 0;\n  }\n\n  fmtTimestamp(ts) {\n    if (!ts || !ts.toDate) return '';\n    const d = ts.toDate();\n    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();\n  }\n\n  // Timeline (RAP-derived): built only from the real recebido/concluido dates already\n  // recorded per Análise de Geometria (analiseDisciplinas). PRAZO = 20 dias corridos,\n  // applied both to DER's análise turnaround and to the Projetista's response turnaround.\n  buildLinhaTempo() {\n    const PRAZO = 20;\n    const selected = this.state.timelineDisc;\n    const discButtons = this.materiaMeta.map(m => ({\n      key: m.key, label: m.label,\n      bg: selected === m.key ? (this.props.primaryColor ?? '#1f3a5f') : '#fff',\n      fg: selected === m.key ? '#fff' : '#5b6774',\n      select: () => this.setTimelineDisc(m.key),\n    }));\n\n    if (selected !== 'geometria') {\n      return { discButtons, hasTimelineData: false, noTimelineData: true };\n    }\n\n    const analises = this.disciplinaAnalisesReais.geometria;\n    const today = new Date();\n    const events = [];\n\n    analises.forEach((a, i) => {\n      const rec = this.parseBR(a.recebido), conc = this.parseBR(a.concluido);\n      const dias = this.diffDays(rec, conc);\n      const derObsKey = 'an-' + a.numero + '-der';\n      const legDER = {\n        sentido: 'DER → Projetista', recebido: a.recebido, concluido: a.concluido, tempo: dias + ' dias',\n        status: dias <= PRAZO ? 'Prazo Cumprido' : 'Atrasado',\n        statusColor: dias <= PRAZO ? '#2f8f4f' : '#c0392b',\n        atrasado: dias > PRAZO, semAtraso: dias <= PRAZO, obsKey: derObsKey, obsValue: this.state.timelineObs[derObsKey] || '',\n        onObsChange: (v) => this.setTimelineObs(derObsKey, v),\n      };\n\n      let legResp;\n      const proximo = analises[i + 1];\n      const respObsKey = 'an-' + a.numero + '-resp';\n      if (proximo) {\n        const dias2 = this.diffDays(conc, this.parseBR(proximo.recebido));\n        legResp = {\n          sentido: 'Projetista → DER', recebido: a.concluido, concluido: proximo.recebido, tempo: dias2 + ' dias',\n          status: dias2 <= PRAZO ? 'Prazo Cumprido' : 'Atrasado',\n          statusColor: dias2 <= PRAZO ? '#2f8f4f' : '#c0392b',\n          atrasado: dias2 > PRAZO, semAtraso: dias2 <= PRAZO,\n          ...this.buildObsInfo(respObsKey, dias2 > PRAZO),\n        };\n      } else {\n        const diasAbertos = this.diffDays(conc, today);\n        const restam = PRAZO - diasAbertos;\n        let status, statusColor;\n        if (restam < 0) { status = 'Atrasado'; statusColor = '#c0392b'; }\n        else if (restam <= 5) { status = 'Prazo Vencendo'; statusColor = '#c98a1c'; }\n        else { status = 'Dentro do Prazo'; statusColor = '#2f8f4f'; }\n        legResp = {\n          sentido: 'Projetista → DER', recebido: a.concluido, concluido: null, tempo: diasAbertos + ' dias (em aberto)',\n          status, statusColor,\n          atrasado: restam < 0, semAtraso: restam >= 0,\n          ...this.buildObsInfo(respObsKey, restam < 0),\n        };\n      }\n\n      const evKey = 'linha-an-' + a.numero;\n      events.push({\n        key: evKey, titulo: 'Análise ' + a.numero,\n        nodeColor: proximo ? '#2f6690' : '#8a94a3',\n        legDER, legResp, temResposta: true,\n        isOpen: !this.state.expanded[evKey],\n        chevron: !this.state.expanded[evKey] ? '−' : '+',\n        toggle: () => this.toggleCard(evKey),\n      });\n    });\n\n    const last = analises[analises.length - 1];\n    const diasDecorridos = this.diffDays(this.parseBR(last.concluido), today);\n    const restam = PRAZO - diasDecorridos;\n    let statusAtual, statusAtualColor;\n    if (restam < 0) { statusAtual = 'Atrasado'; statusAtualColor = '#c0392b'; }\n    else if (restam <= 5) { statusAtual = 'Prazo Vencendo'; statusAtualColor = '#c98a1c'; }\n    else { statusAtual = 'Dentro do Prazo'; statusAtualColor = '#2f8f4f'; }\n\n    return {\n      discButtons, hasTimelineData: true, noTimelineData: false,\n      ultimaEntregaProjetista: last.recebido,\n      ultimaEntregaDER: last.concluido,\n      responsavelAtual: 'Projetista',\n      statusAtual, statusAtualColor, diasDecorridos,\n      events,\n    };\n  }\n\n  setGeoObsFilter(f) {\n    this.setState({ geoObsFilter: f });\n  }\n\n  selectItemAnalise(key, numero) {\n    this.setState(s => ({ itensRepSelected: { ...s.itensRepSelected, [key]: s.itensRepSelected[key] === numero ? null : numero } }));\n  }\n\n  toggleItemHistorico(key) {\n    this.setState(s => ({ itensRepHistorico: { ...s.itensRepHistorico, [key]: !s.itensRepHistorico[key] } }));\n  }\n\n  buildGeoItensRepetidos() {\n    const raw = this.buildGeoObservacoesRaw();\n    const statusColors = {\n      atendido: { color: '#2f8f4f', bg: '#eef8f0', label: 'Atendido' },\n      parcial: { color: '#b5541f', bg: '#fdf1e8', label: 'Atendido Parcialmente' },\n      nao: { color: '#c0392b', bg: '#fbeaea', label: 'Não Atendido' },\n      novo: { color: '#2f6690', bg: '#eaf1f7', label: 'Item Novo' },\n      pendente: { color: '#8a94a3', bg: '#f4f6f8', label: 'Reiterando Análise Anterior' },\n    };\n    const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9\\s]/g, '').replace(/\\s+/g, ' ').trim();\n\n    const pending = raw.filter(i => i.totalRepeticoes >= 3 && i.statusKey !== 'atendido');\n\n    const items = pending.map((i, idx) => {\n      const key = norm(i.text);\n      const selected = this.state.itensRepSelected[key] ?? i.ultimaAnaliseNumero;\n      const historicoOpen = !!this.state.itensRepHistorico[key];\n      const primaryColor = this.props.primaryColor ?? '#1f3a5f';\n      const analiseButtons = i.analisesNumeros.map(numero => ({\n        numero,\n        bg: selected === numero ? primaryColor : '#f4f6f8',\n        fg: selected === numero ? '#fff' : '#5b6774',\n        select: () => this.selectItemAnalise(key, numero),\n      }));\n      // need per-analise status; re-derive from raw occurrences stored on the item (analisesNumeros aligns 1:1 with a status trail we don't retain) -\n      // rebuild via buildGeoObservacoesRaw's underlying map is not retained per numero->status here, so recompute quickly:\n      return {\n        n: idx + 1, key, text: i.text,\n        statusLabel: (statusColors[i.statusKey] || statusColors.pendente).label,\n        statusColor: (statusColors[i.statusKey] || statusColors.pendente).color,\n        statusBg: (statusColors[i.statusKey] || statusColors.pendente).bg,\n        totalRepeticoes: i.totalRepeticoes,\n        analiseButtons,\n        selectedNumero: selected,\n        historicoOpen, toggleHistorico: () => this.toggleItemHistorico(key),\n        historicoLabel: historicoOpen ? 'Ocultar Histórico' : 'Ver Histórico Completo',\n        _norm: key,\n      };\n    });\n\n    // attach per-análise status trail and selected-detail using a second pass over raw analise data\n    const analiseList = [\n      { numero: 1, docs: this.analise1DocsData },\n      { numero: 2, docs: this.analise2DocsData },\n      { numero: 3, docs: this.analise3DocsData },\n      { numero: 4, docs: this.analise4DocsData },\n      { numero: 5, docs: this.analise5DocsData },\n    ];\n    const statusByKeyByNumero = new Map();\n    for (const an of analiseList) {\n      for (const doc of an.docs) {\n        for (const it of doc.items) {\n          const text = typeof it === 'string' ? it : it.text;\n          const status = typeof it === 'string' ? null : it.status;\n          if (!text || text.startsWith('[')) continue;\n          const key = norm(text);\n          if (!statusByKeyByNumero.has(key)) statusByKeyByNumero.set(key, new Map());\n          statusByKeyByNumero.get(key).set(an.numero, status);\n        }\n      }\n    }\n\n    for (const item of items) {\n      const trail = statusByKeyByNumero.get(item._norm) || new Map();\n      const selStatus = trail.get(item.selectedNumero) || null;\n      const sc = statusColors[selStatus || 'pendente'] || statusColors.pendente;\n      item.selectedStatusLabel = sc.label;\n      item.selectedStatusColor = sc.color;\n      item.selectedStatusBg = sc.bg;\n      item.historico = item.analiseButtons.map(b => {\n        const st = trail.get(b.numero) || null;\n        const s = statusColors[st || 'pendente'] || statusColors.pendente;\n        return { numero: b.numero, statusLabel: s.label, statusColor: s.color };\n      });\n      delete item._norm;\n    }\n\n    return { items, hasItems: items.length > 0, noItems: items.length === 0 };\n  }\n\n  buildGeoObservacoesRaw() {\n    const analises = [\n      { numero: 1, data: '09/06/2025', docs: this.analise1DocsData },\n      { numero: 2, data: '11/07/2025', docs: this.analise2DocsData },\n      { numero: 3, data: '08/08/2025', docs: this.analise3DocsData },\n      { numero: 4, data: '10/12/2025', docs: this.analise4DocsData },\n      { numero: 5, data: '10/02/2026', docs: this.analise5DocsData },\n    ];\n    const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9\\s]/g, '').replace(/\\s+/g, ' ').trim();\n    const parseDate = (d) => { const [dd, mm, yyyy] = d.split('/').map(Number); return new Date(yyyy, mm - 1, dd); };\n    const ultimaData = parseDate(analises[analises.length - 1].data);\n\n    const boilerplate = new Set([\n      norm('O item encontra-se em condições de aprovação.'),\n    ]);\n\n    const map = new Map();\n    for (const an of analises) {\n      const perAnaliseSeen = new Map(); // key -> status (dedupe within this análise)\n      for (const doc of an.docs) {\n        for (const it of doc.items) {\n          const text = typeof it === 'string' ? it : it.text;\n          const status = typeof it === 'string' ? null : it.status;\n          if (!text || text.startsWith('[')) continue;\n          const key = norm(text);\n          if (!key || boilerplate.has(key)) continue;\n          if (!map.has(key)) map.set(key, { text, occurrences: [] });\n          // keep the last-seen status within this análise if the phrase appears in multiple docs\n          perAnaliseSeen.set(key, status);\n        }\n      }\n      for (const [key, status] of perAnaliseSeen) {\n        map.get(key).occurrences.push({ numero: an.numero, status, data: an.data });\n      }\n    }\n\n    const statusMap = { atendido: 'Atendido', parcial: 'Atendido Parcialmente', nao: 'Não Atendido', novo: 'Novo', pendente: 'Aguardando resposta' };\n    const items = [];\n    for (const entry of map.values()) {\n      if (entry.occurrences.length < 3) continue;\n      const occ = entry.occurrences.slice().sort((a, b) => a.numero - b.numero);\n      const first = occ[0];\n      const last = occ[occ.length - 1];\n      const currentStatusKey = last.status || 'pendente';\n      const diasSemSolucao = currentStatusKey === 'atendido' ? 0 : Math.round((ultimaData - parseDate(first.data)) / 86400000);\n      items.push({\n        text: entry.text,\n        analisesNumeros: occ.map(o => o.numero),\n        totalRepeticoes: occ.length,\n        statusKey: currentStatusKey,\n        statusLabel: statusMap[currentStatusKey] || 'Aguardando resposta',\n        diasSemSolucao,\n        ultimaAnaliseNumero: last.numero,\n      });\n    }\n    items.sort((a, b) => b.totalRepeticoes - a.totalRepeticoes || b.diasSemSolucao - a.diasSemSolucao || b.ultimaAnaliseNumero - a.ultimaAnaliseNumero);\n    return items;\n  }\n\n  buildGeoObservacoes() {\n    const raw = this.buildGeoObservacoesRaw();\n    const filter = this.state.geoObsFilter;\n    const statusColors = {\n      atendido: { color: '#2f8f4f', bg: '#eef8f0' },\n      parcial: { color: '#b5541f', bg: '#fdf1e8' },\n      nao: { color: '#c0392b', bg: '#fbeaea' },\n      novo: { color: '#2f6690', bg: '#eaf1f
