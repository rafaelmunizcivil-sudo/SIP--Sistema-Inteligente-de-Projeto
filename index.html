  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e1a1b23b-fad6-44b2-b323-e87faf07d3a7\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <style>\n    body{margin:0;font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}\n    a{color:#2f6690;}\n    a:hover{color:#1f3a5f;}\n    ::-webkit-scrollbar{width:10px;height:10px;}\n    ::-webkit-scrollbar-thumb{background:#c4ccd6;border-radius:6px;}\n    @keyframes sipFloatUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}\n    @keyframes sipBadgePulse{0%,100%{box-shadow:0 0 0 0 rgba(0,102,255,0.35);}50%{box-shadow:0 0 26px 6px rgba(0,102,255,0.30);}}\n    @keyframes sipShine{to{background-position:-200% 0;}}\n    .sip-hero-badge{animation:sipFloatUp 0.8s ease-out both, sipBadgePulse 3s ease-in-out infinite;}\n    .sip-hero-title{animation:sipFloatUp 0.9s ease-out 0.15s both, sipShine 5s linear infinite;}\n    .sip-hero-sub{animation:sipFloatUp 0.9s ease-out 0.32s both;}\n    .sip-hero-buttons{animation:sipFloatUp 0.9s ease-out 0.48s both;}\n    .sip-btn-primary{transition:transform 0.25s ease, box-shadow 0.25s ease;}\n    .sip-btn-primary:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 28px rgba(0,102,255,0.55);}\n    .sip-btn-secondary{transition:transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;}\n    .sip-btn-secondary:hover{transform:translateY(-2px) scale(1.03);background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.4);}\n  <\u002Fstyle>\n\n  \n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#eef1f4;font-size:14px;color:#1f2933;\">\n\n  <!-- ===================== LOADING ===================== -->\n  <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8a94a3;font-size:13px;\">Carregando…<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== ERRO FIRESTORE ===================== -->\n  <sc-if value=\"{{ isFirestoreError }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"width:420px;background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:28px 26px;text-align:center;\">\n        <div style=\"font-size:15px;font-weight:700;color:#c0392b;margin-bottom:8px;\">Sem acesso ao Firestore<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#5b6774;line-height:1.6;\">{{ firestoreError }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== CAPA ===================== -->\n  <sc-if value=\"{{ isCoverView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;min-height:100vh;overflow:hidden;background:#050505;\">\n      <canvas ref=\"{{ coverCanvasRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;\"><\u002Fcanvas>\n      <div style=\"position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:40px;text-align:center;\">\n        <div class=\"sip-hero-badge\" style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(120,150,255,0.35);backdrop-filter:blur(8px);color:rgba(220,230,255,0.85);font-size:12px;font-weight:700;letter-spacing:0.15em;padding:8px 18px;border-radius:999px;\">SIP PLATFORM<\u002Fdiv>\n        <div>\n          <div class=\"sip-hero-title\" style=\"font-size:96px;font-weight:800;letter-spacing:0.08em;line-height:1;background:linear-gradient(90deg,#fff,#8fb4ff,#ff8fae,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;\">SIP<\u002Fdiv>\n          <div class=\"sip-hero-sub\" style=\"margin-top:18px;font-size:19px;font-weight:600;color:#fff;\">Sistema Inteligente de Projetos<\u002Fdiv>\n          <div class=\"sip-hero-sub\" style=\"margin-top:8px;font-size:14.5px;color:rgba(255,255,255,0.55);white-space:nowrap;\">Transformando contratos, medições e análises de projetos em inteligência operacional.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sip-hero-buttons\" style=\"display:flex;align-items:center;gap:14px;\">\n          <div sc-camel-on-click=\"{{ enter }}\" class=\"sip-btn-primary\" style=\"cursor:pointer;background:#0066ff;color:#fff;font-weight:700;font-size:14px;padding:14px 32px;border-radius:8px;box-shadow:0 0 20px rgba(0,102,255,0.4);\">Entrar no Sistema<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ openSobre }}\" class=\"sip-btn-secondary\" style=\"cursor:pointer;background:transparent;color:#fff;font-weight:600;font-size:14px;padding:14px 32px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);\">Conhecer a Plataforma<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== SOBRE / CONHECER A PLATAFORMA ===================== -->\n  <sc-if value=\"{{ isSobreView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;background:#050505;color:#fff;display:flex;justify-content:center;padding:64px 24px;\">\n      <div style=\"max-width:680px;width:100%;\">\n        <div sc-camel-on-click=\"{{ closeSobre }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:40px;\">← Voltar<\u002Fdiv>\n\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.15em;color:#8fb4ff;margin-bottom:14px;\">SIP PLATFORM<\u002Fdiv>\n        <h1 style=\"margin:0 0 28px;font-size:40px;font-weight:800;line-height:1.15;\">SIP — Sistema Inteligente de Projetos<\u002Fh1>\n\n        <div style=\"font-size:15.5px;line-height:1.85;color:rgba(255,255,255,0.75);display:flex;flex-direction:column;gap:22px;text-align:justify;\">\n          <p style=\"margin:0;\">O SIP (Sistema Inteligente de Projetos) é a plataforma da Consol Engenheiros Consultores desenvolvida para acompanhar, de forma integrada, todo o ciclo de vida dos projetos de infraestrutura da empresa — desde os estudos iniciais e levantamentos técnicos até a emissão e impressão final dos projetos.<\u002Fp>\n\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#ff8fae;margin-bottom:8px;\">O QUE O SIP FAZ<\u002Fdiv>\n            <p style=\"margin:0 0 10px;\">O sistema centraliza, em um único ambiente, todas as informações relacionadas aos projetos, incluindo:<\u002Fp>\n            <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;\">\n              <li>As diferentes disciplinas envolvidas;<\u002Fli>\n              <li>O histórico completo de análises, pareceres e interações com os órgãos contratantes;<\u002Fli>\n              <li>O controle de medições e faturamento;<\u002Fli>\n              <li>A gestão de contratos com empresas terceirizadas;<\u002Fli>\n              <li>O acompanhamento do andamento e da evolução de cada entrega.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#ff8fae;margin-bottom:8px;\">OBJETIVO<\u002Fdiv>\n            <p style=\"margin:0 0 10px;\">O principal objetivo do SIP é substituir planilhas isoladas, e-mails dispersos e controles descentralizados por uma plataforma única, confiável e sempre atualizada.<\u002Fp>\n            <p style=\"margin:0 0 10px;\">Com isso, gestores e equipes podem visualizar rapidamente:<\u002Fp>\n            <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;\">\n              <li>O que já foi entregue;<\u002Fli>\n              <li>O que está pendente;<\u002Fli>\n              <li>Quais itens foram questionados pelos órgãos contratantes;<\u002Fli>\n              <li>O que já foi respondido ou solucionado;<\u002Fli>\n              <li>Todo o histórico de decisões e revisões do projeto.<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin:10px 0 0;\">Todas as informações são baseadas em documentos reais dos projetos, garantindo rastreabilidade, transparência e segurança dos dados.<\u002Fp>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#ff8fae;margin-bottom:8px;\">COMO FUNCIONA<\u002Fdiv>\n            <p style=\"margin:0 0 10px;\">Cada projeto possui um espaço exclusivo dentro do SIP, acessível por meio da barra lateral da plataforma.<\u002Fp>\n            <p style=\"margin:0 0 10px;\">Nesse ambiente são concentradas todas as informações, documentos, análises, indicadores e registros relacionados ao empreendimento. O sistema também cria uma linha do tempo completa do projeto, permitindo que gestores acompanhem sua evolução, identifiquem pontos críticos e tomem decisões com maior agilidade e assertividade.<\u002Fp>\n            <p style=\"margin:0;\">A estrutura do SIP foi concebida para ser padronizada e replicável, garantindo que todos os projetos da Consol Engenheiros Consultores sigam a mesma lógica de organização, controle e acompanhamento.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== APP SHELL ===================== -->\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;min-height:100vh;\">\n      <sc-if value=\"{{ isProjetosView }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"height:56px;flex:0 0 56px;background:#1f3a5f;display:flex;align-items:center;justify-content:space-between;padding:0 24px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <div sc-camel-on-click=\"{{ goProjetos }}\" style=\"font-size:13px;font-weight:700;color:#fff;letter-spacing:0.03em;cursor:pointer;\">SIP - Sistema Inteligente de Projetos<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:rgba(255,255,255,0.65);\">Modo aberto · sem login<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ crumbProjeto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"height:36px;flex:0 0 36px;background:#1f3a5f;display:flex;align-items:center;gap:8px;padding:0 24px;font-size:12px;color:rgba(255,255,255,0.75);\">\n          <div sc-camel-on-click=\"{{ goProjetos }}\" style=\"cursor:pointer;color:#fff;font-weight:700;\">SIP<\u002Fdiv>\n          <div>/<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goProjetos }}\" style=\"cursor:pointer;\">Projetos<\u002Fdiv>\n          <div>/<\u002Fdiv>\n          <div style=\"color:#fff;\">{{ crumbProjeto.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- LISTA DE PROJETOS -->\n      <sc-if value=\"{{ isProjetosView }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;\">\n          <div style=\"width:220px;flex:0 0 220px;background:#16283f;padding:20px 14px;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"background:#fff;border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;\">\n              <img src=\"7b606a89-058c-45b3-a04d-5b9f5b1ec02f\" alt=\"Consol Engenheiros Consultores\" style=\"display:block;height:26px;width:auto;\">\n            <\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:0.08em;text-transform:uppercase;padding:0 8px 4px;\">Projetos<\u002Fdiv>\n            <sc-for list=\"{{ projetos }}\" as=\"p\" hint-placeholder-count=\"1\">\n              <div sc-camel-on-click=\"{{ p.open }}\" style=\"padding:14px 16px;border-radius:10px;cursor:pointer;background:{{ p.bg }};box-shadow:0 6px 16px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);\">\n                <div style=\"font-size:13.5px;font-weight:700;color:{{ p.textColor }};\">{{ p.nome }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;font-weight:600;color:{{ p.textColor }};opacity:0.6;margin-top:2px;\">{{ p.rodovia }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:1;overflow:auto;padding:56px 40px;display:flex;justify-content:center;\">\n            <div style=\"max-width:720px;width:100%;\">\n              <div sc-camel-on-click=\"{{ goCover }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5b6774;margin-bottom:32px;\">← Voltar<\u002Fdiv>\n\n              <img src=\"7b606a89-058c-45b3-a04d-5b9f5b1ec02f\" alt=\"Consol Engenheiros Consultores\" style=\"display:block;height:34px;width:auto;margin-bottom:22px;\">\n              <h1 style=\"margin:0 0 6px;font-size:30px;font-weight:800;line-height:1.2;color:#1f3a5f;\">CONSOL ENGENHEIROS CONSULTORES<\u002Fh1>\n              <div style=\"font-size:16px;font-weight:600;color:#2f6690;margin-bottom:28px;\">Mais de 60 anos construindo caminhos para o futuro.<\u002Fdiv>\n\n              <div style=\"font-size:15px;line-height:1.85;color:#3a4552;display:flex;flex-direction:column;gap:20px;text-align:justify;\">\n                <p style=\"margin:0;\">Fundada em 21 de julho de 1960, a CONSOL ENGENHEIROS CONSULTORES nasceu com a missão de transformar ideias em grandes obras de infraestrutura. Desde o início, nos dedicamos a desenvolver projetos rodoviários, gerenciar e supervisionar obras, realizar estudos de viabilidade técnica especializada, sempre com foco em inovação, responsabilidade social e sustentabilidade ambiental. Com atuação pioneira em geotecnia e pavimentação, a CONSOL foi construída sobre a sólida experiência de seus fundadores — os engenheiros rodoviários Antônio Pimenta, Rafael Gontijo Assunção e Antônio Viçoso — e rapidamente se consolidou como referência no setor.<\u002Fp>\n\n                <p style=\"margin:0;\">No início dos anos 70, marcamos presença em programas estratégicos do Governo Federal, muitos deles financiados pelo BID e pelo Banco Mundial, expandindo nossa atuação para todas as regiões do país. A partir daí, crescemos juntos com o país na elaboração de Estudos e Projetos Executivos de Engenharia até o Gerenciamento e a Supervisão de grandes obras.<\u002Fp>\n\n                <div>\n                  <p style=\"margin:0 0 12px;\">Hoje, somos uma empresa de destaque na Engenharia Consultiva com um acervo técnico robusto e equipes multidisciplinares preparadas para atuar em diferentes setores:<\u002Fp>\n                  <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;\">\n                    <li>Rodoviário, ferroviário, hidroviário e aeroportuário<\u002Fli>\n                    <li>Planejamento urbano e saneamento básico<\u002Fli>\n                    <li>Estudos e projetos ambientais<\u002Fli>\n                    <li>Concessões Rodoviárias<\u002Fli>\n                  <\u002Ful>\n                <\u002Fdiv>\n\n                <p style=\"margin:0;\">Mais do que participar de obras, ajudamos a formar profissionais de excelência, que hoje ocupam posições estratégicas em órgãos e empresas de engenharia em todo o país.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PROJETO (MG-259) — tela cheia, com sua própria barra lateral -->\n      <sc-if value=\"{{ isProjetoMG259 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Infraestrutura\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PROJETO (Araçuaí – Novo Cruzeiro) — tela cheia, com sua própria barra lateral -->\n      <sc-if value=\"{{ isProjetoAracuai }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Aracuai-Novo Cruzeiro\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProjetoRubim }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Rubim-Rio do Prado\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PROJETO sem conteúdo -->\n      <sc-if value=\"{{ isProjetoVazio }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;padding:40px;\">\n          <div style=\"padding:40px;background:#fff;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n            <div style=\"font-size:13px;font-weight:600;color:#8a94a3;\">Este projeto ainda não tem um site modelado.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    authResolved: false,\n    firestoreError: '',\n    entered: false,\n    showSobre: false,\n    view: 'projetos', // 'projetos' | 'projeto'\n    selectedProjetoId: null,\n    projetos: [],\n    dataLoaded: false,\n  };\n\n  coverCanvasRef = React.createRef();\n\n  initHero() {\n    const canvas = this.coverCanvasRef.current;\n    if (!canvas || this.heroInited) return;\n    this.heroInited = true;\n    const ctx = canvas.getContext('2d');\n    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };\n    resize();\n    window.addEventListener('resize', resize);\n    this._heroResize = resize;\n\n    const isSmall = window.innerWidth < 700;\n    const nodes = [];\n    for (let i = 0; i < (isSmall ? 32 : 70); i++) {\n      nodes.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25 });\n    }\n    const particles = [];\n    for (let i = 0; i < (isSmall ? 22 : 55); i++) {\n      particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, r: Math.random() * 1.6 + 0.6, hue: Math.random() < 0.5 ? 'rgba(0,102,255,' : 'rgba(255,45,85,' });\n    }\n    this.mouse = { x: canvas.width / 2, y: canvas.height / 2, active: false };\n    const onMove = (e) => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; this.mouse.active = true; };\n    const onLeave = () => { this.mouse.active = false; };\n    window.addEventListener('mousemove', onMove);\n    window.addEventListener('mouseleave', onLeave);\n    this._heroMove = onMove;\n    this._heroLeave = onLeave;\n\n    const draw = () => {\n      this.rafId = requestAnimationFrame(draw);\n      if (this.state.entered) return;\n      const w = canvas.width, h = canvas.height;\n      ctx.clearRect(0, 0, w, h);\n      ctx.fillStyle = '#050505';\n      ctx.fillRect(0, 0, w, h);\n\n      const t = Date.now() / 6000;\n      const b1x = w * 0.3 + Math.sin(t) * w * 0.15, b1y = h * 0.35 + Math.cos(t * 0.8) * h * 0.12;\n      const g1 = ctx.createRadialGradient(b1x, b1y, 0, b1x, b1y, w * 0.5);\n      g1.addColorStop(0, 'rgba(0,102,255,0.35)'); g1.addColorStop(1, 'rgba(0,102,255,0)');\n      ctx.fillStyle = g1; ctx.fillRect(0, 0, w, h);\n\n      const b2x = w * 0.7 + Math.cos(t * 0.7) * w * 0.15, b2y = h * 0.65 + Math.sin(t * 0.9) * h * 0.12;\n      const g2 = ctx.createRadialGradient(b2x, b2y, 0, b2x, b2y, w * 0.5);\n      g2.addColorStop(0, 'rgba(255,45,85,0.30)'); g2.addColorStop(1, 'rgba(255,45,85,0)');\n      ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);\n\n      if (this.mouse.active) {\n        const gm = ctx.createRadialGradient(this.mouse.x, this.mouse.y, 0, this.mouse.x, this.mouse.y, 260);\n        gm.addColorStop(0, 'rgba(120,140,255,0.18)'); gm.addColorStop(1, 'rgba(120,140,255,0)');\n        ctx.fillStyle = gm; ctx.fillRect(0, 0, w, h);\n      }\n\n      for (const n of nodes) {\n        n.x += n.vx; n.y += n.vy;\n        if (n.x < 0 || n.x > w) n.vx *= -1;\n        if (n.y < 0 || n.y > h) n.vy *= -1;\n      }\n      for (let i = 0; i < nodes.length; i++) {\n        for (let j = i + 1; j < nodes.length; j++) {\n          const a = nodes[i], b = nodes[j];\n          const dx = a.x - b.x, dy = a.y - b.y;\n          const dist = Math.sqrt(dx * dx + dy * dy);\n          if (dist < 140) {\n            let alpha = (1 - dist / 140) * 0.25;\n            if (this.mouse.active) {\n              const mdA = Math.hypot(a.x - this.mouse.x, a.y - this.mouse.y);\n              const mdB = Math.hypot(b.x - this.mouse.x, b.y - this.mouse.y);\n              if (mdA < 220 || mdB < 220) alpha = Math.min(1, alpha + 0.5);\n            }\n            ctx.strokeStyle = 'rgba(140,170,255,' + alpha + ')';\n            ctx.lineWidth = 1;\n            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();\n          }\n        }\n      }\n      for (const n of nodes) {\n        let r = 1.6, alpha = 0.5;\n        if (this.mouse.active) {\n          const d = Math.hypot(n.x - this.mouse.x, n.y - this.mouse.y);\n          if (d < 220) { const boost = 1 - d / 220; r = 1.6 + boost * 2.2; alpha = 0.5 + boost * 0.5; }\n        }\n        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2);\n        ctx.fillStyle = 'rgba(180,200,255,' + alpha + ')';\n        ctx.fill();\n      }\n\n      for (const p of particles) {\n        p.x += p.vx; p.y += p.vy;\n        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;\n        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;\n        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);\n        ctx.fillStyle = p.hue + '0.55)';\n        ct
