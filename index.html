      pctAtendido: pct(t.atendido), pctParcial: pct(t.parcial), pctNao: pct(t.nao), pctNovo: pct(t.novo) };\n    }\n\n    return {\n      totalAnalises: totals.length,\n      totalQuestionamentos,\n      media: media.toFixed(1),\n      ultimaAnalise: 'Análise nº ' + totals.length,\n      questionamentosChart,\n      questionamentosChartV,\n      assuntosChart,\n      assuntosChartV,\n      comparativos,\n      itensRepetidos,\n      filterButtons,\n      isGeral: filter === 'geral',\n      focusTally,\n    };\n  }\n\n  buildGeoItensRepetidosSimple() {\n    const raw = this.buildGeoObservacoesRaw();\n    const statusColors = {\n      atendido: { color: '#4f8fc0', label: 'Atendido' },\n      parcial: { color: '#f0a35a', label: 'Atendido Parcialmente' },\n      nao: { color: '#e05a4e', label: 'Não Atendido' },\n      novo: { color: '#4f8fc0', label: 'Item Novo' },\n      pendente: { color: '#9fb3c8', label: 'Reiterando Análise Anterior' },\n    };\n    const pending = raw.filter(i => i.totalRepeticoes >= 3 && i.statusKey !== 'atendido');\n    const items = pending.map((i, idx) => ({\n      n: idx + 1, text: i.text,\n      statusLabel: (statusColors[i.statusKey] || statusColors.pendente).label,\n      statusColor: (statusColors[i.statusKey] || statusColors.pendente).color,\n      analiseNumeros: i.analisesNumeros,\n    }));\n    return { items, hasItems: items.length > 0, noItems: items.length === 0 };\n  }\n\n  fmtMoney(n) {\n    if (n === null || n === undefined || isNaN(n)) return '—';\n    return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  }\n\n  fmtNum(n) {\n    if (n === null || n === undefined || isNaN(n)) return '—';\n    return n.toLocaleString('pt-BR', { maximumFractionDigits: 2 });\n  }\n\n  medicaoMesesOrdem = ['maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];\n  medicaoMesesLabel = { maio: 'Mai/26', junho: 'Jun/26', julho: 'Jul/26', agosto: 'Ago/26', setembro: 'Set/26', outubro: 'Out/26', novembro: 'Nov/26', dezembro: 'Dez/26' };\n  // Data de início de contrato — PLACEHOLDER, ajustar quando o usuário confirmar a data real de assinatura.\n  medicaoContratoInicio = '2025-01-01';\n\n  // Classificação automática por palavra-chave: qualquer item novo inserido em medicaoItemsData\n  // já cai na disciplina certa sem precisar marcar manualmente. Chave = mesma da barra lateral (materiaMeta).\n  medicaoDisciplinaKeywords = {\n    geometria: ['geométric', 'traçado'],\n    terraplenagem: ['terraplenagem', 'geotécnic', 'sondagem', 'penetrômetro', 'trado'],\n    pavimentacao: ['pavimento', 'iri', 'irregularidade', 'deflect', 'igg', 'flecha'],\n    drenagem: ['drenagem', 'estabiliza'],\n    obras: ['obra-de-arte', 'oae', 'bueiro', 'obras complementares'],\n    desapropriacao: ['desapropriação'],\n    intersecao: ['interseção'],\n    seguranca: ['segurança viária'],\n    topografia: ['topográfic'],\n    meioambiente: ['ambiental', 'rca', 'pca', 'prad', 'pia', 'ptrf', 'florest', 'biosfera', 'conservação'],\n    sinalizacao: ['sinalização'],\n  };\n\n  medicaoDisciplinaDeItem(descricao) {\n    const d = descricao.toLowerCase();\n    for (const key of Object.keys(this.medicaoDisciplinaKeywords)) {\n      if (this.medicaoDisciplinaKeywords[key].some(kw => d.includes(kw))) return key;\n    }\n    return null;\n  }\n\n  buildMedicaoDashboard() {\n    const items = this.medicaoItemsData;\n    const efetivos = items.map(i => ({ i, ef: this.medicaoItemEfetivo(i) }));\n    const totalContrato = items.reduce((s, i) => s + (i.totalContrato || 0), 0);\n    const totalJaMedido = efetivos.reduce((s, x) => s + x.ef.totalJaMedido, 0);\n    const totalASerMedido = efetivos.reduce((s, x) => s + x.ef.totalASerMedido, 0);\n\n    const inicio = new Date(this.medicaoContratoInicio);\n    const hoje = new Date();\n    const mesesAtivo = Math.max(1, (hoje.getFullYear() - inicio.getFullYear()) * 12 + (hoje.getMonth() - inicio.getMonth()) + 1);\n\n    const filterOpts = [\n      { key: 'contrato', label: 'Total Contrato', value: this.fmtMoney(totalContrato), color: '#1f3a5f' },\n      { key: 'medido', label: 'Total Medido', value: this.fmtMoney(totalJaMedido), color: '#2f8f4f' },\n      { key: 'amedir', label: 'Total a Medir', value: this.fmtMoney(totalASerMedido), color: '#b5541f' },\n      { key: 'meses', label: 'Meses de Contrato Ativo', value: String(mesesAtivo), color: '#2f6690' },\n    ];\n    const filter = this.state.medicaoDashFilter || 'contrato';\n    const active = filterOpts.find(f => f.key === filter) || filterOpts[0];\n\n    // Pizza: meses medidos (reais) e seus valores\n    const mesToNum = { maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };\n    const mesAtualNum = hoje.getMonth() + 1;\n    const mesesComDado = this.medicaoMesesOrdem.filter(m => mesToNum[m] <= mesAtualNum);\n    const porMes = mesesComDado.map(m => ({\n      mes: this.medicaoMesesLabel[m],\n      valor: items.reduce((s, i) => {\n        const real = this.state.medicaoReal[i.numero] && this.state.medicaoReal[i.numero][m];\n        return s + (real ? (real.valorMedido || 0) : 0);\n      }, 0),\n    })).filter(x => x.valor > 0);\n    const pieCores = ['#4f8fc0', '#2f8f4f', '#b5541f', '#8a5fc0', '#c04f8f', '#4fc0a5', '#c0954f', '#6b7fc0'];\n    const totalPie = porMes.reduce((s, x) => s + x.valor, 0) || 1;\n    let acc = 0;\n    const pieSlices = porMes.map((x, idx) => {\n      const pct = (x.valor / totalPie) * 100;\n      const slice = { color: pieCores[idx % pieCores.length], from: acc, to: acc + pct };\n      acc += pct;\n      return slice;\n    });\n    const pieGradient = pieSlices.length\n      ? 'conic-gradient(' + pieSlices.map(s => s.color + ' ' + s.from.toFixed(1) + '% ' + s.to.toFixed(1) + '%').join(', ') + ')'\n      : '#eef1f4';\n    const pieLegend = porMes.map((x, idx) => ({ color: pieCores[idx % pieCores.length], label: x.mes, valor: this.fmtMoney(x.valor) }));\n    const hasPie = porMes.length > 0;\n\n    // Barras horizontais: % medido por disciplina (materiaMeta = fonte única, mesma da barra lateral)\n    const porDisciplina = this.materiaMeta.map(mat => {\n      const itensDaDisciplina = efetivos.filter(x => this.medicaoDisciplinaDeItem(x.i.descricao) === mat.key);\n      if (!itensDaDisciplina.length) return null;\n      const totalReal = itensDaDisciplina.reduce((s, x) => s + (x.i.totalReal || 0), 0);\n      const totalMed = itensDaDisciplina.reduce((s, x) => s + x.ef.totalJaMedido, 0);\n      const pct = totalReal ? Math.round((totalMed / totalReal) * 100) : 0;\n      return { label: mat.label, pct, itens: itensDaDisciplina.length };\n    }).filter(Boolean).sort((a, b) => b.pct - a.pct);\n\n    return {\n      filterOpts: filterOpts.map(f => ({ ...f, isActive: f.key === filter, bg: f.key === filter ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.08)', fg: f.key === filter ? '#0f2942' : '#fff', select: () => this.setState({ medicaoDashFilter: f.key }) })),\n      activeLabel: active.label, activeValue: active.value, activeColor: active.color,\n      pieGradient, pieLegend, hasPie, noPie: !hasPie,\n      porDisciplina, hasDisciplinas: porDisciplina.length > 0,\n    };\n  }\n\n  // Aplica por cima do item base os valores realmente medidos enviados via \"Nova Medição\"\n  // (Firestore, coleção medicaoReal) — recalcula % medido, total já medido e total a medir.\n  medicaoItemEfetivo(i) {\n    const realByMonth = this.state.medicaoReal[i.numero] || {};\n    const realSum = this.medicaoMesesOrdem.reduce((s, m) => s + (realByMonth[m] ? (realByMonth[m].valorMedido || 0) : 0), 0);\n    const totalJaMedido = (i.totalJaMedido || 0) + realSum;\n    const totalASerMedido = Math.max((i.totalReal || 0) - totalJaMedido, 0);\n    const pct = i.totalReal ? Math.round((totalJaMedido / i.totalReal) * 100) : 0;\n    return { totalJaMedido, totalASerMedido, pct, realByMonth };\n  }\n\n  buildMedicao() {\n    const items = this.medicaoItemsData;\n    const meses = this.medicaoMesesOrdem;\n    const mesesLabel = this.medicaoMesesLabel;\n\n    const efetivos = items.map(i => ({ i, ef: this.medicaoItemEfetivo(i) }));\n    const totalContrato = items.reduce((s, i) => s + (i.totalContrato || 0), 0);\n    const totalReal = items.reduce((s, i) => s + (i.totalReal || 0), 0);\n    const totalJaMedido = efetivos.reduce((s, x) => s + x.ef.totalJaMedido, 0);\n    const totalASerMedido = efetivos.reduce((s, x) => s + x.ef.totalASerMedido, 0);\n    const pctGeral = totalReal ? Math.round((totalJaMedido / totalReal) * 100) : 0;\n\n    const mesToNum = { maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };\n    const mesAtualNum = new Date().getMonth() + 1;\n    const mesesAteAgora = meses.filter(m => mesToNum[m] <= mesAtualNum);\n    const mensal = mesesAteAgora.map(m => ({\n      mes: mesesLabel[m],\n      valor: items.reduce((s, i) => {\n        const real = this.state.medicaoReal[i.numero] && this.state.medicaoReal[i.numero][m];\n        return s + (real ? (real.valorMedido || 0) : 0);\n      }, 0),\n    }));\n    const mensalMax = Math.max(...mensal.map(m => m.valor), 1);\n    const mensalChart = mensal.map(m => ({ mes: m.mes, valor: this.fmtMoney(m.valor), hPct: Math.round((m.valor / mensalMax) * 100) }));\n\n    const search = (this.state.medicaoSearch || '').toLowerCase();\n    const filtered = search ? efetivos.filter(x => x.i.descricao.toLowerCase().includes(search)) : efetivos;\n\n    const rows = filtered.map(({ i, ef }) => {\n      const key = 'med-' + i.numero;\n      return {\n        numero: i.numero, descricao: i.descricao, unidade: i.unidade,\n        qtdContrato: this.fmtNum(i.qtdContrato), valorUnitContrato: this.fmtMoney(i.valorUnitContrato),\n        totalContrato: this.fmtMoney(i.totalContrato), totalJaMedido: this.fmtMoney(ef.totalJaMedido),\n        totalASerMedido: this.fmtMoney(ef.totalASerMedido),\n        pct: ef.pct, pctColor: ef.pct >= 100 ? '#2f8f4f' : ef.pct > 0 ? '#4f8fc0' : '#8a94a3',\n        isOpen: !!this.state.expanded[key], toggle: () => this.toggleCard(key), chevron: this.state.expanded[key] ? '−' : '+',\n        cronogramaReal: meses.filter(m => ef.realByMonth[m]).map(m => {\n          const real = ef.realByMonth[m];\n          return { label: mesesLabel[m], pct: Math.round(((real.valorMedido || 0) / (i.totalReal || 1)) * 100), valor: this.fmtMoney(real.valorMedido) };\n        }),\n        hasReal: meses.some(m => ef.realByMonth[m]),\n        noReal: !meses.some(m => ef.realByMonth[m]),\n        valorAcumAteJan: this.fmtMoney(i.valorAcumAteJan),\n        valorFev11Med: this.fmtMoney(i.valorFev11Med),\n        previstoRestante: this.fmtMoney(ef.totalASerMedido),\n      };\n    });\n\n    return {\n      totalContrato: this.fmtMoney(totalContrato), totalReal: this.fmtMoney(totalReal), totalJaMedido: this.fmtMoney(totalJaMedido),\n      totalASerMedido: this.fmtMoney(totalASerMedido), pctGeral, totalItens: items.length,\n      mensalChart, rows, hasRows: rows.length > 0, noRows: rows.length === 0,\n      search: this.state.medicaoSearch || '',\n      onSearchChange: (e) => this.setState({ medicaoSearch: e.target.value }),\n    };\n  }\n\n  buildAnaliseDisciplinas() {\n    const discOpen = (key) => !!this.state.expanded['disc-' + key];\n    return this.materiaMeta.map(m => {\n      const key = 'disc-' + m.key;\n      const analises = m.key === 'geometria' ? this.buildGeoAnalises() : [];\n      const dashboard = m.key === 'geometria' ? this.buildGeoDashboard() : null;\n      const observacoes = m.key === 'geometria' ? this.buildGeoObservacoes() : null;\n      return {\n        key: m.key, code: m.code, label: m.label,\n        iconBg: analises.length ? '#2f6690' : '#b7c0ca',\n        isOpen: discOpen(m.key), chevron: discOpen(m.key) ? '−' : '+', toggle: () => this.toggleCard('disc-' + m.key),\n        analises, hasAnalises: analises.length > 0, noAnalises: analises.length === 0, dashboard, observacoes,\n      };\n    });\n  }\n\n  renderVals() {\n    const active = this.state.active;\n    const navDisciplinasOpen = !!this.state.expanded['nav-disciplinas'];\n    const navItems = [\n      { key: 'home', code: 'VG', label: 'Visão Geral', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'home' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('home') },\n      { key: 'analise', code: 'AN', label: 'Análise', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'analise' ? 'rgba(255,255,255,0.14)' : 'transparent', status: 'Aguardando dados', statusColor: 'rgba(255,255,255,0.5)', select: () => this.setActiveSection('analise') },\n      { key: 'linha-tempo', code: 'LT', label: 'Linha do Tempo', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'linha-tempo' ? 'rgba(255,255,255,0.14)' : 'transparent', status: 'Aguardando dados', statusColor: 'rgba(255,255,255,0.5)', select: () => this.setActiveSection('linha-tempo') },\n      {\n        key: 'disciplinas', code: 'DI', label: 'Disciplina', iconBg: 'rgba(255,255,255,0.18)',\n        bg: this.materiaMeta.some(m => active === m.key) ? 'rgba(255,255,255,0.14)' : 'transparent',\n        status: null, isGroup: true, isOpen: navDisciplinasOpen, chevron: navDisciplinasOpen ? '−' : '+',\n        select: () => this.toggleCard('nav-disciplinas'),\n        children: this.materiaMeta.map(m => ({\n          key: m.key, code: m.code, label: m.label,\n          iconBg: m.modeled ? '#2f6690' : 'rgba(255,255,255,0.18)',\n          bg: active === m.key ? 'rgba(255,255,255,0.14)' : 'transparent',\n          status: m.modeled ? 'Modelo pronto' : 'Aguardando dados',\n          statusColor: m.modeled ? '#8fd3a0' : 'rgba(255,255,255,0.5)',\n          select: () => this.setActiveSection(m.key),\n        })),\n      },\n      { key: 'avisos', code: 'AV', label: 'Correspondências/\\nComunicações', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'avisos' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('avisos') },\n      { key: 'consultas', code: 'CO', label: 'Consultas', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'consultas' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('consultas') },\n      { key: 'medicao', code: 'ME', label: 'Medição', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'medicao' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('medicao') },\n      { key: 'controle-terceiros', code: 'CT', label: 'Controle de Terceiros', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'controle-terceiros' ? 'rgba(255,255,255,0.14)' : 'transparent', status: 'Aguardando dados', statusColor: 'rgba(255,255,255,0.5)', select: () => this.setActiveSection('controle-terceiros') },\n      { key: 'reuniao-externa', code: 'RE', label: 'Reunião Externa', iconBg: 'rgba(255,255,255,0.18)', bg: active === 'reuniao-externa' ? 'rgba(255,255,255,0.14)' : 'transparent', status: null, select: () => this.setActiveSection('reuniao-externa') },\n    ];\n\n    const materiaCards = this.materiaMeta.map(m => ({\n      key: m.key, code: m.code, label: m.label, desc: m.desc,\n      iconBg: m.modeled ? '#2f6690' : '#b7c0ca',\n      status: m.modeled ? 'Modelo pronto' : 'Aguardando dados',\n      statusColor: m.modeled ? '#2f8f4f' : '#8a94a3',\n      select: () => this.setActiveSection(m.key),\n    }));\n\n    const phaseColors = this.materiaMeta.map(m => m.modeled ? '#2f6690' : '#b7c0ca');\n    const n = this.materiaMeta.length;\n    const timelinePhases = this.materiaMeta.map((m, i) => ({\n      label: m.label, color: phaseColors[i], left: i * (100 / n), width: 100 / n - 1.5,\n    }));\n\n    const placeholderSections = this.materiaMeta.filter(m => !m.modeled).map((m, i) => ({\n      key: m.key, label: m.label, order: String(i + 3).padStart(2, '0'),\n      isActive: active === m.key,\n      topics: this.placeholderTopics[m.key],\n    }));\n\n    const scrub = this.state.terraScrub;\n    const vals = this.interp(scrub);\n    const diff = vals.terr - vals.proj;\n\n    return {\n      primaryColor: this.props.primaryColor ?? '#1f3a5f',\n      showIllustrativeTags: this.props.showIllustrativeTags ?? true,\n      isHome: active === 'home',\n      isGeometria: active === 'geometria',\n      isTerraplenagem: active === 'terraplenagem',\n      isAnalise: active === 'analise',\n      isLinhaTempo: active === 'linha-tempo',\n      isReuniaoExterna: active === 'reuniao-externa',\n      externaMaterias: this.materiaMeta.map(m => ({\n        key: m.key, label: m.label,\n        bg: this.state.externaMateria === m.key ? (this.props.primaryColor ?? '#1f3a5f') : '#fff',\n        fg: this.state.externaMateria === m.key ? '#fff' : '#5b6774',\n        select: () => this.setState({ externaMateria: m.key }),\n      })),\n      externaMateriaLabel: (this.materiaMeta.find(m => m.key === this.state.externaMateria) || {}).label || '',\n      externaHasSelection: !!this.state.externaMateria,\n      externaDashboard: this.state.externaMateria === 'geometria' ? this.buildGeoDashboard() : null,\n      externaHasDashboard: this.state.externaMateria === 'geometria',\n      externaNoDashboard: !!this.state.externaMateria && this.state.externaMateria !== 'geometria',\n      isAvisos: active === 'avisos',\n      isConsultas: active === 'consultas',\n      isMedicao: active === 'medicao',\n      medicaoLocked: !this.state.medicaoUnlocked,\n      medicaoUnlocked: this.state.medicaoUnlocked,\n      medicaoPasswordDraft: this.state.medicaoPasswordDraft,\n      showMedicaoPasswordError: this.state.medicaoPasswordError,\n      onMedicaoPasswordChange: (e) => this.onMedicaoPasswordChange(e),\n      onMedicaoPasswordKeyDown: (e) => this.onMedicaoPasswordKeyDown(e),\n      onMedicaoPasswordSubmit: () => this.submitMedicaoPassword(),\n      isControleTerceiros: active === 'controle-terceiros',\n      avisosTimeline: this.avisosData.slice().sort((a, b) => (a.data < b.data ? 1 : -1)),\n      hasAvisos: this.avisosData.length > 0,\n      noAvisos: this.avisosData.length === 0,\n      consultasList: this.consultasData,\n      hasConsultas: this.consultasData.length > 0,\n      navItems,\n      materiaCards,\n      timelinePhases,\n      todayLeft: 26,\n      placeholderSections,\n      homeStats: { extensao: '35', materias: this.materiaMeta.length, modelos: this.materiaMeta.filter(m => m.modeled).length },\n      geoNums: { extensao: '32,02', classe: '1B', curvasPlanta: '40,1', curvasPerfil: '47,75', faixasAdicionais: 3 },\n      geoZoom: this.state.geoZoom,\n      geoPanX: this.state.geoPan.x,\n      geoPanY: this.state.geoPan.y,\n      geoCursor: this.state.dragging ? 'grabbing' : 'grab',\n      onZoomChange: (e) => this.onZoomChange(e),\n      onPanStart: (e) => this.onPanStart(e),\n      onPanMove: (e) => this.onPanMove(e),\n      onPanEnd: () => this.onPanEnd(),\n      geoTopics: this.geoTopicsData.map(t => ({\n        ...t, isOpen: !!this.state.expanded[t.key],\n        chevron: this.state.expanded[t.key] ? '−' : '+',\n        toggle: () => this.toggleCard(t.key),\n      })),\n      terraNums: { escavado: '850.000', aterro: '620.000', botafora: '230.000', dmt: '1.850' },\n      terraTerrPath: this.buildPath('terr'),\n      terraProjPath: this.buildPath('proj'),\n      terraMarkerX: scrub * 10,\n      terraMarkerTerrY: 220 - vals.terr,\n      terraMarkerProjY: 220 - vals.proj,\n      onScrubChange: (e) => this.onScrubChange(e),\n      terraScrub: scrub,\n      terraReadout: {\n        estaca: Math.round(scrub * 18.55),\n        terr: (vals.terr / 10 + 320).toFixed(1),\n        proj: (vals.proj / 10 + 320).toFixed(1),\n        diffLabel: (diff > 0 ? '+' : '') + (diff / 10).toFixed(1) + ' m (' + (diff > 0 ? 'corte' : 'aterro') + ')',\n        diffColor: diff > 0 ? '#1f3a5f' : '#b5541f',\n      },\n      terraTopics: this.terraTopicsData.map(t => ({\n        ...t, isOpen: !!this.state.expanded[t.key],\n        chevron: this.state.expanded[t.key] ? '−' : '+',\n        toggle: () => this.toggleCard(t.key),\n      })),\n      analiseDisciplinas: this.buildAnaliseDisciplinas(),\n      medicao: this.buildMedicao(),\n      medicaoDashboard: this.buildMedicaoDashboard(),\n      medicaoShowDescricoes: !!this.state.medicaoShowDescricoes,\n      onToggleDescricoes: () => this.setState({ medicaoShowDescricoes: !this.state.medicaoShowDescricoes }),\n      medicaoDescricoesList: this.medicaoItemsData.map(i => ({ numero: i.numero, descricao: i.descricao, unidade: i.unidade })),\n      externaDiscAnalises: (this.state.externaMateria ? this.buildAnaliseDisciplinas().find(d => d.key === this.state.externaMateria) : null),\n      linhaTempo: this.buildLinhaTempo(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
