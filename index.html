acesso ao SIP está desativado. Procure o administrador.' };\n    return { ok: true, usuario: { uid: user.uid, ...u } };\n  }\n\n  entrarComoUsuario(usuario) {\n    this.setState({\n      showSenhaConsol: false, showTrocaSenha: false, trocaVoluntaria: false,\n      entered: true, wantsEnter: true, view: 'projetos', selectedProjetoId: null,\n      clienteAtivo: null, clienteNome: '', clienteTipos: [],\n      usuarioSip: usuario, loginEmail: '', senhaConsolInput: '', senhaConsolErro: '', loginMsg: '', senhaConsolLoading: false,\n      novaSenha: '', confirmaSenha: '', trocaErro: '', trocaLoading: false,\n    });\n  }\n\n  async esqueciSenha() {\n    const email = (this.state.loginEmail || '').trim().toLowerCase();\n    if (!email) { this.setState({ senhaConsolErro: 'Digite o seu e-mail acima e clique de novo em \"Esqueci minha senha\".', loginMsg: '' }); return; }\n    try {\n      firebase.auth().languageCode = 'pt-BR';\n      await firebase.auth().sendPasswordResetEmail(email);\n    } catch (e) {\n      if (e && e.code === 'auth/invalid-email') { this.setState({ senhaConsolErro: 'E-mail inválido.', loginMsg: '' }); return; }\n    }\n    this.setState({ senhaConsolErro: '', loginMsg: 'Se este e-mail estiver cadastrado, você receberá em alguns minutos o link para criar uma nova senha.' });\n  }\n\n  abrirTrocaVoluntaria() {\n    this.setState({ showTrocaSenha: true, trocaVoluntaria: true, novaSenha: '', confirmaSenha: '', trocaErro: '' });\n  }\n\n  setNovaSenha(e) { this.setState({ novaSenha: e.target.value, trocaErro: '' }); }\n  setConfirmaSenha(e) { this.setState({ confirmaSenha: e.target.value, trocaErro: '' }); }\n\n  requisitosSenha() {\n    const n = this.state.novaSenha || '', c = this.state.confirmaSenha || '';\n    return { tamanho: n.length >= 6, iguais: n.length > 0 && n === c, provisoria: n.length > 0 && n !== this.SENHA_PROVISORIA };\n  }\n\n  async confirmarTrocaSenha() {\n    if (this.state.trocaLoading) return;\n    const r = this.requisitosSenha();\n    if (!r.tamanho || !r.iguais || !r.provisoria) { this.setState({ trocaErro: 'A nova senha ainda não atende aos requisitos acima.' }); return; }\n    this.setState({ trocaLoading: true, trocaErro: '' });\n    try {\n      await firebase.auth().currentUser.updatePassword(this.state.novaSenha);\n      const u = this.state.usuarioSip;\n      if (u && !u.compartilhada) {\n        await this.db().collection('usuarios').doc(u.uid).update({ trocarSenha: false, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });\n      }\n      const usuario = { ...u, trocarSenha: false };\n      if (this.state.trocaVoluntaria && this.state.entered) {\n        this.setState({ showTrocaSenha: false, trocaVoluntaria: false, usuarioSip: usuario, novaSenha: '', confirmaSenha: '', trocaLoading: false });\n      } else {\n        this.entrarComoUsuario(usuario);\n      }\n    } catch (e) {\n      const msg = e && e.code === 'auth/requires-recent-login' ? 'Por segurança, saia e entre de novo antes de trocar a senha.' : 'Não foi possível trocar a senha. Tente novamente.';\n      this.setState({ trocaErro: msg, trocaLoading: false });\n    }\n  }\n\n  sairOuVoltarDaTroca() {\n    if (this.state.trocaVoluntaria && this.state.entered) { this.setState({ showTrocaSenha: false, trocaVoluntaria: false, novaSenha: '', confirmaSenha: '', trocaErro: '' }); return; }\n    this.sair();\n  }\n\n  async sair() {\n    await this.sairParaAnonimo();\n    this.resetHero();\n    this.setState({ entered: false, showTrocaSenha: false, trocaVoluntaria: false, showSenhaConsol: false, showAcesso: false, view: 'projetos', selectedProjetoId: null, usuarioSip: null, clienteAtivo: null, clienteNome: '', clienteTipos: [], adminLinhas: [], adminMsg: '' });\n  }\n\n  permissoesDoUsuario() {\n    const u = this.state.usuarioSip;\n    if (!u) return null;\n    const verTudo = u.perfil === 'Administrador' || u.perfil === 'Supervisor';\n    const abas = u.abas || {};\n    return {\n      perfil: u.perfil, nome: u.nome, email: u.email, verTudo,\n      projetos: verTudo ? this.PROJETOS_TIPOS.slice() : (u.projetos || []),\n      abas: { medicao: verTudo || !!abas.medicao, terceiros: verTudo || !!abas.terceiros },\n      disciplinas: verTudo ? this.DISCIPLINAS_CHAVES.slice() : (u.disciplinas || []),\n    };\n  }\n\n  // ---------- Administração ----------\n  linhaDeUsuario(u, novo) {\n    const linha = {\n      key: novo ? ('novo-' + Math.random().toString(36).slice(2)) : u.uid, uid: novo ? null : u.uid, novo,\n      nome: u.nome || '', email: (u.email || '').toLowerCase(), perfil: u.perfil || 'Funcionário', ativo: u.ativo !== false,\n      projetos: (u.projetos || []).slice(), abas: { medicao: !!(u.abas && u.abas.medicao), terceiros: !!(u.abas && u.abas.terceiros) },\n      disciplinas: (u.disciplinas || []).slice(),\n    };\n    linha.original = novo ? '' : this.assinaturaLinha(linha);\n    return linha;\n  }\n\n  assinaturaLinha(l) {\n    return JSON.stringify([l.nome, l.perfil, l.ativo, l.projetos.slice().sort(), l.abas.medicao, l.abas.terceiros, l.disciplinas.slice().sort()]);\n  }\n\n  async goAdmin() {\n    this.setState({ view: 'admin', selectedProjetoId: null, adminCarregando: true, adminMsg: '' });\n    try {\n      const snap = await this.db().collection('usuarios').get();\n      const existentes = snap.docs.map(d => this.linhaDeUsuario({ uid: d.id, ...d.data() }, false));\n      const emails = new Set(existentes.map(l => l.email));\n      const pendentes = this.CADASTRO_INICIAL.filter(c => !emails.has(c.email)).map(c => this.linhaDeUsuario(c, true));\n      const linhas = existentes.concat(pendentes).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));\n      this.setState({ adminLinhas: linhas, adminCarregando: false,\n        adminMsg: pendentes.length ? pendentes.length + ' funcionário(s) da planilha inicial ainda não foram criados (linhas amarelas). Confira e clique em \"Salvar alterações\" para criar os logins.' : '', adminMsgTipo: 'info' });\n    } catch (e) {\n      this.setState({ adminCarregando: false, adminMsg: 'Não foi possível carregar os funcionários: ' + ((e && e.message) || e), adminMsgTipo: 'erro' });\n    }\n  }\n\n  atualizarLinha(key, mudar) {\n    this.setState(s => ({ adminLinhas: s.adminLinhas.map(l => l.key === key ? mudar({ ...l, projetos: l.projetos.slice(), disciplinas: l.disciplinas.slice(), abas: { ...l.abas } }) : l) }));\n  }\n\n  alternarItem(lista, item) {\n    return lista.includes(item) ? lista.filter(x => x !== item) : lista.concat([item]);\n  }\n\n  adminAdicionar() {\n    const l = this.linhaDeUsuario({ nome: '', email: '', perfil: 'Funcionário', ativo: true }, true);\n    this.setState(s => ({ adminLinhas: s.adminLinhas.concat([l]), adminBusca: '', adminFiltro: 'todos' }));\n  }\n\n  adminDescartar() {\n    this.goAdmin();\n  }\n\n  linhaAlterada(l) {\n    return l.novo || this.assinaturaLinha(l) !== l.original;\n  }\n\n  async criarLoginFuncionario(email) {\n    const cfg = firebase.app().options;\n    const app2 = firebase.initializeApp(cfg, 'sip-cadastro-' + Date.now());\n    try {\n      let uid;\n      try {\n        const cred = await app2.auth().createUserWithEmailAndPassword(email, this.SENHA_PROVISORIA);\n        uid = cred.user.uid;\n      } catch (e) {\n        if (e && e.code === 'auth/email-already-in-use') {\n          const cred = await app2.auth().signInWithEmailAndPassword(email, this.SENHA_PROVISORIA);\n          uid = cred.user.uid;\n        } else { throw e; }\n      }\n      try { await app2.auth().signOut(); } catch (e) {}\n      return uid;\n    } finally {\n      try { await app2.delete(); } catch (e) {}\n    }\n  }\n\n  async adminSalvar() {\n    if (this.state.adminSalvando) return;\n    const alteradas = this.state.adminLinhas.filter(l => this.linhaAlterada(l));\n    if (!alteradas.length) { this.setState({ adminMsg: 'Nenhuma alteração para salvar.', adminMsgTipo: 'info' }); return; }\n    for (const l of alteradas) {\n      if (!l.nome.trim() || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(l.email)) { this.setState({ adminMsg: 'Preencha nome e um e-mail válido em todas as linhas novas antes de salvar.', adminMsgTipo: 'erro' }); return; }\n    }\n    this.setState({ adminSalvando: true, adminMsg: 'Salvando ' + alteradas.length + ' linha(s)...', adminMsgTipo: 'info' });\n    const erros = [];\n    let ok = 0;\n    for (const l of alteradas) {\n      const dados = { nome: l.nome.trim(), email: l.email, perfil: l.perfil, ativo: l.ativo, projetos: l.projetos, abas: l.abas, disciplinas: l.disciplinas, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() };\n      try {\n        if (l.novo) {\n          const uid = await this.criarLoginFuncionario(l.email);\n          await this.db().collection('usuarios').doc(uid).set({ ...dados, trocarSenha: true, criadoEm: firebase.firestore.FieldValue.serverTimestamp() });\n        } else {\n          await this.db().collection('usuarios').doc(l.uid).update(dados);\n        }\n        ok++;\n      } catch (e) {\n        const motivo = e && e.code === 'auth/wrong-password' || (e && e.code === 'auth/invalid-credential') ? 'o e-mail já existe no Firebase com outra senha' : ((e && e.message) || String(e));\n        erros.push(l.nome + ' (' + l.email + '): ' + motivo);\n      }\n    }\n    await this.goAdmin();\n    this.setState({ adminSalvando: false,\n      adminMsg: erros.length ? ok + ' salvo(s). Não foi possível salvar:\\n' + erros.join('\\n') : ok + ' linha(s) salva(s). Novos funcionários entram com a senha provisória ' + this.SENHA_PROVISORIA + ' e trocam no primeiro acesso.',\n      adminMsgTipo: erros.length ? 'erro' : 'ok' });\n  }\n\n  async adminRedefinirSenha(l) {\n    try {\n      firebase.auth().languageCode = 'pt-BR';\n      await firebase.auth().sendPasswordResetEmail(l.email);\n      this.setState({ adminMsg: 'E-mail de redefinição de senha enviado para ' + l.email + '.', adminMsgTipo: 'ok' });\n    } catch (e) {\n      this.setState({ adminMsg: 'Não foi possível enviar o e-mail para ' + l.email + ': ' + ((e && e.message) || e), adminMsgTipo: 'erro' });\n    }\n  }\n\n  adminLinhasVisiveis() {\n    const busca = (this.state.adminBusca || '').trim().toLowerCase();\n    const filtro = this.state.adminFiltro;\n    return this.state.adminLinhas.filter(l => {\n      if (busca && !(l.nome.toLowerCase().includes(busca) || l.email.includes(busca))) return false;\n      if (filtro === 'inativos') return !l.ativo;\n      if (filtro && filtro !== 'todos' && l.perfil !== filtro) return false;\n      return true;\n    });\n  }\n\n  adminLinhasRender() {\n    return this.adminLinhasVisiveis().map(l => {\n      const alterada = this.linhaAlterada(l);\n      const verTudo = l.perfil === 'Administrador' || l.perfil === 'Supervisor';\n      const celulas = [];\n      this.PROJETOS_TIPOS.forEach((t, i) => celulas.push({ on: l.projetos.includes(t), rotulo: this.PROJETOS_ROTULOS[i], toggle: () => this.atualizarLinha(l.key, x => { x.projetos = this.alternarItem(x.projetos, t); return x; }) }));\n      ['medicao', 'terceiros'].forEach((a) => celulas.push({ on: !!l.abas[a], rotulo: a === 'medicao' ? 'Medição' : 'Contratos de Terceiros', toggle: () => this.atualizarLinha(l.key, x => { x.abas[a] = !x.abas[a]; return x; }) }));\n      this.DISCIPLINAS_CHAVES.forEach((d, i) => celulas.push({ on: l.disciplinas.includes(d), rotulo: this.DISCIPLINAS_ROTULOS[i], toggle: () => this.atualizarLinha(l.key, x => { x.disciplinas = this.alternarItem(x.disciplinas, d); return x; }) }));\n      return {\n        key: l.key, nome: l.nome, email: l.email, perfil: l.perfil, novo: l.novo, existente: !l.novo,\n        bg: alterada ? '#fffbe6' : '#ffffff', bordaCampo: l.novo ? '#0066ff' : 'transparent',\n        verTudo, naoVerTudo: !verTudo, celulas,\n        statusTexto: l.ativo ? 'Ativo' : 'Inativo', statusCor: l.ativo ? '#1e6b3f' : '#5b6774', statusPonto: l.ativo ? '#2f8f4f' : '#9aa4b1',\n        setNome: (e) => { const v = e.target.value; this.atualizarLinha(l.key, x => { x.nome = v; return x; }); },\n        setEmail: (e) => { const v = e.target.value.trim().toLowerCase(); this.atualizarLinha(l.key, x => { x.email = v; return x; }); },\n        setPerfil: (e) => { const v = e.target.value; this.atualizarLinha(l.key, x => { x.perfil = v; return x; }); },\n        toggleAtivo: () => this.atualizarLinha(l.key, x => { x.ativo = !x.ativo; return x; }),\n        redefinirSenha: () => this.adminRedefinirSenha(l),\n      };\n    });\n  }\n\n  // ================= DADOS DAS ANÁLISES NO BANCO (Fase 1 — migração) =================\n  // Estrutura: analisesFontes/{projeto__disciplina__parte} (resumo) + subcoleção rodadas/{numero}\n  // (datas + docs da análise, exatamente no formato dos arrays ...DocsData dos projetos).\n  contarItensFonte(rodadas) {\n    let linhas = 0, itens = 0, atendidos = 0;\n    for (const r of rodadas) for (const d of (r.docs || [])) for (const it of (d.items || [])) {\n      linhas++;\n      const st = (it && typeof it === 'object') ? it.status : null;\n      if (st === 'atendido') atendidos++;\n      else if (st !== 'nao' && st !== 'parcial' && st !== 'retirado' && st !== 'pendente') itens++;\n    }\n    return { linhas, itens, atendidos };\n  }\n\n  async importarMigracao(e) {\n    const input = e && e.target;\n    const file = input && input.files && input.files[0];\n    if (!file) return;\n    this.setState({ migraStatus: 'Lendo o arquivo...', migraTipo: 'info', migraResumo: [] });\n    let dados = null;\n    try { dados = JSON.parse(await file.text()); } catch (err) { dados = null; }\n    if (!dados || dados.tipo !== 'sip-migracao-analises' || !Array.isArray(dados.fontes)) {\n      this.setState({ migraStatus: 'Arquivo não reconhecido. Use o SIP_Migracao_Analises.json.', migraTipo: 'erro' });\n      if (input) input.value = '';\n      return;\n    }\n    const db = this.db();\n    const quem = (this.state.usuarioSip && this.state.usuarioSip.email) || '';\n    const resumo = [];\n    let i = 0;\n    for (const f of dados.fontes) {\n      i++;\n      this.setState({ migraStatus: 'Gravando ' + i + ' de ' + dados.fontes.length + ': ' + f.id + '...', migraTipo: 'info' });\n      const cont = this.contarItensFonte(f.rodadas || []);\n      const linhaResumo = { id: f.id, analises: (f.rodadas || []).map(r => r.numero).join(', '), itens: cont.itens, atendidos: cont.atendidos };\n      try {\n        const ref = db.collection('analisesFontes').doc(f.id);\n        const batch = db.batch();\n        batch.set(ref, {\n          projeto: f.projeto, disciplina: f.disciplina, parte: f.parte || null,\n          numeros: (f.rodadas || []).map(r => r.numero),\n          totalLinhas: cont.linhas, totalItens: cont.itens, totalAtendidos: cont.atendidos,\n          origem: 'migracao', atualizadoPor: quem, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),\n        });\n        for (const r of (f.rodadas || [])) batch.set(ref.collection('rodadas').doc(String(r.numero)), r);\n        await batch.commit();\n        resumo.push({ ...linhaResumo, situacao: 'Gravado', cor: '#1e6b3f' });\n      } catch (err) {\n        resumo.push({ ...linhaResumo, situacao: 'Erro: ' + ((err && err.message) || err), cor: '#9b2c22' });\n      }\n    }\n    const erros = resumo.filter(r => r.situacao !== 'Gravado').length;\n    this.setState({\n      migraResumo: resumo,\n      migraStatus: erros ? (resumo.length - erros) + ' fonte(s) gravada(s) e ' + erros + ' com erro (ver tabela).' : 'Migração concluída: ' + resumo.length + ' fontes gravadas no banco. Confira os totais na tabela.',\n      migraTipo: erros ? 'erro' : 'ok',\n    });\n    if (input) input.value = '';\n  }\n\n  async confirmSenhaConsol() {\n    if (this.state.senhaConsolLoading) return;\n    const email = (this.state.loginEmail || '').trim().toLowerCase();\n    if (!email || !this.state.senhaConsolInput) {\n      this.setState({ senhaConsolErro: 'Digite o seu e-mail e a sua senha.', loginMsg: '' });\n      return;\n    }\n    this.setState({ senhaConso
