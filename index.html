"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b5c1569f-93c4-496a-ac09-e1d3a5aecdd8\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n\n\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <style>\n    body{margin:0;font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}\n    a{color:#2f6690;}\n    a:hover{color:#1f3a5f;}\n    ::-webkit-scrollbar{width:10px;height:10px;}\n    ::-webkit-scrollbar-thumb{background:#c4ccd6;border-radius:6px;}\n    @keyframes sipFloatUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}\n    @keyframes sipBadgePulse{0%,100%{box-shadow:0 0 0 0 rgba(0,102,255,0.35);}50%{box-shadow:0 0 26px 6px rgba(0,102,255,0.30);}}\n    @keyframes sipShine{to{background-position:-200% 0;}}\n    .sip-hero-badge{animation:sipFloatUp 0.8s ease-out both, sipBadgePulse 3s ease-in-out infinite;}\n    .sip-hero-title{animation:sipFloatUp 0.9s ease-out 0.15s both, sipShine 5s linear infinite;}\n    .sip-hero-sub{animation:sipFloatUp 0.9s ease-out 0.32s both;}\n    .sip-hero-buttons{animation:sipFloatUp 0.9s ease-out 0.48s both;}\n    .sip-btn-primary{transition:transform 0.25s ease, box-shadow 0.25s ease;}\n    .sip-btn-primary:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 28px rgba(0,102,255,0.55);}\n    .sip-btn-secondary{transition:transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;}\n    .sip-btn-secondary:hover{transform:translateY(-2px) scale(1.03);background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.4);}\n    @media (max-width:700px){\n      .sip-topbar-sub{display:none;}\n      .sip-topbar-title{font-size:12px!important;}\n      .sip-projetos-row{flex-direction:column;}\n      .sip-projetos-sidebar{width:100%!important;flex:0 0 auto!important;}\n      .sip-projetos-content{padding:20px 16px!important;}\n      .sip-visita-form{padding:14px!important;}\n    }\n  <\u002Fstyle>\n\n  \n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#eef1f4;font-size:14px;color:#1f2933;\">\n\n  <!-- ===================== LOADING ===================== -->\n  <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8a94a3;font-size:13px;\">Carregando…<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== ERRO FIRESTORE ===================== -->\n  <sc-if value=\"{{ isFirestoreError }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"width:420px;background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:28px 26px;text-align:center;\">\n        <div style=\"font-size:15px;font-weight:700;color:#c0392b;margin-bottom:8px;\">Sem acesso ao Firestore<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#5b6774;line-height:1.6;\">{{ firestoreError }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== CAPA ===================== -->\n  <sc-if value=\"{{ isCoverView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;min-height:100vh;overflow:hidden;background:#050505;\">\n      <canvas ref=\"{{ coverCanvasRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;\"><\u002Fcanvas>\n      <div style=\"position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:40px;text-align:center;\">\n        <div class=\"sip-hero-badge\" style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(120,150,255,0.35);backdrop-filter:blur(8px);color:rgba(220,230,255,0.85);font-size:12px;font-weight:700;letter-spacing:0.15em;padding:8px 18px;border-radius:999px;\">SIP PLATFORM<\u002Fdiv>\n        <div>\n          <div class=\"sip-hero-title\" style=\"font-size:96px;font-weight:800;letter-spacing:0.08em;line-height:1;background:linear-gradient(90deg,#fff,#8fb4ff,#ff8fae,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;\">SIP<\u002Fdiv>\n          <div class=\"sip-hero-sub\" style=\"margin-top:18px;font-size:19px;font-weight:600;color:#fff;\">Sistema Inteligente de Projetos<\u002Fdiv>\n          <div class=\"sip-hero-sub\" style=\"margin-top:8px;font-size:14.5px;color:rgba(255,255,255,0.55);white-space:nowrap;\">Transformando contratos, medições e análises de projetos em inteligência operacional.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sip-hero-buttons\" style=\"display:flex;align-items:center;gap:14px;\">\n          <div sc-camel-on-click=\"{{ enter }}\" class=\"sip-btn-primary\" style=\"cursor:pointer;background:#0066ff;color:#fff;font-weight:700;font-size:14px;padding:14px 32px;border-radius:8px;box-shadow:0 0 20px rgba(0,102,255,0.4);\">Entrar no Sistema<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ openSobre }}\" class=\"sip-btn-secondary\" style=\"cursor:pointer;background:transparent;color:#fff;font-weight:600;font-size:14px;padding:14px 32px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);\">Conhecer a Plataforma<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== ACESSO (CONSOL / CLIENTE) ===================== -->\n  <sc-if value=\"{{ isAcessoView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 30% 35%, rgba(0,102,255,0.30), transparent 55%), radial-gradient(circle at 70% 65%, rgba(255,45,85,0.25), transparent 55%), #050505;\">\n      <div style=\"position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px;text-align:center;\">\n        <div sc-camel-on-click=\"{{ selectConsol }}\" class=\"sip-btn-primary\" style=\"cursor:pointer;background:#0066ff;color:#fff;font-weight:700;font-size:16px;padding:18px 48px;border-radius:8px;box-shadow:0 0 20px rgba(0,102,255,0.4);\">Acesso CONSOL<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ selectCliente }}\" class=\"sip-btn-secondary\" style=\"cursor:pointer;background:transparent;color:#fff;font-weight:600;font-size:16px;padding:18px 48px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);\">Acesso Cliente<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ voltarCapaFromAcesso }}\" style=\"cursor:pointer;color:rgba(255,255,255,0.5);font-size:13px;margin-top:20px;\">← Voltar<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== SENHA CONSOL ===================== -->\n  <sc-if value=\"{{ isSenhaConsolView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 30% 35%, rgba(0,102,255,0.30), transparent 55%), radial-gradient(circle at 70% 65%, rgba(255,45,85,0.25), transparent 55%), #050505;\">\n      <div style=\"position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px;text-align:center;\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.15em;color:#8fb4ff;\">ACESSO RESTRITO<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;\">Área CONSOL<\u002Fdiv>\n        <div style=\"position:relative;width:260px;\">\n          <input type=\"{{ senhaConsolInputType }}\" value=\"{{ senhaConsolInput }}\" sc-camel-on-change=\"{{ setSenhaConsolInput }}\" placeholder=\"Digite a senha\" style=\"width:100%;padding:12px 42px 12px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;text-align:center;box-sizing:border-box;\">\n          <sc-if value=\"{{ senhaConsolVisible }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ toggleSenhaConsolVisible }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,0.6);display:flex;\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"><\u002Fpath><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"><\u002Fline><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ senhaConsolHidden }}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-on-click=\"{{ toggleSenhaConsolVisible }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,0.6);display:flex;\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasSenhaConsolErro }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#ff6b81;font-size:12.5px;\">{{ senhaConsolErro }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ confirmSenhaConsol }}\" class=\"sip-btn-primary\" style=\"cursor:pointer;background:#0066ff;color:#fff;font-weight:700;font-size:14px;padding:12px 32px;border-radius:8px;margin-top:6px;opacity:{{ senhaConsolLoadingOpacity }};\">{{ senhaConsolBtnLabel }}<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ voltarAcessoFromSenha }}\" style=\"cursor:pointer;color:rgba(255,255,255,0.5);font-size:13px;margin-top:10px;\">← Voltar<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== SENHA CLIENTE ===================== -->\n  <sc-if value=\"{{ isSenhaClienteView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 30% 35%, rgba(0,102,255,0.30), transparent 55%), radial-gradient(circle at 70% 65%, rgba(255,45,85,0.25), transparent 55%), #050505;\">\n      <div style=\"position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px;text-align:center;\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.15em;color:#8fb4ff;\">ACESSO RESTRITO<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;\">Área do Cliente<\u002Fdiv>\n        <div style=\"width:260px;\">\n          <input type=\"text\" value=\"{{ usuarioClienteInput }}\" sc-camel-on-change=\"{{ setUsuarioClienteInput }}\" placeholder=\"Usuário\" style=\"width:100%;padding:12px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;text-align:center;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"position:relative;width:260px;\">\n          <input type=\"{{ senhaClienteInputType }}\" value=\"{{ senhaClienteInput }}\" sc-camel-on-change=\"{{ setSenhaClienteInput }}\" placeholder=\"Digite a senha\" style=\"width:100%;padding:12px 42px 12px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;text-align:center;box-sizing:border-box;\">\n          <sc-if value=\"{{ senhaClienteVisible }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ toggleSenhaClienteVisible }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,0.6);display:flex;\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"><\u002Fpath><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"><\u002Fline><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ senhaClienteHidden }}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-on-click=\"{{ toggleSenhaClienteVisible }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,0.6);display:flex;\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasSenhaClienteErro }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#ff6b81;font-size:12.5px;\">{{ senhaClienteErro }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ confirmSenhaCliente }}\" class=\"sip-btn-primary\" style=\"cursor:pointer;background:#0066ff;color:#fff;font-weight:700;font-size:14px;padding:12px 32px;border-radius:8px;margin-top:6px;opacity:{{ senhaClienteLoadingOpacity }};\">{{ senhaClienteBtnLabel }}<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ voltarAcessoFromSenhaCliente }}\" style=\"cursor:pointer;color:rgba(255,255,255,0.5);font-size:13px;margin-top:10px;\">← Voltar<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== SOBRE / CONHECER A PLATAFORMA ===================== -->\n  <sc-if value=\"{{ isSobreView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;background:#050505;color:#fff;display:flex;justify-content:center;padding:64px 24px;\">\n      <div style=\"max-width:680px;width:100%;\">\n        <div sc-camel-on-click=\"{{ closeSobre }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:40px;\">← Voltar<\u002Fdiv>\n\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.15em;color:#8fb4ff;margin-bottom:14px;\">SIP PLATFORM<\u002Fdiv>\n        <h1 style=\"margin:0 0 28px;font-size:40px;font-weight:800;line-height:1.15;\">SIP — Sistema Inteligente de Projetos<\u002Fh1>\n\n        <div style=\"font-size:15.5px;line-height:1.85;color:rgba(255,255,255,0.75);display:flex;flex-direction:column;gap:22px;text-align:justify;\">\n          <p style=\"margin:0;\">O SIP (Sistema Inteligente de Projetos) é a plataforma da Consol Engenheiros Consultores desenvolvida para acompanhar, de forma integrada, todo o ciclo de vida dos projetos de infraestrutura da empresa — desde os estudos iniciais e levantamentos técnicos até a emissão e impressão final dos projetos.<\u002Fp>\n\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#ff8fae;margin-bottom:8px;\">O QUE O SIP FAZ<\u002Fdiv>\n            <p style=\"margin:0 0 10px;\">O sistema centraliza, em um único ambiente, todas as informações relacionadas aos projetos, incluindo:<\u002Fp>\n            <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;\">\n              <li>As diferentes disciplinas envolvidas;<\u002Fli>\n              <li>O histórico completo de análises, pareceres e interações com os órgãos contratantes;<\u002Fli>\n              <li>O controle de medições e faturamento;<\u002Fli>\n              <li>A gestão de contratos com empresas terceirizadas;<\u002Fli>\n              <li>O acompanhamento do andamento e da evolução de cada entrega.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#ff8fae;margin-bottom:8px;\">OBJETIVO<\u002Fdiv>\n            <p style=\"margin:0 0 10px;\">O principal objetivo do SIP é substituir planilhas isoladas, e-mails dispersos e controles descentralizados por uma plataforma única, confiável e sempre atualizada.<\u002Fp>\n            <p style=\"margin:0 0 10px;\">Com isso, gestores e equipes podem visualizar rapidamente:<\u002Fp>\n            <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;\">\n              <li>O que já foi entregue;<\u002Fli>\n              <li>O que está pendente;<\u002Fli>\n              <li>Quais itens foram questionados pelos órgãos contratantes;<\u002Fli>\n              <li>O que já foi respondido ou solucionado;<\u002Fli>\n              <li>Todo o histórico de decisões e revisões do projeto.<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin:10px 0 0;\">Todas as informações são baseadas em documentos reais dos projetos, garantindo rastreabilidade, transparência e segurança dos dados.<\u002Fp>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#ff8fae;margin-bottom:8px;\">COMO FUNCIONA<\u002Fdiv>\n            <p style=\"margin:0 0 10px;\">Cada projeto possui um espaço exclusivo dentro do SIP, acessível por meio da barra lateral da plataforma.<\u002Fp>\n            <p style=\"margin:0 0 10px;\">Nesse ambiente são concentradas todas as informações, documentos, análises, indicadores e registros relacionados ao empreendimento. O sistema também cria uma linha do tempo completa do projeto, permitindo que gestores acompanhem sua evolução, identifiquem pontos críticos e tomem decisões com maior agilidade e assertividade.<\u002Fp>\n            <p style=\"margin:0;\">A estrutura do SIP foi concebida para ser padronizada e replicável, garantindo que todos os projetos da Consol Engenheiros Consultores sigam a mesma lógica de organização, controle e acompanhamento.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== APP SHELL ===================== -->\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;min-height:100vh;\">\n      <sc-if value=\"{{ isProjetosView }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"height:56px;flex:0 0 56px;background:#1f3a5f;display:flex;align-items:center;justify-content:space-between;padding:0 24px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <div sc-camel-on-click=\"{{ goProjetos }}\" class=\"sip-topbar-title\" style=\"font-size:13px;font-weight:700;color:#fff;letter-spacing:0.03em;cursor:pointer;white-space:nowrap;\">SIP - Sistema Inteligente de Projetos<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sip-topbar-sub\" style=\"font-size:12px;color:rgba(255,255,255,0.65);white-space:nowrap;\">Modo aberto · sem login<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ crumbProjeto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"height:36px;flex:0 0 36px;background:#1f3a5f;display:flex;align-items:center;gap:8px;padding:0 24px;font-size:12px;color:rgba(255,255,255,0.75);\">\n          <div sc-camel-on-click=\"{{ goProjetos }}\" style=\"cursor:pointer;color:#fff;font-weight:700;\">SIP<\u002Fdiv>\n          <div>/<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goProjetos }}\" style=\"cursor:pointer;\">Projetos<\u002Fdiv>\n          <div>/<\u002Fdiv>\n          <div style=\"color:#fff;\">{{ crumbProjeto.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- LISTA DE PROJETOS -->\n      <sc-if value=\"{{ isProjetosView }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"sip-projetos-row\" style=\"flex:1;display:flex;\">\n          <div class=\"sip-projetos-sidebar\" style=\"width:220px;flex:0 0 220px;background:#16283f;padding:20px 14px;display:flex;flex-direction:column;gap:10px;\">\n            <sc-if value=\"{{ isConsolMode }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#fff;border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;\">\n                <img src=\"0497d75d-3b59-40d4-8b97-f2655d6d91d1\" alt=\"CONSOL Engenheiros Consultores\" style=\"height:26px;width:auto;display:block;\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isClienteMode }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;\">\n                <div style=\"font-size:13px;font-weight:800;color:#1f3a5f;text-align:center;\">{{ clienteNome }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:0.08em;text-transform:uppercase;padding:0 8px 4px;\">Projetos<\u002Fdiv>\n            <sc-for list=\"{{ projetos }}\" as=\"p\" hint-placeholder-count=\"1\">\n              <div sc-camel-on-click=\"{{ p.open }}\" style=\"padding:14px 16px;border-radius:10px;cursor:pointer;background:{{ p.bg }};box-shadow:0 6px 16px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);\">\n                <div style=\"font-size:13.5px;font-weight:700;color:{{ p.textColor }};\">{{ p.nome }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;font-weight:600;color:{{ p.textColor }};opacity:0.6;margin-top:2px;\">{{ p.rodovia }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ isConsolMode }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"height:1px;background:rgba(255,255,255,0.12);margin:6px 4px;\"><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ openVisitaTecnica }}\" style=\"padding:14px 16px;border-radius:10px;cursor:pointer;background:{{ visitaTecnicaBg }};border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:space-between;gap:8px;\">\n                <div style=\"font-size:13.5px;font-weight:700;color:{{ visitaTecnicaColor }};\">Visita Técnica<\u002Fdiv>\n                <sc-if value=\"{{ visitaPendentes }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:#e0752f;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;flex:0 0 auto;\">{{ visitaPendentesCount }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div class=\"sip-projetos-content\" style=\"flex:1;overflow:auto;padding:56px 40px;display:flex;justify-content:center;\">\n            <div style=\"max-width:720px;width:100%;\">\n              <div sc-camel-on-click=\"{{ goCover }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5b6774;margin-bottom:32px;\">← Voltar<\u002Fdiv>\n\n              <svg sc-camel-view-box=\"0 0 200 60\" xmlns=\"http://www.w3.org/2000/svg\" style=\"height:34px;width:auto;margin-bottom:22px;\">\n                <text x=\"100\" y=\"40\" font-size=\"32\" font-weight=\"bold\" fill=\"#1f3a5f\" text-anchor=\"middle\">CONSOL<\u002Ftext>\n              <\u002Fsvg>\n              <h1 style=\"margin:0 0 6px;font-size:30px;font-weight:800;line-height:1.2;color:#1f3a5f;\">CONSOL ENGENHEIROS CONSULTORES<\u002Fh1>\n              <div style=\"font-size:16px;font-weight:600;color:#2f6690;margin-bottom:28px;\">Mais de 60 anos construindo caminhos para o futuro.<\u002Fdiv>\n\n              <div style=\"font-size:15px;line-height:1.85;color:#3a4552;display:flex;flex-direction:column;gap:20px;text-align:justify;\">\n                <p style=\"margin:0;\">Fundada em 21 de julho de 1960, a CONSOL ENGENHEIROS CONSULTORES nasceu com a missão de transformar ideias em grandes obras de infraestrutura. Desde o início, nos dedicamos a desenvolver projetos rodoviários, gerenciar e supervisionar obras, realizar estudos de viabilidade técnica especializada, sempre com foco em inovação, responsabilidade social e sustentabilidade ambiental. Com atuação pioneira em geotecnia e pavimentação, a CONSOL foi construída sobre a sólida experiência de seus fundadores — os engenheiros rodoviários Antônio Pimenta, Rafael Gontijo Assunção e Antônio Viçoso — e rapidamente se consolidou como referência no setor.<\u002Fp>\n\n                <p style=\"margin:0;\">No início dos anos 70, marcamos presença em programas estratégicos do Governo Federal, muitos deles financiados pelo BID e pelo Banco Mundial, expandindo nossa atuação para todas as regiões do país. A partir daí, crescemos juntos com o país na elaboração de Estudos e Projetos Executivos de Engenharia até o Gerenciamento e a Supervisão de grandes obras.<\u002Fp>\n\n                <div>\n                  <p style=\"margin:0 0 12px;\">Hoje, somos uma empresa de destaque na Engenharia Consultiva com um acervo técnico robusto e equipes multidisciplinares preparadas para atuar em diferentes setores:<\u002Fp>\n                  <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;\">\n                    <li>Rodoviário, ferroviário, hidroviário e aeroportuário<\u002Fli>\n                    <li>Planejamento urbano e saneamento básico<\u002Fli>\n                    <li>Estudos e projetos ambientais<\u002Fli>\n                    <li>Concessões Rodoviárias<\u002Fli>\n                  <\u002Ful>\n                <\u002Fdiv>\n\n                <p style=\"margin:0;\">Mais do que participar de obras, ajudamos a formar profissionais de excelência, que hoje ocupam posições estratégicas em órgãos e empresas de engenharia em todo o país.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PROJETO (MG-259) — tela cheia, com sua própria barra lateral -->\n      <sc-if value=\"{{ isProjetoMG259 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Infraestrutura\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\" is-cliente-mode=\"{{ isClienteMode }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PROJETO (Araçuaí – Novo Cruzeiro) — tela cheia, com sua própria barra lateral -->\n      <sc-if value=\"{{ isProjetoAracuai }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Aracuai-Novo Cruzeiro\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\" is-cliente-mode=\"{{ isClienteMode }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProjetoGurinhata }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Gurinhata\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProjetoRotaLiberdade }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Rota da Liberdade\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\" is-cliente-mode=\"{{ isClienteMode }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProjetoRubim }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;\">\n          <dc-import name=\"Apresentacao Rubim-Rio do Prado\" hint-size=\"100%,100%\" on-voltar-projetos=\"{{ goProjetos }}\" is-cliente-mode=\"{{ isClienteMode }}\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- VISITA TÉCNICA ===================== -->\n      <sc-if value=\"{{ isVisitaTecnica }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;overflow:auto;background:#eef1f4;\">\n          <div style=\"max-width:560px;margin:0 auto;padding:24px 20px 60px;\">\n            <div sc-camel-on-click=\"{{ goProjetos }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5b6774;margin-bottom:20px;\">← Voltar<\u002Fdiv>\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:800;color:#1f3a5f;\">Visita Técnica de Campo<\u002Fh1>\n            <div style=\"font-size:12.5px;color:#8a94a3;margin-bottom:20px;line-height:1.5;\">Tire fotos em campo pelo celular — elas ficam salvas no aparelho e sincronizam quando houver internet.<\u002Fdiv>\n\n            <div class=\"sip-visita-form\" style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px;\">\n              <div>\n                <label style=\"font-size:11.5px;font-weight:700;color:#5b6774;display:block;margin-bottom:4px;\">Projeto<\u002Flabel>\n                <sc-raw-select value=\"{{ visitaProjetoId }}\" sc-camel-on-change=\"{{ setVisitaProjeto }}\" style=\"width:100%;padding:10px 12px;border-radius:8px;border:1px solid #dde3ea;font-size:13.5px;background:#fff;\">\n                  <option value=\"\">Selecione…<\u002Foption>\n                  <sc-for list=\"{{ visitaProjetosOptions }}\" as=\"vp\" hint-placeholder-count=\"1\">\n                    <option value=\"{{ vp.id }}\">{{ vp.nome }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:11.5px;font-weight:700;color:#5b6774;display:block;margin-bottom:4px;\">Disciplina<\u002Flabel>\n                <sc-raw-select value=\"{{ visitaDisciplina }}\" sc-camel-on-change=\"{{ setVisitaDisciplina }}\" style=\"width:100%;padding:10px 12px;border-radius:8px;border:1px solid #dde3ea;font-size:13.5px;background:#fff;\">\n                  <option value=\"\">Selecione…<\u002Foption>\n                  <sc-for list=\"{{ visitaDisciplinasList }}\" as=\"vd\" hint-placeholder-count=\"1\">\n                    <option value=\"{{ vd }}\">{{ vd }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:11.5px;font-weight:700;color:#5b6774;display:block;margin-bottom:4px;\">Km / Estaca (opcional)<\u002Flabel>\n                <input value=\"{{ visitaKm }}\" sc-camel-on-change=\"{{ setVisitaKm }}\" placeholder=\"ex.: 33+400\" style=\"width:100%;padding:10px 12px;border-radius:8px;border:1px solid #dde3ea;font-size:13.5px;box-sizing:border-box;\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:11.5px;font-weight:700;color:#5b6774;display:block;margin-bottom:4px;\">Observação (opcional)<\u002Flabel>\n                <input value=\"{{ visitaObs }}\" sc-camel-on-change=\"{{ setVisitaObs }}\" placeholder=\"ex.: erosão no talude direito\" style=\"width:100%;padding:10px 12px;border-radius:8px;border:1px solid #dde3ea;font-size:13.5px;box-sizing:border-box;\">\n              <\u002Fdiv>\n              <label style=\"display:flex;align-items:center;justify-content:center;gap:8px;background:#1f3a5f;color:#fff;font-weight:700;font-size:14.5px;padding:16px;border-radius:10px;cursor:pointer;text-align:center;\">\n                Tirar Foto\n                <input type=\"file\" accept=\"image/*\" capture=\"environment\" multiple=\"true\" sc-camel-on-change=\"{{ onCapturaFotos }}\" style=\"display:none;\">\n              <\u002Flabel>\n              <div sc-camel-on-click=\"{{ openGaleriaFromVisita }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;background:#1f3a5f;color:#fff;font-weight:700;font-size:14.5px;padding:16px;border-radius:10px;cursor:pointer;text-align:center;\">\n                Galeria de Fotos ({{ visitaTotal }})\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n              <div style=\"font-size:13px;font-weight:700;color:#1f2933;\">Fotos desta visita ({{ visitaTotal }})<\u002Fdiv>\n              <sc-if value=\"{{ visitaPendentes }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ sincronizarFotos }}\" style=\"cursor:pointer;background:#2f6690;color:#fff;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:8px;\">{{ visitaSyncLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- GALERIA (dentro da Visita Técnica) ===================== -->\n      <sc-if value=\"{{ isGaleriaView }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;min-height:0;overflow:auto;background:#eef1f4;\">\n          <div style=\"max-width:1200px;margin:0 auto;padding:24px 20px 60px;\">\n            <div sc-camel-on-click=\"{{ voltarVisita }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5b6774;margin-bottom:20px;\">← Voltar para Visita Técnica<\u002Fdiv>\n            <h1 style=\"margin:0 0 4px;font-size:22px;font-weight:800;color:#1f3a5f;\">Galeria de Fotos<\u002Fh1>\n            <div style=\"font-size:12.5px;color:#8a94a3;margin-bottom:20px;\">Fotos capturadas, agrupadas por disciplina.<\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:16px;\">\n              <sc-for list=\"{{ galeriaDisciplinas }}\" as=\"disc\" hint-placeholder-count=\"0\">\n                <div style=\"border-radius:10px;overflow:hidden;background:#fff;border:1px solid #dde3ea;\">\n                  <div sc-camel-on-click=\"{{ disc.toggle }}\" style=\"cursor:pointer;padding:16px;background:#f5f7fa;display:flex;align-items:center;justify-content:space-between;border-bottom:{{ disc.expanded ? '1px solid #dde3ea' : 'none' }};\">\n                    <div style=\"font-size:14px;font-weight:700;color:#1f3a5f;\">{{ disc.disciplina }} ({{ disc.count }})<\u002Fdiv>\n                    <div style=\"font-size:12px;color:#5b6774;\">{{ disc.expanded ? '▼' : '▶' }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ disc.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;\">\n                      <sc-for list=\"{{ disc.fotos }}\" as=\"foto\" hint-placeholder-count=\"0\">\n                        <div style=\"border-radius:8px;overflow:hidden;background:#f9fafc;border:1px solid #e0e6ee;\">\n                          <img ref=\"{{ foto.imgRef }}\" style=\"width:100%;height:180px;object-fit:cover;display:block;background:#eef1f4;\">\n                          <div style=\"padding:12px;\">\n                            <div style=\"font-size:11px;font-weight:700;color:#1f3a5f;margin-bottom:8px;\">{{ foto.localizacao }}<\u002Fdiv>\n                            <div style=\"font-size:10px;color:#8a94a3;margin-bottom:6px;\">{{ foto.dataFormatada }}<\u002Fdiv>\n                            <div style=\"font-size:9px;color:#5b6774;line-height:1.5;word-break:break-all;\">{{ foto.coordenadasUTM }}<\u002Fdiv>\n                            <sc-if value=\"{{ foto.obs }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"font-size:9px;color:#5b6774;margin-top:6px;padding-top:6px;border-top:1px solid #dde3ea;line-height:1.4;\">{{ foto.obs }}<\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n\n\n      <!-- PROJETO sem conteúdo -->\n      <sc-if value=\"{{ isProjetoVazio }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;padding:40px;\">\n          <div style=\"padding:40px;background:#fff;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n            <div style=\"font-size:13px;font-weight:600;color:#8a94a3;\">Este projeto ainda não tem um site modelado.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    authResolved: false,\n    firestoreError: '',\n    entered: false,\n    showSobre: false,\n    showAcesso: false,\n    showSenhaConsol: false,\n    senhaConsolInput: '',\n    senhaConsolErro: '',\n    senhaConsolVisible: false,\n    senhaConsolLoading: false,\n    showSenhaCliente: false,\n    usuarioClienteInput: '',\n    senhaClienteInput: '',\n    senhaClienteErro: '',\n    senhaClienteVisible: false,\n    senhaClienteLoading: false,\n    clienteAtivo: null,\n    clienteNome: '',\n    clienteTipos: [],\n    view: 'projetos',\n    selectedProjetoId: null,\n    projetos: [],\n    dataLoaded: false,\n    visitaProjetoId: '',\n    visitaDisciplina: '',\n    visitaKm: '',\n    visitaObs: '',\n    visitaPhotos: [],\n    visitaSyncing: false,\n    galeriaPhotos: [],\n    galeriaDisciplinasExpanded: {},\n  };\n\n  visitaDisciplinas = ['Geometria', 'Terraplenagem', 'Sinalização', 'Obras Complementares', 'Desapropriação', 'Interseção', 'Segurança Viária', 'Pavimentação', 'Drenagem', 'Topografia', 'Meio Ambiente'];\n\n  coverCanvasRef = React.createRef();\n\n  initHero() {\n    const canvas = this.coverCanvasRef.current;\n    if (!canvas || this.heroInited) return;\n    this.heroInited = true;\n    const ctx = canvas.getContext('2d');\n    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };\n    resize();\n    window.addEventListener('resize', resize);\n    this._heroResize = resize;\n\n    const isSmall = window.innerWidth < 700;\n    const nodes = [];\n    for (let i = 0; i < (isSmall ? 32 : 70); i++) {\n      nodes.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25 });\n    }\n    const particles = [];\n    for (let i = 0; i < (isSmall ? 22 : 55); i++) {\n      particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, r: Math.random() * 1.6 + 0.6, hue: Math.random() < 0.5 ? 'rgba(0,102,255,' : 'rgba(255,45,85,' });\n    }\n    this.mouse = { x: canvas.width / 2, y: canvas.height / 2, active: false };\n    const onMove = (e) => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; this.mouse.active = true; };\n    const onLeave = () => { this.mouse.active = false; };\n    window.addEventListener('mousemove', onMove);\n    window.addEventListener('mouseleave', onLeave);\n    this._heroMove = onMove;\n    this._heroLeave = onLeave;\n\n    const draw = () => {\n      this.rafId = requestAnimationFrame(draw);\n      if (this.state.entered) return;\n      const w = canvas.width, h = canvas.height;\n      ctx.clearRect(0, 0, w, h);\n      ctx.fillStyle = '#050505';\n      ctx.fillRect(0, 0, w, h);\n\n      const t = Date.now() / 6000;\n      const b1x = w * 0.3 + Math.sin(t) * w * 0.15, b1y = h * 0.35 + Math.cos(t * 0.8) * h * 0.12;\n      const g1 = ctx.createRadialGradient(b1x, b1y, 0, b1x, b1y, w * 0.5);\n      g1.addColorStop(0, 'rgba(0,102,255,0.35)'); g1.addColorStop(1, 'rgba(0,102,255,0)');\n      ctx.fillStyle = g1; ctx.fillRect(0, 0, w, h);\n\n      const b2x = w * 0.7 + Math.cos(t * 0.7) * w * 0.15, b2y = h * 0.65 + Math.sin(t * 0.9) * h * 0.12;\n      const g2 = ctx.createRadialGradient(b2x, b2y, 0, b2x, b2y, w * 0.5);\n      g2.addColorStop(0, 'rgba(255,45,85,0.30)'); g2.addColorStop(1, 'rgba(255,45,85,0)');\n      ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);\n\n      if (this.mouse.active) {\n        const gm = ctx.createRadialGradient(this.mouse.x, this.mouse.y, 0, this.mouse.x, this.mouse.y, 260);\n        gm.addColorStop(0, 'rgba(120,140,255,0.18)'); gm.addColorStop(1, 'rgba(120,140,255,0)');\n        ctx.fillStyle = gm; ctx.fillRect(0, 0, w, h);\n      }\n\n      for (const n of nodes) {\n        n.x += n.vx; n.y += n.vy;\n        if (n.x < 0 || n.x > w) n.vx *= -1;\n        if (n.y < 0 || n.y > h) n.vy *= -1;\n      }\n      for (let i = 0; i < nodes.length; i++) {\n        for (let j = i + 1; j < nodes.length; j++) {\n          const a = nodes[i], b = nodes[j];\n          const dx = a.x - b.x, dy = a.y - b.y;\n          const dist = Math.sqrt(dx * dx + dy * dy);\n          if (dist < 140) {\n            let alpha = (1 - dist / 140) * 0.25;\n            if (this.mouse.active) {\n              const mdA = Math.hypot(a.x - this.mouse.x, a.y - this.mouse.y);\n              const mdB = Math.hypot(b.x - this.mouse.x, b.y - this.mouse.y);\n              if (mdA < 220 || mdB < 220) alpha = Math.min(1, alpha + 0.5);\n            }\n            ctx.strokeStyle = 'rgba(140,170,255,' + alpha + ')';\n            ctx.lineWidth = 1;\n            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();\n          }\n        }\n      }\n      for (const n of nodes) {\n        let r = 1.6, alpha = 0.5;\n        if (this.mouse.active) {\n          const d = Math.hypot(n.x - this.mouse.x, n.y - this.mouse.y);\n          if (d < 220) { const boost = 1 - d / 220; r = 1.6 + boost * 2.2; alpha = 0.5 + boost * 0.5; }\n        }\n        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2);\n        ctx.fillStyle = 'rgba(180,200,255,' + alpha + ')';\n        ctx.fill();\n      }\n\n      for (const p of particles) {\n        p.x += p.vx; p.y += p.vy;\n        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;\n        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;\n        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);\n        ctx.fillStyle = p.hue + '0.55)';\n        ctx.fill();\n      }\n    };\n    draw();\n  }\n\n  componentDidUpdate() {\n    this.initHero();\n  }\n\n  componentWillUnmount() {\n    if (this.rafId) cancelAnimationFrame(this.rafId);\n    if (this._heroResize) window.removeEventListener('resize', this._heroResize);\n    if (this._heroMove) window.removeEventListener('mousemove', this._heroMove);\n    if (this._heroLeave) window.removeEventListener('mouseleave', this._heroLeave);\n    if (this.galeriaUnsubscribe) this.galeriaUnsubscribe();\n  }\n\n  loadScript(src, timeoutMs) {\n    if (!window.__sipScriptPromises) window.__sipScriptPromises = {};\n    if (window.__sipScriptPromises[src]) return window.__sipScriptPromises[src];\n    const p = new Promise((resolve, reject) => {\n      const existing = document.querySelector('script[src=\"' + src + '\"]');\n      if (existing && existing.__loaded) { resolve(); return; }\n      const timer = setTimeout(() => reject(new Error('Timeout ao carregar ' + src)), timeoutMs || 4000);\n      const s = existing || document.createElement('script');\n      s.src = src;\n      s.onload = () => { clearTimeout(timer); s.__loaded = true; resolve(); };\n      s.onerror = () => { clearTimeout(timer); reject(new Error('Falha ao carregar ' + src)); };\n      if (!existing) document.head.appendChild(s);\n    });\n    window.__sipScriptPromises[src] = p;\n    return p;\n  }\n\n  async waitForFirebase() {\n    await this.loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');\n    await this.loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');\n    await this.loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');\n    await this.loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js');\n  }\n\n  async componentDidMount() {\n    this.loadVisitaPhotos();\n    this.addExamplePhoto();\n    try {\n      await this.waitForFirebase();\n      if (!firebase.apps.length) {\n        firebase.initializeApp({\n          apiKey: \"AIzaSyDNBXkzFJFAsOKefmBesSWmwRHgS0i7ACA\",\n          authDomain: \"sip-sistema-intelig-de-projeto.firebaseapp.com\",\n          projectId: \"sip-sistema-intelig-de-projeto\",\n          storageBucket: \"sip-sistema-intelig-de-projeto.firebasestorage.app\",\n          messagingSenderId: \"957059964424\",\n          appId: \"1:957059964424:web:30ba5c315b713c2c05bbbd\"\n        });\n      }\n      await firebase.auth().signInAnonymously();\n      await this.ensureSeedData();\n      await this.ensureAracuaiProject();\n      await this.ensureRubimProject();\n      await this.ensureGurinhataProject();\n      await this.ensureRotaLiberdadeProject();\n      await this.loadProjetos();\n    } catch (e) {\n      console.error('SIP init error', e);\n      this.setState({ firestoreError: (e && e.message) || 'Não foi possível conectar ao Firestore.' });\n    } finally {\n      this.setState({ authResolved: true }, () => this.initHero());\n    }\n  }\n\n  enter() {\n    this.resetHero();\n    this.setState({ showAcesso: true });\n  }\n\n  voltarCapaFromAcesso() {\n    this.resetHero();\n    this.setState({ showAcesso: false });\n  }\n\n  selectConsol() {\n    this.setState({ showAcesso: false, showSenhaConsol: true, senhaConsolInput: '', senhaConsolErro: '' });\n  }\n\n  setSenhaConsolInput(e) {\n    this.setState({ senhaConsolInput: e.target.value, senhaConsolErro: '' });\n  }\n\n  toggleSenhaConsolVisible() {\n    this.setState({ senhaConsolVisible: !this.state.senhaConsolVisible });\n  }\n\n  // Tenta logar; se o erro for técnico/passageiro (rede, cache velho, servidor lento) — não\n  // \"senha errada\" de verdade — tenta de novo automaticamente até 2 vezes antes de desistir.\n  // Isso evita que falhas momentâneas (ex: cache do GitHub Pages) apareçam pro usuário como\n  // \"senha incorreta\", quando na real é só uma instabilidade passageira.\n  async signInComRetry(email, senha) {\n    const ERROS_DE_SENHA = ['auth/wrong-password', 'auth/user-not-found', 'auth/invalid-credential', 'auth/invalid-email', 'auth/invalid-login-credentials'];\n    const TENTATIVAS = 3;\n    for (let i = 1; i <= TENTATIVAS; i++) {\n      try {\n        await firebase.auth().signInWithEmailAndPassword(email, senha);\n        return { ok: true };\n      } catch (e) {\n        if (ERROS_DE_SENHA.includes(e.code)) {\n          return { ok: false, motivo: 'senha' };\n        }\n        if (i < TENTATIVAS) {\n          await new Promise(r => setTimeout(r, 900 * i));\n        } else {\n          return { ok: false, motivo: 'tecnico' };\n        }\n      }\n    }\n  }\n\n  async confirmSenhaConsol() {\n    if (this.state.senhaConsolLoading) return;\n    if (!this.state.senhaConsolInput) {\n      this.setState({ senhaConsolErro: 'Digite a senha.' });\n      return;\n    }\n    this.setState({ senhaConsolLoading: true, senhaConsolErro: '' });\n    const resultado = await this.signInComRetry('consol@sip-consol.interno', this.state.senhaConsolInput);\n    if (resultado.ok) {\n      this.setState({ showSenhaConsol: false, entered: true, wantsEnter: true, clienteAtivo: null, clienteNome: '', clienteTipos: [], senhaConsolInput: '', senhaConsolErro: '', senhaConsolLoading: false });\n    } else if (resultado.motivo === 'senha') {\n      this.setState({ senhaConsolErro: 'Senha incorreta. Tente novamente.', senhaConsolInput: '', senhaConsolLoading: false });\n    } else {\n      this.setState({ senhaConsolErro: 'Falha de conexão. Atualize a página forçando o recarregamento (aperte Ctrl+Shift+R) e tente novamente.', senhaConsolLoading: false });\n    }\n  }\n\n  voltarAcessoFromSenha() {\n    this.setState({ showSenhaConsol: false, showAcesso: true, senhaConsolInput: '', senhaConsolErro: '' });\n  }\n\n  selectCliente() {\n    this.setState({ showAcesso: false, showSenhaCliente: true, usuarioClienteInput: '', senhaClienteInput: '', senhaClienteErro: '' });\n  }\n\n  setUsuarioClienteInput(e) {\n    this.setState({ usuarioClienteInput: e.target.value, senhaClienteErro: '' });\n  }\n\n  setSenhaClienteInput(e) {\n    this.setState({ senhaClienteInput: e.target.value, senhaClienteErro: '' });\n  }\n\n  toggleSenhaClienteVisible() {\n    this.setState({ senhaClienteVisible: !this.state.senhaClienteVisible });\n  }\n\n  async confirmSenhaCliente() {\n    if (this.state.senhaClienteLoading) return;\n    const CLIENTES = {\n      'der-mg': { nome: 'DER-MG', tipos: ['mg-259', 'aracuai-nc', 'rubim-rp'] },\n      'der-pr': { nome: 'DER-PR', tipos: [] },\n      'rota-liberdade': { nome: 'Rota da Liberdade', tipos: ['rota-liberdade'] },\n    };\n    const usuario = (this.state.usuarioClienteInput || '').trim().toLowerCase().replace('@sip-consol.interno', '');\n    const cliente = CLIENTES[usuario];\n    if (!usuario || !this.state.senhaClienteInput) {\n      this.setState({ senhaClienteErro: 'Preencha usuário e senha.' });\n      return;\n    }\n    if (!cliente) {\n      this.setState({ senhaClienteErro: 'Usuário ou senha incorretos.', senhaClienteInput: '' });\n      return;\n    }\n    this.setState({ senhaClienteLoading: true, senhaClienteErro: '' });\n    const resultado = await this.signInComRetry(usuario + '@sip-consol.interno', this.state.senhaClienteInput);\n    if (resultado.ok) {\n      // Se o cliente só tem 1 projeto visível pra ele, não faz sentido mostrar uma lista de\n      // escolha com 1 item só — vai direto pra dentro do projeto.\n      const projetosVisiveis = (this.state.projetos || []).filter(p => cliente.tipos.includes(p.tipo));\n      const autoAbrir = projetosVisiveis.length === 1;\n      this.setState({\n        showSenhaCliente: false, entered: true, wantsEnter: true,\n        clienteAtivo: usuario, clienteNome: cliente.nome, clienteTipos: cliente.tipos,\n        usuarioClienteInput: '', senhaClienteInput: '', senhaClienteErro: '', senhaClienteLoading: false,\n        view: autoAbrir ? 'projeto' : 'projetos',\n        selectedProjetoId: autoAbrir ? projetosVisiveis[0].id : null,\n      });\n    } else if (resultado.motivo === 'senha') {\n      this.setState({ senhaClienteErro: 'Usuário ou senha incorretos.', senhaClienteInput: '', senhaClienteLoading: false });\n    } else {\n      this.setState({ senhaClienteErro: 'Falha de conexão. Atualize a página forçando o recarregamento (aperte Ctrl+Shift+R) e tente novamente.', senhaClienteLoading: false });\n    }\n  }\n\n  voltarAcessoFromSenhaCliente() {\n    this.setState({ showSenhaCliente: false, showAcesso: true, usuarioClienteInput: '', senhaClienteInput: '', senhaClienteErro: '' });\n  }\n\n  resetHero() {\n    if (this.rafId) cancelAnimationFrame(this.rafId);\n    this.heroInited = false;\n  }\n\n  openSobre() {\n    this.resetHero();\n    this.setState({ showSobre: true });\n  }\n\n  closeSobre() {\n    this.resetHero();\n    this.setState({ showSobre: false });\n  }\n\n  db() {\n    return firebase.firestore();\n  }\n\n  async ensureSeedData() {\n    const clientesSnap = await this.db().collection('clientes').limit(1).get();\n    if (!clientesSnap.empty) return;\n    const clienteRef = await this.db().collection('clientes').add({ nome: 'DER-MG (exemplo)' });\n    const contratoRef = await this.db().collection('contratos').add({ clienteId: clienteRef.id, numero: 'DC-007/2024', descricao: 'Contrato de projetos rodoviários — exemplo' });\n    await this.db().collection('projetos').add({ contratoId: contratoRef.id, nome: 'Serro - Trinta Reis', rodovia: 'MG-259', status: 'Modelo pronto', tipo: 'mg-259' });\n  }\n\n  async ensureAracuaiProject() {\n    const ref = this.db().collection('projetos').doc('seed-aracuai-nc');\n    const doc = await ref.get();\n    if (doc.exists) return;\n    const contratosSnap = await this.db().collection('contratos').where('numero', '==', 'DP-024/2023').limit(1).get();\n    let contratoId = contratosSnap.empty ? null : contratosSnap.docs[0].id;\n    if (!contratoId) {\n      const clienteRef = await this.db().collection('clientes').add({ nome: 'DER-MG (exemplo)' });\n      const contratoRef = await this.db().collection('contratos').add({ clienteId: clienteRef.id, numero: 'DP-024/2023', descricao: 'Lote 5 — Araçuaí-Novo Cruzeiro / Novo Cruzeiro-Ladainha / Rubim-Rio do Prado' });\n      contratoId = contratoRef.id;\n    }\n    await ref.set({ contratoId, nome: 'Araçuaí - Novo Cruzeiro', rodovia: 'LMG-678', status: 'Aguardando dados', tipo: 'aracuai-nc' });\n  }\n\n  async ensureRubimProject() {\n    const snap = await this.db().collection('projetos').where('tipo', '==', 'rubim-rp').limit(1).get();\n    if (!snap.empty) {\n      if (snap.docs[0].data().rodovia !== 'MG-406') await snap.docs[0].ref.update({ rodovia: 'MG-406' });\n      return;\n    }\n    let contratoId;\n    const contratoSnap = await this.db().collection('contratos').where('numero', '==', 'DP-024/2023').limit(1).get();\n    if (!contratoSnap.empty) {\n      contratoId = contratoSnap.docs[0].id;\n    } else {\n      const clienteRef = await this.db().collection('clientes').add({ nome: 'DER-MG (exemplo)' });\n      const contratoRef = await this.db().collection('contratos').add({ clienteId: clienteRef.id, numero: 'DP-024/2023', descricao: 'Lote 5 — Araçuaí-Novo Cruzeiro / Novo Cruzeiro-Ladainha / Rubim-Rio do Prado' });\n      contratoId = contratoRef.id;\n    }\n    const ref = this.db().collection('projetos').doc();\n    await ref.set({ contratoId, nome: 'Rubim - Rio do Prado', rodovia: 'MG-406', status: 'Aguardando dados', tipo: 'rubim-rp' });\n  }\n\n  async ensureGurinhataProject() {\n    const ref = this.db().collection('projetos').doc('seed-gurinhata');\n    const doc = await ref.get();\n    if (doc.exists) return;\n    let clienteId;\n    const clienteSnap = await this.db().collection('clientes').where('nome', '==', 'DER-MG (exemplo)').limit(1).get();\n    if (!clienteSnap.empty) {\n      clienteId = clienteSnap.docs[0].id;\n    } else {\n      const clienteRef = await this.db().collection('clientes').add({ nome: 'DER-MG (exemplo)' });\n      clienteId = clienteRef.id;\n    }\n    const contratoRef = await this.db().collection('contratos').add({ clienteId, numero: 'A definir', descricao: 'Gurinhatã — BR-364/MG (contrato a definir)' });\n    await ref.set({ contratoId: contratoRef.id, nome: 'Gurinhatã', rodovia: 'BR-364/MG', status: 'Aguardando dados', tipo: 'gurinhata' });\n  }\n\n  async ensureRotaLiberdadeProject() {\n    const ref = this.db().collection('projetos').doc('seed-rota-liberdade');\n    const doc = await ref.get();\n    if (doc.exists) return;\n    let clienteId;\n    const clienteSnap = await this.db().collection('clientes').where('nome', '==', 'DER-MG (exemplo)').limit(1).get();\n    if (!clienteSnap.empty) {\n      clienteId = clienteSnap.docs[0].id;\n    } else {\n      const clienteRef = await this.db().collection('clientes').add({ nome: 'DER-MG (exemplo)' });\n      clienteId = clienteRef.id;\n    }\n    const contratoRef = await this.db().collection('contratos').add({ clienteId, numero: 'A definir', descricao: 'Rota da Liberdade — BR-356/BR-262 (contrato a definir)' });\n    await ref.set({ contratoId: contratoRef.id, nome: 'Rota da Liberdade', rodovia: 'BR-356/BR-262', status: 'Aguardando dados', tipo: 'rota-liberdade' });\n  }\n\n  async loadProjetos() {\n    const snap = await this.db().collection('projetos').get();\n    const projetos = snap.docs.map(d => ({ id: d.id, ...d.data() }));\n    const ordem = { 'gurinhata': 0, 'mg-259': 1, 'aracuai-nc': 2, 'rubim-rp': 3, 'rota-liberdade': 4 };\n    projetos.sort((a, b) => (ordem[a.tipo] ?? 99) - (ordem[b.tipo] ?? 99));\n    this.setState({ projetos, dataLoaded: true });\n  }\n\n  openProjeto(projeto) {\n    this.setState({ view: 'projeto', selectedProjetoId: projeto.id });\n  }\n\n  goProjetos() {\n    this.setState({ view: 'projetos', selectedProjetoId: null });\n  }\n\n  goCover() {\n    this.resetHero();\n    this.setState({ entered: false, view: 'projetos', selectedProjetoId: null, clienteAtivo: null, clienteNome: '', clienteTipos: [] });\n  }\n\n  openVisitaTecnica() {\n    this.setState({ view: 'visita-tecnica' });\n    this.loadVisitaPhotos();\n  }\n\n  openGaleriaFromVisita() {\n    this.setState({ view: 'galeria-visita' });\n  }\n\n  voltarVisita() {\n    this.setState({ view: 'visita-tecnica' });\n  }\n\n  toggleGaleriaDisciplina(disc) {\n    this.setState(s => ({\n      galeriaDisciplinasExpanded: { ...s.galeriaDisciplinasExpanded, [disc]: !s.galeriaDisciplinasExpanded[disc] }\n    }));\n  }\n\n  latLngToUTM(lat, lng) {\n    const utm = this.llToUtm(lat, lng);\n    if (!utm) return 'Coordenadas indisponíveis';\n    const zone = utm.zone;\n    const easting = Math.round(utm.easting);\n    const northing = Math.round(utm.northing);\n    return `Zona ${zone} | ${easting}E ${northing}N`;\n  }\n\n  llToUtm(lat, lng) {\n    const a = 6378137; const b = 6356752.314245; const f = 1 / 298.257223563;\n    const e = Math.sqrt(1 - (1 - f) * (1 - f));\n    const N = a / Math.sqrt(1 - e * e * Math.sin(lat * Math.PI / 180) ** 2);\n    const T = Math.tan(lat * Math.PI / 180) ** 2;\n    const C = e * e * Math.cos(lat * Math.PI / 180) ** 2 / (1 - e * e);\n    const A = Math.cos(lat * Math.PI / 180) * ((lng - (Math.floor((lng + 180) / 6) * 6 + 3)) * Math.PI / 180);\n    const M = a * ((1 - e * e / 4 - 3 * e * e * e * e / 64 - 5 * e * e * e * e * e * e / 256) * lat * Math.PI / 180 - (3 * e * e / 8 + 3 * e * e * e * e / 32 - 45 * e * e * e * e * e * e / 1024) * Math.sin(2 * lat * Math.PI / 180) + (15 * e * e * e * e / 256 - 45 * e * e * e * e * e * e / 1024) * Math.sin(4 * lat * Math.PI / 180) - (35 * e * e * e * e * e * e / 3072) * Math.sin(6 * lat * Math.PI / 180));\n    const easting = 500000 + N * (A + N * T * A * A * A / 6 + N * T * T * A * A * A * A * A / 120);\n    const northing = (lat < 0 ? 10000000 : 0) + M + N * T * A * A / 2 + N * T * T * A * A * A * A / 24;\n    const zone = Math.floor((lng + 180) / 6) + 1;\n    return { zone, easting, northing };\n  }\n\n  setVisitaProjeto(e) { this.setState({ visitaProjetoId: e.target.value }); }\n  setVisitaDisciplina(e) { this.setState({ visitaDisciplina: e.target.value }); }\n  setVisitaKm(e) { this.setState({ visitaKm: e.target.value }); }\n  setVisitaObs(e) { this.setState({ visitaObs: e.target.value }); }\n\n  idbOpen() {\n    return new Promise((resolve, reject) => {\n      const req = indexedDB.open('sip-visita-campo', 1);\n      req.onupgradeneeded = () => {\n        const db = req.result;\n        if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos', { keyPath: 'id' });\n      };\n      req.onsuccess = () => resolve(req.result);\n      req.onerror = () => reject(req.error);\n    });\n  }\n\n  async idbAll() {\n    const db = await this.idbOpen();\n    return new Promise((resolve, reject) => {\n      const req = db.transaction('fotos', 'readonly').objectStore('fotos').getAll();\n      req.onsuccess = () => resolve(req.result);\n      req.onerror = () => reject(req.error);\n    });\n  }\n\n  async idbPut(rec) {\n    const db = await this.idbOpen();\n    return new Promise((resolve, reject) => {\n      const tx = db.transaction('fotos', 'readwrite');\n      tx.objectStore('fotos').put(rec);\n      tx.oncomplete = () => resolve();\n      tx.onerror = () => reject(tx.error);\n    });\n  }\n\n  async idbDelete(id) {\n    const db = await this.idbOpen();\n    return new Promise((resolve, reject) => {\n      const tx = db.transaction('fotos', 'readwrite');\n      tx.objectStore('fotos').delete(id);\n      tx.oncomplete = () => resolve();\n      tx.onerror = () => reject(tx.error);\n    });\n  }\n\n  loadVisitaPhotos() {\n    this.idbAll().then(list => {\n      const withUrls = list.map(r => ({ ...r, url: URL.createObjectURL(r.blob) }));\n      withUrls.sort((a, b) => b.criadoEm - a.criadoEm);\n      this.setState({ visitaPhotos: withUrls });\n    }).catch(err => console.error('idbAll error', err));\n  }\n\n  buildGaleriaDisciplinas() {\n    const fotos = this.state.visitaPhotos;\n    const byDisc = {};\n    fotos.forEach(f => {\n      const disc = f.disciplina || 'Sem disciplina';\n      if (!byDisc[disc]) byDisc[disc] = [];\n      byDisc[disc].push(f);\n    });\n    const disciplinas = Object.keys(byDisc).sort();\n    return disciplinas.map(disc => ({\n      disciplina: disc,\n      count: byDisc[disc].length,\n      expanded: !!this.state.galeriaDisciplinasExpanded[disc],\n      toggle: () => this.toggleGaleriaDisciplina(disc),\n      fotos: byDisc[disc].map(f => {\n        const data = new Date(f.criadoEm);\n        const dataFormatada = data.toLocaleDateString('pt-BR');\n        const lat = f.lat !== undefined ? f.lat : -19.9191;\n        const lng = f.lng !== undefined ? f.lng : -43.9386;\n        const localizacao = f.localizacao || 'Belo Horizonte';\n        const coordenadasUTM = this.latLngToUTM(lat, lng);\n        return {\n          localizacao,\n          dataFormatada,\n          coordenadasUTM,\n          obs: f.obs || '',\n          imgRef: (el) => { if (el && el.src !== f.url) el.src = f.url; },\n        };\n      }),\n    }));\n  }\n\n  setupGaleriaListener() {\n    if (this.galeriaUnsubscribe) return;\n    try {\n      this.galeriaUnsubscribe = this.db().collection('visitasCampo').orderBy('criadoEm', 'desc').onSnapshot(snap => {\n        const fotos = snap.docs.map(d => {\n          const data = d.data();\n          return { id: d.id, ...data, url: data.imageData || data.url };\n        });\n        console.log('Galeria atualizada:', fotos.length, 'fotos');\n        this.setState({ galeriaPhotos: fotos });\n      });\n    } catch (e) {\n      console.error('Erro ao configurar listener da galeria', e);\n    }\n  }\n\n  async loadGaleriaPhotos() {\n    try {\n      const snap = await this.db().collection('visitasCampo').orderBy('criadoEm', 'desc').get();\n      const fotos = snap.docs.map(d => {\n        const data = d.data();\n        return { id: d.id, ...data, url: data.imageData || data.url };\n      });\n      console.log('Galeria carregada:', fotos.length, 'fotos');\n      this.setState({ galeriaPhotos: fotos });\n      this.setupGaleriaListener();\n    } catch (e) {\n      console.error('Erro ao carregar galeria', e);\n    }\n  }\n\n  compressImage(file, maxW) {\n    return new Promise((resolve, reject) => {\n      const img = document.createElement('img');\n      const url = URL.createObjectURL(file);\n      img.onload = () => {\n        const scale = Math.min(1, maxW / img.width);\n        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);\n        const canvas = document.createElement('canvas');\n        canvas.width = w; canvas.height = h;\n        canvas.getContext('2d').drawImage(img, 0, 0, w, h);\n        URL.revokeObjectURL(url);\n        canvas.toBlob(b => resolve(b), 'image/jpeg', 0.72);\n      };\n      img.onerror = reject;\n      img.src = url;\n    });\n  }\n\n  getGeolocation() {\n    return new Promise((resolve) => {\n      if (navigator.geolocation) {\n        navigator.geolocation.getCurrentPosition(\n          (pos) => {\n            resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, source: 'gps' });\n          },\n          (err) => {\n            console.warn('GPS não disponível:', err);\n            resolve(null);\n          },\n          { timeout: 10000, enableHighAccuracy: true }\n        );\n      } else {\n        resolve(null);\n      }\n    });\n  }\n\n  async getLocationByIP() {\n    try {\n      const resp = await fetch('https://ipapi.co/json/');\n      if (!resp.ok) return null;\n      const data = await resp.json();\n      if (data.latitude && data.longitude) {\n        return { lat: data.latitude, lng: data.longitude, localizacao: data.city || 'Localização desconhecida', source: 'ip' };\n      }\n    } catch (e) {\n      console.warn('IP geolocation fallback failed', e);\n    }\n    return null;\n  }\n\n  async getLocationName(lat, lng) {\n    try {\n      const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);\n      if (!resp.ok) return null;\n      const data = await resp.json();\n      if (data.address && data.address.city) return data.address.city;\n      if (data.address && data.address.town) return data.address.town;\n    } catch (e) {\n      console.warn('Reverse geocoding failed', e);\n    }\n    return null;\n  }\n\n  async onCapturaFotos(e) {\n    const files = Array.from(e.target.files || []);\n    e.target.value = '';\n    if (!files.length) return;\n    if (!this.state.visitaDisciplina) { alert('Selecione a disciplina antes de fotografar.'); return; }\n    let geoData = await this.getGeolocation();\n    if (!geoData) geoData = await this.getLocationByIP();\n    const lat = geoData?.lat || -19.9191;\n    const lng = geoData?.lng || -43.9386;\n    let localizacao = geoData?.localizacao || 'Belo Horizonte';\n    if (!localizacao && geoData && geoData.lat && geoData.lng) {\n      const nomeLocal = await this.getLocationName(geoData.lat, geoData.lng);\n      if (nomeLocal) localizacao = nomeLocal;\n    }\n    for (const file of files) {\n      const blob = await this.compressImage(file, 1600);\n      await this.idbPut({\n        id: 'foto_' + Date.now() + '_' + Math.random().toString(36).slice(2),\n        blob,\n        projetoId: this.state.visitaProjetoId || null,\n        disciplina: this.state.visitaDisciplina,\n        km: this.state.visitaKm,\n        obs: this.state.visitaObs,\n        lat,\n        lng,\n        localizacao,\n        geoSource: geoData?.source || 'padrão',\n        criadoEm: Date.now(),\n        synced: false,\n      });\n    }\n    this.loadVisitaPhotos();\n  }\n\n  async addExamplePhoto() {\n    const existing = await this.idbAll();\n    if (existing.length > 0) return;\n    const canvas = document.createElement('canvas');\n    canvas.width = 800; canvas.height = 600;\n    const ctx = canvas.getContext('2d');\n    const grad = ctx.createLinearGradient(0, 0, 800, 600);\n    grad.addColorStop(0, '#0066ff'); grad.addColorStop(1, '#ff2d55');\n    ctx.fillStyle = grad; ctx.fillRect(0, 0, 800, 600);\n    ctx.fillStyle = '#fff'; ctx.font = '48px sans-serif'; ctx.textAlign = 'center';\n    ctx.fillText('Foto de Exemplo', 400, 280);\n    ctx.font = '24px sans-serif'; ctx.fillText('Geometria', 400, 340);\n    canvas.toBlob(blob => {\n      this.idbPut({\n        id: 'foto_exemplo_' + Date.now(),\n        blob,\n        projetoId: null,\n        disciplina: 'Geometria',\n        km: '10+500',\n        obs: 'Foto de exemplo para teste',\n        criadoEm: Date.now() - 3600000,\n        synced: false,\n      }).then(() => this.loadVisitaPhotos());\n    });\n  }\n\n  async deleteFoto(id) {\n    await this.idbDelete(id);\n    this.loadVisitaPhotos();\n  }\n\n  blobToBase64(blob) {\n    return new Promise((resolve, reject) => {\n      const reader = new FileReader();\n      reader.onload = () => resolve(reader.result);\n      reader.onerror = reject;\n      reader.readAsDataURL(blob);\n    });\n  }\n\n  async sincronizarFotos() {\n    if (this.state.visitaSyncing) return;\n    const pendentes = this.state.visitaPhotos.filter(p => !p.synced);\n    if (!pendentes.length) { alert('Nenhuma foto pendente para sincronizar.'); return; }\n    this.setState({ visitaSyncing: true });\n    let sucessos = 0;\n    for (const foto of pendentes) {\n      try {\n        c
