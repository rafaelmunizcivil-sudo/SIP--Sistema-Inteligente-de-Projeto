  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ebeff1df-8832-4099-add3-494ddc6998ba\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <style>\n    body{margin:0;font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}\n    a{color:#2f6690;}\n    a:hover{color:#1f3a5f;}\n    ::-webkit-scrollbar{width:10px;height:10px;}\n    ::-webkit-scrollbar-thumb{background:#c4ccd6;border-radius:6px;}\n  <\u002Fstyle>\n  \n<\u002Fhelmet>\n\n\n<div style=\"display:flex;min-height:100vh;background:#eef1f4;color:#1f2933;\">\n\n  <nav style=\"width:264px;flex:0 0 264px;background:{{ primaryColor }};display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;\">\n    <div style=\"padding:20px 22px 18px;border-bottom:1px solid rgba(255,255,255,0.12);\">\n      <div style=\"background:#fff;border-radius:8px;padding:8px 12px;display:inline-block;margin-bottom:14px;\">\n        <img src=\"e4d0dd82-aac6-40c6-a382-e19833da09a5\" alt=\"Consol Engenheiros Consultores\" style=\"display:block;height:28px;width:auto;\">\n      <\u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:0.12em;color:rgba(255,255,255,0.55);text-transform:uppercase;margin-bottom:4px;\">Rodovia MG-259<\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:700;color:#fff;line-height:1.3;\">Serro – Trinta Reis<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"8\">\n        <div sc-camel-on-click=\"{{ item.select }}\" style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ item.bg }};\" style-hover=\"background:rgba(255,255,255,0.08);\">\n          <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:{{ item.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;\">{{ item.code }}<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ item.label }}<\u002Fdiv>\n            <sc-if value=\"{{ item.status }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:10.5px;color:{{ item.statusColor }};margin-top:1px;\">{{ item.status }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding:16px 22px;border-top:1px solid rgba(255,255,255,0.12);font-size:11px;color:rgba(255,255,255,0.45);\">\n      Modelo estrutural · v1\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"margin-left:264px;flex:1;min-width:0;padding:38px 48px 64px;\">\n\n    <!-- ===================== HOME / VISÃO GERAL ===================== -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Visão Geral\">\n        <div style=\"margin-bottom:30px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Visão Geral do Projeto<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:30px;color:#1f3a5f;font-weight:700;\">Restauração e Ampliação de Capacidade — MG-259<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:680px;line-height:1.6;\">\n            Trecho entre Serro e Trinta Reis, na região central de Minas Gerais (Serra do Espinhaço).\n            Este site organiza as sete matérias técnicas do projeto em um formato interativo, pensado\n            para diretoria e órgãos públicos, com estrutura reaproveitável para os\n            próximos projetos.\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:36px;\">\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Extensão do trecho<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;color:#1f3a5f;\">{{ homeStats.extensao }} km<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Matérias técnicas<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;color:#1f3a5f;\">{{ homeStats.materias }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Modelos concluídos<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;color:#1f3a5f;\">{{ homeStats.modelos }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Fase atual<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:#1f3a5f;padding-top:4px;\">Estruturação<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:24px 26px;margin-bottom:36px;\">\n          <div style=\"font-size:15px;font-weight:700;color:#1f3a5f;margin-bottom:18px;\">Cronograma geral (ilustrativo)<\u002Fdiv>\n          <div style=\"position:relative;height:78px;\">\n            <div style=\"position:absolute;left:0;right:0;top:42px;height:6px;background:#eef1f4;border-radius:3px;\"><\u002Fdiv>\n            <sc-for list=\"{{ timelinePhases }}\" as=\"ph\" hint-placeholder-count=\"7\">\n              <div style=\"position:absolute;top:42px;height:6px;left:{{ ph.left }}%;width:{{ ph.width }}%;background:{{ ph.color }};border-radius:3px;\"><\u002Fdiv>\n              <div style=\"position:absolute;top:0;left:{{ ph.left }}%;width:{{ ph.width }}%;font-size:9.5px;line-height:1.25;color:#5b6774;white-space:normal;overflow-wrap:break-word;\">{{ ph.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"position:absolute;top:34px;left:{{ todayLeft }}%;width:2px;height:22px;background:#c0392b;\"><\u002Fdiv>\n            <div style=\"position:absolute;top:58px;left:{{ todayLeft }}%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#c0392b;white-space:nowrap;\">hoje<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:15px;font-weight:700;color:#1f3a5f;margin-bottom:14px;\">Matérias do projeto<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n          <sc-for list=\"{{ materiaCards }}\" as=\"m\" hint-placeholder-count=\"7\">\n            <div sc-camel-on-click=\"{{ m.select }}\" style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;\" style-hover=\"border-color:#2f6690;box-shadow:0 4px 14px rgba(31,58,95,0.08);\">\n              <div style=\"display:flex;align-items:center;gap:12px;\">\n                <div style=\"width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:{{ m.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;\">{{ m.code }}<\u002Fdiv>\n                <div style=\"font-size:14.5px;font-weight:700;color:#1f2933;\">{{ m.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#5b6774;line-height:1.5;flex:1;\">{{ m.desc }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:{{ m.statusColor }};\">{{ m.status }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== ANÁLISE ===================== -->\n    <sc-if value=\"{{ isAnalise }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Análise\">\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Análise<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Análise por Disciplina<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:680px;line-height:1.6;\">\n            Pareceres e pendências recebidos do órgão (DER-MG) para cada matéria técnica do projeto.\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px;\">\n          <sc-for list=\"{{ analiseDisciplinas }}\" as=\"disc\" hint-placeholder-count=\"7\">\n            <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;overflow:hidden;\">\n              <div sc-camel-on-click=\"{{ disc.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;gap:12px;\">\n                <div style=\"display:flex;align-items:center;gap:12px;\">\n                  <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:{{ disc.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;\">{{ disc.code }}<\u002Fdiv>\n                  <div style=\"font-size:15.5px;font-weight:700;color:#1f2933;\">{{ disc.label }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:18px;color:#8a94a3;\">{{ disc.chevron }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ disc.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:0 20px 20px;border-top:1px solid #eef1f4;\">\n\n                  <sc-if value=\"{{ disc.hasAnalises }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px;\">\n                      <sc-for list=\"{{ disc.analises }}\" as=\"an\" hint-placeholder-count=\"2\">\n                        <div style=\"background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;padding:18px 20px;\">\n                          <div sc-camel-on-click=\"{{ an.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;cursor:pointer;\">\n                            <div style=\"font-size:14.5px;font-weight:700;color:#1f2933;\">Análise nº {{ an.numero }}<\u002Fdiv>\n                            <div style=\"display:flex;align-items:center;gap:10px;\">\n                              <div style=\"font-size:12.5px;font-weight:700;color:#fff;background:{{ primaryColor }};border:1px solid {{ primaryColor }};padding:5px 12px;border-radius:20px;white-space:nowrap;\">{{ an.total }} questionamentos<\u002Fdiv>\n                              <div style=\"font-size:17px;color:#8a94a3;\">{{ an.chevron }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n\n                          <sc-if value=\"{{ an.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"margin-top:14px;\">\n\n                          <sc-if value=\"{{ an.comparativo }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;\">\n                              <div style=\"font-size:11px;font-weight:600;color:#8a94a3;background:#f4f6f8;border:1px solid #dde3ea;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Reiterando análise anterior: {{ an.comparativo.reiterando }}<\u002Fdiv>\n                              <div style=\"font-size:11px;font-weight:600;color:#2f6690;background:#eaf1f7;border:1px solid #d7e4ee;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Questionamentos novos: {{ an.comparativo.novo }}<\u002Fdiv>\n                              <div style=\"font-size:11px;font-weight:600;color:#2f8f4f;background:#eef8f0;border:1px solid #cfe9d6;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Atendidos: {{ an.comparativo.atendido }}<\u002Fdiv>\n                              <div style=\"font-size:11px;font-weight:600;color:#b5541f;background:#fdf1e8;border:1px solid #f0dcc4;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Atendidos parcialmente: {{ an.comparativo.parcial }}<\u002Fdiv>\n                              <div style=\"font-size:11px;font-weight:600;color:#c0392b;background:#fbeaea;border:1px solid #f2d3d3;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Não atendidos: {{ an.comparativo.nao }}<\u002Fdiv>\n                              <sc-if value=\"{{ an.comparativo.pendente }}\" hint-placeholder-val=\"{{ false }}\">\n                                <div style=\"font-size:11px;font-weight:600;color:#8a94a3;background:#f4f6f8;border:1px solid #dde3ea;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Aguardando resposta: {{ an.comparativo.pendente }}<\u002Fdiv>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n\n                          <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #eef1f4;\">\n                            <div><span style=\"font-size:10.5px;color:#8a94a3;\">Recebido<\u002Fspan><div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ an.recebido }}<\u002Fdiv><\u002Fdiv>\n                            <div><span style=\"font-size:10.5px;color:#8a94a3;\">Concluído<\u002Fspan><div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ an.concluido }}<\u002Fdiv><\u002Fdiv>\n                            <div><span style=\"font-size:10.5px;color:#8a94a3;\">Prazo de resposta<\u002Fspan><div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ an.prazo }}<\u002Fdiv><\u002Fdiv>\n                            <div><span style=\"font-size:10.5px;color:#8a94a3;\">Analista<\u002Fspan><div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ an.analista }}<\u002Fdiv><\u002Fdiv>\n                          <\u002Fdiv>\n\n                          <div style=\"font-size:11px;font-weight:700;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;\">Questionamentos por documento<\u002Fdiv>\n                          <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:12px;\">\n                            <sc-for list=\"{{ an.docs }}\" as=\"d\" hint-placeholder-count=\"4\">\n                              <div style=\"background:#fff;border:1px solid #eef1f4;border-radius:8px;padding:16px 18px;\">\n                                <div sc-camel-on-click=\"{{ d.toggle }}\" style=\"display:flex;align-items:flex-start;justify-content:space-between;cursor:pointer;gap:10px;\">\n                                  <div style=\"font-size:13.5px;font-weight:700;color:#1f2933;\">{{ d.label }}<\u002Fdiv>\n                                  <div style=\"display:flex;align-items:center;gap:8px;flex:0 0 auto;\">\n                                    <div style=\"font-size:14px;font-weight:700;color:#2f6690;background:#eaf1f7;border-radius:12px;padding:3px 11px;white-space:nowrap;\">{{ d.count }}<\u002Fdiv>\n                                    <div style=\"font-size:16px;color:#8a94a3;\">{{ d.chevron }}<\u002Fdiv>\n                                  <\u002Fdiv>\n                                <\u002Fdiv>\n                                <sc-if value=\"{{ d.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                                  <div style=\"margin:10px 0 0;padding-top:10px;border-top:1px solid #e6ebf0;display:flex;flex-direction:column;gap:10px;\">\n                                    <sc-for list=\"{{ d.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                                      <div style=\"display:flex;gap:8px;align-items:flex-start;\">\n                                        <div style=\"font-size:11px;font-weight:700;color:#8a94a3;flex:0 0 auto;margin-top:1px;min-width:16px;\">{{ it.n }}.<\u002Fdiv>\n                                        <div>\n                                          <div style=\"font-size:12px;color:#374151;line-height:1.55;\">{{ it.text }}<\u002Fdiv>\n                                          <sc-if value=\"{{ it.statusLabel }}\" hint-placeholder-val=\"{{ false }}\">\n                                            <div style=\"font-size:10px;font-weight:700;color:{{ it.statusColor }};background:{{ it.statusBg }};border-radius:10px;padding:2px 8px;white-space:nowrap;display:inline-block;margin-top:5px;\">{{ it.statusLabel }}<\u002Fdiv>\n                                          <\u002Fsc-if>\n                                        <\u002Fdiv>\n                                      <\u002Fdiv>\n                                    <\u002Fsc-for>\n                                  <\u002Fdiv>\n                                <\u002Fsc-if>\n                              <\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                          <\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ disc.noAnalises }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:16px;padding:20px;background:#f8f9fb;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhuma análise cadastrada ainda para esta disciplina.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ disc.dashboard }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:18px;background:#0f2942;border-radius:12px;padding:22px 24px;\">\n                      <div style=\"font-size:14.5px;font-weight:700;color:#fff;margin-bottom:4px;\">Dashboard — {{ disc.label }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#9fb3c8;margin-bottom:16px;\">Projeto: Serro – Trinta Reis · Rodovia: MG-259 · Disciplina: {{ disc.label }}<\u002Fdiv>\n\n                      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;\">\n                        <sc-for list=\"{{ disc.dashboard.filterButtons }}\" as=\"fb\" hint-placeholder-count=\"6\">\n                          <div sc-camel-on-click=\"{{ fb.select }}\" style=\"font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;background:{{ fb.bg }};color:{{ fb.fg }};border:1px solid rgba(255,255,255,0.15);white-space:nowrap;\">{{ fb.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ disc.dashboard.isGeral }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;\">\n                          <div style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px 16px;\">\n                            <div style=\"font-size:10.5px;color:#9fb3c8;text-transform:uppercase;margin-bottom:4px;\">Total de Análises<\u002Fdiv>\n                            <div style=\"font-size:22px;font-weight:700;color:#fff;\">{{ disc.dashboard.totalAnalises }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px 16px;\">\n                            <div style=\"font-size:10.5px;color:#9fb3c8;text-transform:uppercase;margin-bottom:4px;\">Total de Questionamentos<\u002Fdiv>\n                            <div style=\"font-size:22px;font-weight:700;color:#fff;\">{{ disc.dashboard.totalQuestionamentos }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px 16px;\">\n                            <div style=\"font-size:10.5px;color:#9fb3c8;text-transform:uppercase;margin-bottom:4px;\">Média por Análise<\u002Fdiv>\n                            <div style=\"font-size:22px;font-weight:700;color:#fff;\">{{ disc.dashboard.media }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px 16px;\">\n                            <div style=\"font-size:10.5px;color:#9fb3c8;text-transform:uppercase;margin-bottom:4px;\">Última Análise<\u002Fdiv>\n                            <div style=\"font-size:16px;font-weight:700;color:#fff;padding-top:3px;\">{{ disc.dashboard.ultimaAnalise }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;\">\n                          <div style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:18px;\">\n                            <div style=\"font-size:12px;font-weight:700;color:#9fb3c8;text-transform:uppercase;letter-spacing:0 ative;overflow:hidden;\">\n                                    <div style=\"height:100%;background:#4f8fc0;border-radius:4px;width:{{ a.barPct }}%;\"><\u002Fdiv>\n                                  <\u002Fdiv>\n                                  <div style=\"font-size:11.5px;font-weight:700;color:#fff;width:24px;text-align:right;\">{{ a.total }}<\u002Fdiv>\n                                <\u002Fdiv>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;\">\n                          <div>\n                            <div style=\"font-size:12px;font-weight:700;color:#9fb3c8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;\">Comparativo Sequencial<\u002Fdiv>\n                            <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                              <sc-for list=\"{{ disc.dashboard.comparativos }}\" as=\"c\" hint-placeholder-count=\"4\">\n                                <div style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:16px 18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;\">\n                                  <div style=\"width:88px;height:88px;border-radius:50%;flex:0 0 88px;background:{{ c.pieGradient }};\"><\u002Fdiv>\n                                  <div style=\"flex:1;min-width:220px;\">\n                                    <div style=\"font-size:12.5px;font-weight:700;color:#fff;margin-bottom:8px;\">Análise {{ c.numero }} vs. Análise {{ c.anterior }}<\u002Fdiv>\n                                    <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;\">\n                                      <sc-for list=\"{{ c.pieLegend }}\" as=\"leg\" hint-placeholder-count=\"4\">\n                                        <div style=\"displ :#1f2933;\">{{ it.analisesLabel }}<\u002Fdiv>\n                                  <\u002Fdiv>\n                                  <div>\n                                    <div style=\"font-size:10px;color:#8a94a3;text-transform:uppercase;margin-bottom:2px;\">Total de repetições<\u002Fdiv>\n                                    <div style=\"font-size:12px;font-weight:700;color:#1f3a5f;\">{{ it.totalRepeticoes }}<\u002Fdiv>\n                                  <\u002Fdiv>\n                                  <div>\n                                    <div style=\"font-size:10px;color:#8a94a3;text-transform:uppercase;margin-bottom:2px;\">Situação atual<\u002Fdiv>\n                                    <div style=\"font-size:11px;font-weight:700;color:{{ it.statusColor }};background:{{ it.statusBg }};border-radius:10px;padding:2px 9px;display:inline-block;\">{{ it.statusLabel }}<\u002Fdiv>\n                                  <\u002Fdiv>\n                                <\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ disc.observacoes.noItems }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"padding:18px;background:#f8f9fb;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n                          <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhum questionamento recorrente neste filtro.<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== AVISOS ===================== -->\n    <sc-if value=\"{{ isAvisos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Avisos\">\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Avisos<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Reuniões e Comunicados<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">Espaço para registrar o que foi conversado em reuniões com chefes de equipe e coordenadores, organizado como uma linha do tempo.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:20px 22px;margin-bottom:28px;\">\n          <div style=\"font-size:13px;font-weight:700;color:#1f3a5f;margin-bottom:14px;\">Novo registro<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:160px 200px 1fr;gap:12px;margin-bottom:12px;\">\n            <input type=\"date\" value=\"{{ avisoForm.data }}\" sc-camel-on-change=\"{{ onAvisoData }}\" style=\"padding:9px 10px;border:1px solid #dde3ea;border-radius:6px;font-size:13px;color:#1f2933;\">\n            <input type=\"text\" placeholder=\"Autor / equipe\" value=\"{{ avisoForm.autor }}\" sc-camel-on-change=\"{{ onAvisoAutor }}\" style=\"padding:9px 10px;border:1px solid #dde3ea;border-radius:6px;font-size:13px;color:#1f2933;\">\n            <input type=\"text\" placeholder=\"O que foi conversado...\" value=\"{{ avisoForm.texto }}\" sc-camel-on-change=\"{{ onAvisoTexto }}\" style=\"padding:9px 10px;border:1px solid #dde3ea;border-radius:6px;font-size:13px;color:#1f2933;\">\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onAddAviso }}\" style=\"display:inline-block;font-size:13px;font-weight:700;color:#fff;background:{{ primaryColor }};padding:9px 20px;border-radius:8px;cursor:pointer;\">Adicionar à linha do tempo<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasAvisos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:relative;padding-left:28px;\">\n            <div style=\"position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:#dde3ea;\"><\u002Fdiv>\n            <sc-for list=\"{{ avisosTimeline }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div style=\"position:relative;margin-bottom:22px;\">\n                <div style=\"position:absolute;left:-28px;top:4px;width:14px;height:14px;border-radius:50%;background:{{ primaryColor }};border:3px solid #eef1f4;\"><\u002Fdiv>\n                <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px 18px;\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;\">\n                    <div style=\"display:flex;align-items:center;gap:10px;\">\n                      <div style=\"font-size:12.5px;font-weight:700;color:#1f3a5f;\">{{ a.data }}<\u002Fdiv>\n                      <div style=\"font-size:11px;font-weight:600;color:#2f6690;background:#eaf1f7;border-radius:20px;padding:2px 10px;\">{{ a.autor }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ a.remove }}\" style=\"font-size:11px;color:#8a94a3;cursor:pointer;\">remover<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13px;color:#374151;line-height:1.55;\">{{ a.texto }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noAvisos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:24px;background:#f8f9fb;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n            <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhum registro ainda. Adicione o primeiro acima.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== CONSULTAS ===================== -->\n    <sc-if value=\"{{ isConsultas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Consultas\">\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Consultas<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Documentos para Consulta<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">Repositório de arquivos em PDF (normas, manuais, pareceres) para consulta rápida da equipe.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1.5px dashed #c9d2db;border-radius:10px;padding:28px;text-align:center;margin-bottom:28px;\">\n          <label style=\"cursor:pointer;\">\n            <input type=\"file\" accept=\"application/pdf\" multiple=\"true\" sc-camel-on-change=\"{{ onConsultaFile }}\" style=\"display:none;\">\n            <div style=\"font-size:14px;font-weight:700;color:#1f3a5f;margin-bottom:6px;\">Clique para enviar um PDF<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a94a3;\">ou arraste o arquivo até aqui<\u002Fdiv>\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasConsultas }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n            <sc-for list=\"{{ consultasList }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;\">\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:#c0392b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;\">PDF<\u002Fdiv>\n                  <div style=\"font-size:12.5px;font-weight:700;color:#1f2933;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ c.nome }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#8a94a3;\">Enviado em {{ c.dataUpload }}<\u002Fdiv>\n                <div style=\"display:flex;gap:10px;\">\n                  <a href=\"{{ c.url }}\" target=\"_blank\" style=\"font-size:12px;font-weight:700;color:#2f6690;\">Abrir<\u002Fa>\n                  <div sc-camel-on-click=\"{{ c.remove }}\" style=\"font-size:12px;color:#8a94a3;cursor:pointer;\">remover<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== GEOMETRIA (MODELO) ===================== -->\n    <sc-if value=\"{{ isGeometria }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Geometria\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;\">\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">01 · Geometria<\u002Fdiv>\n            <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Projeto Geométrico<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:680px;line-height:1.6;text-align:justify;\">\n              Restauração e ampliação de capacidade do trecho Serro–Trinta Reis (MG-259),\n              com cerca de 35 km de extensão. A via segue hoje o leito estradal existente, sem acostamentos e\n              com faixa de rolamento de 6,0 m, incluindo curvas de raio reduzido e uma ponte sobre o Rio do Peixe.\n              O segmento do Morro do Paiol, com curvas acentuadas e declive no sentido decrescente do estaqueamento,\n              é o ponto de maior complexidade do trecho.\n            <\u002Fp>\n          <\u002Fdiv>\n          <div style=\"font-size:10.5px;font-weight:600;color:#2f8f4f;background:#eef8f0;border:1px solid #cfe9d6;padding:5px 10px;border-radius:20px;white-space:nowrap;\">Fonte: Volume 1 – Projeto Executivo<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px;\">\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px;\">\n            <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Extensão locada<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:700;color:#1f3a5f;\">{{ geoNums.extensao }} km<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px;\">\n            <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Classe de projeto<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:700;color:#1f3a5f;\">{{ geoNums.classe }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px;\">\n            <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Em curva (planta)<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:700;color:#1f3a5f;\">{{ geoNums.curvasPlanta }}%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px;\">\n            <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Em curva (perfil)<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:700;color:#1f3a5f;\">{{ geoNums.curvasPerfil }}%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px;\">\n            <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Faixas adicionais<\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:700;color:#1f3a5f;\">{{ geoNums.faixasAdicionais }} - 9 km<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:20px 22px;margin-bottom:28px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n            <div style=\"font-size:15px;font-weight:700;color:#1f3a5f;\">Traçado em planta — esquemático<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;\">\n              <span style=\"font-size:11px;color:#8a94a3;\">Zoom<\u002Fspan>\n              <input type=\"range\" min=\"0.6\" max=\"2.4\" step=\"0.05\" value=\"{{ geoZoom }}\" sc-camel-on-change=\"{{ onZoomChange }}\" style=\"width:120px;\">\n              <span style=\"font-size:11px;color:#8a94a3;\">Esquema ilustrativo<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"width:100%;height:220px;border-radius:8px;overflow:hidden;margin-bottom:16px;background:#f4f6f8;\">\n            <img src=\"148c3e34-2341-4084-95a9-be0f7d7303b3\" alt=\"Cidade de Serro — vista aérea\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n          <\u002Fdiv>\n          <div sc-camel-on-pointer-down=\"{{ onPanStart }}\" sc-camel-on-pointer-move=\"{{ onPanMove }}\" sc-camel-on-pointer-up=\"{{ onPanEnd }}\" sc-camel-on-pointer-leave=\"{{ onPanEnd }}\" style=\"width:100%;height:260px;overflow:hidden;border-radius:8px;background:#f4f6f8;cursor:{{ geoCursor }};touch-action:none;\">\n            <svg sc-camel-view-box=\"0 0 1000 260\" style=\"width:100%;height:100%;display:block;transform:translate({{ geoPanX }}px,{{ geoPanY }}px) scale({{ geoZoom }});transform-origin:center;\">\n              <line x1=\"40\" y1=\"130\" x2=\"960\" y2=\"130\" stroke=\"#2f6690\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fline>\n\n              <circle cx=\"100\" cy=\"130\" r=\"6\" fill=\"#1f3a5f\"><\u002Fcircle>\n              <line x1=\"100\" y1=\"130\" x2=\"100\" y2=\"96\" stroke=\"#c9d2db\" stroke-width=\"1.5\"><\u002Fline>\n              <text x=\"100\" y=\"86\" font-size=\"11\" fill=\"#1f3a5f\" font-weight=\"700\" text-anchor=\"middle\">Interseção 1<\u002Ftext>\n              <text x=\"100\" y=\"70\" font-size=\"10\" fill=\"#8a94a3\" text-anchor=\"middle\">km 0,5<\u002Ftext>\n\n              <circle cx=\"230\" cy=\"130\" r=\"6\" fill=\"#1f3a5f\"><\u002Fcircle>\n              <line x1=\"230\" y1=\"130\" x2=\"230\" y2=\"164\" stroke=\"#c9d2db\" stroke-width=\"1.5\"><\u002Fline>\n              <text x=\"230\" y=\"182\" font-size=\"11\" fill=\"#1f3a5f\" font-weight=\"700\" text-anchor=\"middle\">Interseção 2<\u002Ftext>\n              <text x=\"230\" y=\"198\" font-size=\"10\" fill=\"#8a94a3\" text-anchor=\"middle\">km 1,9<\u002Ftext>\n\n              <circle cx=\"360\" cy=\"130\" r=\"6\" fill=\"#b5541f\"><\u002Fcircle>\n              <line x1=\"360\" y1=\"130\" x2=\"360\" y2=\"96\" stroke=\"#c9d2db\" stroke-width=\"1.5\"><\u002Fline>\n              <text x=\"360\" y=\"86\" font-size=\"11\" fill=\"#b5541f\" font-weight=\"700\" text-anchor=\"middle\">Ponte Rio do Peixe<\u002Ftext>\n              <text x=\"360\" y=\"70\" font-size=\"10\" fill=\"#8a94a3\" text-anchor=\"middle\">km 2,2<\u002Ftext>\n\n              <circle cx=\"490\" cy=\"130\" r=\"6\" fill=\"#1f3a5f\"><\u002Fcircle>\n              <line x1=\"490\" y1=\"130\" x2=\"490\" y2=\"164\" stroke=\"#c9d2db\" stroke-width=\"1.5\"><\u002Fline>\n              <text x=\"490\" y=\"182\" font-size=\"11\" fill=\"#1f3a5f\" font-weight=\"700\" text-anchor=\"middle\">Interseção 3<\u002Ftext>\n              <text x=\"490\" y=\"198\" font-size=\"10\" fill=\"#8a94a3\" text-anchor=\"middle\">km 3,8<\u002Ftext>\n\n              <circle cx=\"620\" cy=\"130\" r=\"6\" fill=\"#c0392b\"><\u002Fcircle>\n              <line x1=\"620\" y1=\"130\" x2=\"620\" y2=\"96\" stroke=\"#c9d2db\" stroke-width=\"1.5\"><\u002Fline>\n              <text x=\"620\" y=\"86\" font-size=\"11\" fill=\"#c0392b\" font-weight=\"700\" text-anchor=\"middle\">Morro do Paiol<\u002Ftext>\n              <text x=\"620\" y=\"70\" font-size=\"10\" fill=\"#8a94a3\" text-anchor=\"middle\">km 6 – 9<\u002Ftext>\n\n              <circle cx=\"750\" cy=\"130\" r=\"6\" fill=\"#1f3a5f\"><\u002Fcircle>\n              <line x1=\"750\" y1=\"130\" x2=\"750\" y2=\"164\" stroke=\"#c9d2db\" stroke-width=\"1.5\"><\u002Fline>\n              <text x=\"750\" y=\"182\" font-size=\"11\" fill=\"#1f3a5f\" font-weight=\"700\" text-anchor=\"middle\">Rio Jequitinhonha<\u002Ftext>\n              <text x=\"750\" y=\"198\" font-size=\"10\" fill=\"#8a94a3\" text-anchor=\"middle\">km 18<\u002Ftext>\n\n              <circle cx=\"880\" cy=\"130\" r=\"6\" fill=\"#1f3a5f\"><\u002Fcircle>\n              <line x1=\"880\" y1=\"130\" x2=\"880\" y2=\"96\" stroke=\"#c9d2db\" stroke-width=\"1.5\"><\u002Fline>\n              <text x=\"880\" y=\"86\" font-size=\"11\" fill=\"#1f3a5f\" font-weight=\"700\" text-anchor=\"middle\">Interseção 4<\u002Ftext>\n              <text x=\"880\" y=\"70\" font-size=\"10\" fill=\"#8a94a3\" text-anchor=\"middle\">km 30,1<\u002Ftext>\n\n              <text x=\"40\" y=\"150\" font-size=\"9.5\" fill=\"#8a94a3\" text-anchor=\"start\">Serro<\u002Ftext>\n              <text x=\"960\" y=\"150\" font-size=\"9.5\" fill=\"#8a94a3\" text-anchor=\"end\">Trinta Reis<\u002Ftext>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#8a94a3;margin-top:8px;\">Esquema simplificado da sequência de pontos de intervenção · arraste para deslocar, use o zoom para ampliar.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n          <sc-for list=\"{{ geoTopics }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n              <div sc-camel-on-click=\"{{ t.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;cursor:pointer;\">\n                <div style=\"font-size:14px;font-weight:700;color:#1f2933;\">{{ t.title }}<\u002Fdiv>\n                <div style=\"font-size:16px;color:#8a94a3;\">{{ t.chevron }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#5b6774;margin-top:6px;line-height:1.5;\">{{ t.summary }}<\u002Fdiv>\n              <sc-if value=\"{{ t.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px;color:#374151;margin-top:12px;padding-top:12px;border-top:1px solid #eef1f4;line-height:1.6;\">{{ t.detail }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== TERRAPLENAGEM (MODELO) ===================== -->\n    <sc-if value=\"{{ isTerraplenagem }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Terraplenagem\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;\">\n          <div>\n            <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">02 · Terraplenagem<\u002Fdiv>\n            <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Movimento de Terra<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">Volumes de corte e aterro, distribuição de materiais e perfil longitudinal terreno × projeto.<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showIllustrativeTags }}\" hint-placeholder-val=\"{{ true }}\ ht:700;color:#1f3a5f;margin-bottom:14px;\">Perfil longitudinal — arraste para explorar a estaca<\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 1000 220\" style=\"width:100%;height:220px;display:block;\">\n            <path d=\"{{ terraTerrPath }}\" fill=\"none\" stroke=\"#8a94a3\" stroke-width=\"2.5\"><\u002Fpath>\n            <path d=\"{{ terraProjPath }}\" fill=\"none\" stroke=\"#2f6690\" stroke-width=\"2.5\"><\u002Fpath>\n            <line x1=\"{{ terraMarkerX }}\" y1=\"10\" x2=\"{{ terraMarkerX }}\" y2=\"210\" stroke=\"#c0392b\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"><\u002Fline>\n            <circle cx=\"{{ terraMarkerX }}\" cy=\"{{ terraMarkerTerrY }}\" r=\"4.5\" fill=\"#8a94a3\"><\u002Fcircle>\n            <circle cx=\"{{ terraMarkerX }}\" cy=\"{{ terraMarkerProjY }}\" r=\"4.5\" fill=\"#2f6690\"><\u002Fcircle>\n          <\u002Fsvg>\n          <input type=\"range\" min=\"0\" max=\"100\" step=\"0.5\" value=\"{{ terraScrub }}\" sc-camel-on-change=\"{{ onScrubChange }}\" style=\"width:100%;margin-top:6px;\">\n          <div style=\"display:flex;gap:24px;margin-top:14px;flex-wrap:wrap;\">\n            <div><span style=\"font-size:11px;color:#8a94a3;\">Estaca<\u002Fspan><div style=\"font-size:15px;font-weight:700;color:#1f3a5f;\">{{ terraReadout.estaca }}<\u002Fdiv><\u002Fdiv>\n            <div><span style=\"font-size:11px;color:#8a94a3;\">Cota terreno<\u002Fspan><div style=\"font-size:15px;font-weight:700;color:#5b6774;\">{{ terraReadout.terr }} m<\u002Fdiv><\u002Fdiv>\n            <div><span style=\"font-size:11px;color:#8a94a3;\">Cota projeto<\u002Fspan><div style=\"font-size:15px;font-weight:700;color:#2f6690;\">{{ terraReadout.proj }} m<\u002Fdiv><\u002Fdiv>\n            <div><span style=\"font-size:11px;color:#8a94a3;\">Diferença<\u002Fspan><div style=\"font-size:15px;font-weight:700;color:{{ terraReadout.diffColor }};\">{{ terraReadout.diffLabel }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px;\">\n          <sc-for list=\"{{ terraTopics }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n              <div sc-camel-on-click=\"{{ t.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;cursor:pointer;\">\n                <div style=\"font-size:14px;font-weight:700;color:#1f2933;\">{{ t.title }}<\u002Fdiv>\n                <div style=\"font-size:16px;color:#8a94a3;\">{{ t.chevron }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#5b6774;margin-top:6px;line-height:1.5;\">{{ t.summary }}<\u002Fdiv>\n              <sc-if value=\"{{ t.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px;color:#374151;margin-top:12px;padding-top:12px;border-top:1px solid #eef1f4;line-height:1.6;\">{{ t.detail }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== MATÉRIAS EM ESTRUTURAÇÃO ===================== -->\n    <sc-for list=\"{{ placeholderSections }}\" as=\"sec\" hint-placeholder-count=\"5\">\n      <sc-if value=\"{{ sec.isActive }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"{{ sec.label }}\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;\">\n            <div>\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">{{ sec.order }} · {{ sec.label }}<\u002Fdiv>\n              <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">{{ sec.label }}<\u002Fh1>\n              <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:640px;line-height:1.6;\">\n                Esta seção segue o mesmo padrão de Geometria e Terraplenagem. Assim que os dados\n                desta matéria forem enviados, os indicadores e gráficos serão adicionados aqui.\n              <\u002Fp>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:600;color:#8a94a3;background:#f4f6f8;border:1px solid #dde3ea;padding:5px 10px;border-radius:20px;white-space:nowrap;\">Aguardando dados<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n            <sc-for list=\"{{ sec.topics }}\" as=\"top\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1.5px dashed #c9d2db;border-radius:10px;padding:20px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;\">\n                <div style=\"font-size:13.5px;font-weight:700;color:#5b6774;\">{{ top }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#a5aeb8;margin-top:14px;\">Aguardando conteúdo<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;primaryColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f3a5f&quot;,&quot;options&quot;:[&quot;#1f3a5f&quot;,&quot;#14304f&quot;,&quot;#2f6690&quot;,&quot;#0f2942&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;showIllustrativeTags&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aparência&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    active: 'home',\n    expanded: {},\n    geoZoom: 1,\n    geoPan: { x: 0, y: 0 },\n    dragging: false,\n    dragStart: null,\n    terraScrub: 45,\n    geoDashFilter: 'geral',\n    geoObsFilter: 'todos',\n    itensRepSelected: {},\n    itensRepHistorico: {},\n    avisos: [],\n    avisoForm: { data: '', autor: '', texto: '' },\n    consultas: [],\n  };\n\n  materiaMeta = [\n    { key: 'geometria', code: 'GE', label: 'Geometria', desc: 'Traçado em planta, perfil longitudinal e seções transversais.', modeled: true },\n    { key: 'terraplenagem', code: 'TE', label: 'Terraplenagem', desc: 'Volumes de corte, aterro e distribuição de materiais.', modeled: true },\n    { key: 'sinalizacao', code: 'SI', label: 'Sinalização', desc: 'Sinalização horizontal, vertical e dispositivos de segurança.', modeled: false },\n    { key: 'obras', code: 'OC', label: 'Obras Complementares', desc: 'Drenagem, obras de arte especiais e contenções.', modeled: false },\n    { key: 'desapropriacao', code: 'DE', label: 'Desapropriação', desc: 'Levantamento cadastral e processo indenizatório.', modeled: false },\n    { key: 'intersecao', code: 'IN', label: 'Interseção', desc: 'Geometria, capacidade e sinalização das interseções.', modeled: false },\n    { key: 'seguranca', code: 'SV', label: 'Segurança Viária', desc: 'Auditoria de segurança e pontos críticos.', modeled: false },\n  ];\n\n  placeholderTopics = {\n    sinalizacao: ['Sinalização horizontal', 'Sinalização vertical', 'Dispositivos de segurança'],\n    obras: ['Drenagem', 'Obras de arte especiais', 'Contenções'],\n    desapropriacao: ['Levantamento cadastral', 'Avaliação de imóveis', 'Processo indenizatório'],\n    intersecao: ['Geometria da interseção', 'Capacidade viária', 'Sinalização semafórica'],\n    seguranca: ['Auditoria de segurança', 'Pontos críticos', 'Dispositivos de proteção'],\n  };\n\n  geoTopicsData = [\n    { key: 'geo-int1', title: 'Interseção 1 — Milho Verde-MG', summary: 'Interseção em nível que recebe o tráfego da cidade de Milho Verde–MG.', detail: 'A interseção atual, em desnível e com rampa secundária de ~14%, será substituída por uma rotatória moderna (fluxo do anel central com prioridade), conforme o Manual de Interseções do DNIT, com raios e alças dimensionados para os veículos que utilizam o local.' },\n    { key: 'geo-int2', title: 'Interseção 2 — Retorno alongado', summary: 'Rótula de três ramos no entroncamento com o Contorno de Serro.', detail: 'A rótula existente não comporta o fluxo de veículos pesados (combinações BTL de até 30 m) vindos principalmente da mineradora AngloGold em Conceição do Mato Dentro. Será substituída por um retorno alongado, eliminando as invasões de canteiro central observadas hoje.' },\n    { key: 'geo-int3', title: 'Interseção 3 - Aeroporto', summary: 'Interseção do tipo Gota.', detail: 'Interseção do tipo gota localizada próxima ao aeroporto (estaca 194+0,00), com ilhas de canalização para os movimentos de entrada e saída, faixas de aceleração e desaceleração dimensionadas conforme a classe da rodovia.' },\n    { key: 'geo-ponte', title: 'Ponte sobre o Rio do Peixe', summary: 'Estrutura existente com 39 m de extensão e 6 m de plataforma.', detail: 'A plataforma de 6 m não atende aos parâmetros da Classe 1B. A ponte será alargada para a largura da seção padrão do projeto, incluindo acostamentos e um passeio unilateral do lado esquerdo, eliminando o estrangulamento de pista.' },\n    { key: 'geo-paiol', title: 'Morro do Paiol — ponto mais crítico', summary: 'Segmento de ~3 km com curvas acentuadas e rampa de 7,5%.', detail: 'Sem superlargura e com plataforma de apenas 6 m, é o trecho de maior recorrência de acidentes. O projeto prevê faixa adicional no sentido ascendente, barreira New Jersey e acostamentos/faixas de segurança em ambos os lados.' },\n    { key: 'geo-jeq', title: 'Rio Jequitinhonha — trecho ambientalmente sensível', summary: 'Km 18, aterro pleno próximo à nascente do rio.', detail: 'Por estar próximo à nascente do Jequitinhonha, não haverá alargamento de plataforma neste ponto, para evitar impacto ambiental. Como compensação, o projeto de sinalização prevê dispositivos mais ostensivos (advertência em sequência, LRV e ondulações transversais).' },\n    { key: 'geo-param', title: 'Interseção 4 - Juscelino Kubitschek', summary: 'Interseção do tipo gota que liga a cidade de Juscelino Kubitschek.', detail: 'Interseção do tipo gota localizada na estaca correspondente ao km 30,1, conectando o eixo principal à via de acesso à cidade de Juscelino Kubitschek, com ilhas de canalização e faixas de mudança de velocidade dimensionadas conforme a classe da rodovia.' },\n  ];\n\n  statusMeta = {\n    atendido: { label: 'Atendido', color: '#2f8f4f', bg: '#eef8f0' },\n    parcial: { label: 'Atendido parcialmente', color: '#b5541f', bg: '#fdf1e8' },\n    nao: { label: 'Não atendido', color: '#c0392b', bg: '#fbeaea' },\n    novo: { label: 'Novo', color: '#2f6690', bg: '#eaf1f7' },\n    pendente: { label: 'Aguardando resposta', color: '#8a94a3', bg: '#f4f6f8' },\n  };\n\n  analise3DocsData = [\n    { key: 'texto', label: 'Volume 1 – Texto (Estudo de Traçado)', items: [\n      { text: 'O item encontra-se em condições de aprovação.', status: 'atendido' },\n      { text: 'Apresentar os textos descritivos do Projeto Geométrico (Volume 1).', status: 'novo' },\n      { text: 'Apresentar no texto informações sobre as interseções a serem projetadas no trecho, bem como suas localizações em relação ao eixo principal e suas concepções.', status: 'novo' },\n    ] },\n    { key: 'planta', label: 'Volume 2 – Planta', items: [\n      { text: 'As curvas horizontais serão aprovadas somente após a aprovação do Estudo de Tráfego.', status: 'atendido' },\n      { text: 'Caso haja banqueta no projeto, adotar altura máxima de 8,0m, tolerância de 1,0m, banqueta com largura mínima de 4,0m e declividade transversal de -5,0%.', status: 'atendido' },\n      { text: 'Para as barreiras New Jersey, adotar largura de 0,30m e faixa de segurança de 0,70m, visando facilitar a drenagem nos pontos com New Jersey.', status: 'atendido' },\n      { text: 'Acrescentar, nos aterros projetados, 0,50 m na plataforma, para melhor execução da compactação no bordo da pista, onde serão instaladas as sarjetas.', status: 'nao' },\n      { text: 'Avaliar a visibilidade, em planta, nos pontos finais das faixas adicionais com base na classe da rodovia definida pelo estudo de tráfego.', status: 'atendido' },\n      { text: 'Compatibilizar o fim da terceira faixa (estaca 0+0, Lado Esquerdo) com a pista existente.', status: 'atendido' },\n    ] },\n    { key: 'perfil', label: 'Projeto Geométrico – Perfil', items: [\n      { text: 'Projetar os PIV\\u2019s em estacas inteiras ou intermediárias (+0,0, +5+10).', status: 'atendido' },\n      { text: 'Apresentar no perfil os pontos de início e fim das faixas adicionais.', status: 'atendido' },\n      { text: 'Retirar os PB\\u2019s e PA\\u2019s do perfil, objetivando melhor entendimento na elaboração da análise do projeto.', status: 'atendido' },\n      { text: 'Apresentar a estimativa de terraplenagem para prever compensação de volume de corte e aterro.', status: 'novo' },\n      { text: 'Compatibilizar o perfil após finalização do levantamento topográfico.', status: 'novo' },\n    ] },\n    { key: 'planta_pg', label: 'Projeto Geométrico – Planta', items: [\n      { text: 'Prever limpa rodas nos acessos existentes.', status: 'novo' },\n      { text: 'Apresentar cadastro topográfico para análise de interferências da pista com elementos existentes.', status: 'novo' },\n      { text: 'Adotar, nas banquetas, altura máxima de 8,0m com tolerância de 1,0m, largura mínima de 4,0m e declividade transversal de -5,0%.', status: 'novo' },\n      { text: 'Acrescentar, nos aterros projetados, 0,50 m na plataforma, para melhor execução da compactação no bordo da pista, onde serão instaladas as sarjetas.', status: 'novo' },\n      { text: '[Texto não recuperado da extração do PDF — inicia com \"V\"]', status: 'novo' },\n      { text: 'Apresentar as curvas de nível do projeto.', status: 'novo' },\n      { text: 'Cotar a plataforma em sua totalidade, representando todos os seus elementos.', status: 'novo' },\n      { text: 'Projetar superlargura das curvas de acordo com o Quadro 5.4.4.3 (Valores de Superlargura para Projeto, Pista de 2 Faixas, Veículo SR, Largura = 7,20m) do Manual de Projeto Geométrico – DNER 1999.', status: 'novo' },\n      { text: 'Projetar superelevação nos acostamentos e nas terceiras faixas, acompanhando a superelevação da pista principal.', status: 'novo' },\n      { text: 'Nos aterros acima de 1,20 m, representar defensa metálica (0,50 m) antes do dispositivo de drenagem.', status: 'novo' },\n      { text: 'Formatar os elementos existentes e projetados conforme padrão DER-MG.', status: 'novo' },\n      { text: 'Representar faixa de domínio com 15,0 m de distância do eixo. Onde o offset ultrapassar a faixa de domínio ou estiver a menos de 5,0 m, considerar o afastamento de 5,0 m da saia do aterro ou da crista do corte.', status: 'novo' },\n      { text: 'Apresentar aprovação dos estudos hidrológicos para definição das obras de arte especiais e correntes no trecho.', status: 'novo' },\n      { text: 'Apresentar em planta os bueiros existentes e projetados.', status: 'novo' },\n      { text: 'Apresentar malha de coordenadas.', status: 'novo' },\n      { text: 'Representar e cotar a plataforma da ponte com seus elementos separadamente (pista de rolamento, acostamento, barreira New Jersey em ambos os bordos e passeio unilateral).', status: 'novo' },\n      { text: 'Enviar quadro com estimativa de volume de corte e aterro para análise do perfil.', status: 'novo' },\n      { text: 'Compatibilizar o fim do projeto com a estrada existente, a fim de garantir o encaixe do projeto com a via.', status: 'novo' },\n      { text: 'Após aprovação do estudo de tráfego e definição da classe da rodovia, avaliar necessidade de faixa adicional em: estaca 424+0 a 636+0 (LD); 657+0 a 855+0 (LE); 879+0 a 1011+0 (LD); 1308+0 a 1452+0 (LD).', status: 'novo' },\n    ] },\n    { key: 'secoes', label: 'Seções Transversais', items: [\n      { text: 'Apresentar seções transversais.', status: 'novo' },\n    ] },\n    { key: 'intersec', label: 'Projeto de Interseções', items: [\n      { text: 'Interseção 1: os ramos de entrada e saída da rotatória devem ter faixas simples (não duplicadas), com largura mínima conforme a Tabela 45 do Manual de Projeto de Interseções.', status: 'parcial' },\n      { text: 'Interseção 1: o acesso ao Centro de Convenções deve ser compatibilizado com os ramos, também com faixas simples, garantindo o encaixe com a via existente.', status: 'atendido' },\n      { text: 'Interseção 1: avaliar o deslocamento da rotatória (incluindo a pista principal) para evitar conflito com a pista sentido Serro.', status: 'nao' },\n      { text: 'Interseção 1: realizar levantamento topográfico em área maior, que comporte a concepção da interseção.', status: 'atendido' },\n      { text: 'Interseção 2: a concepção apresentada é inviável pelo grande fluxo de veículos pesados e pela classe da rodovia — apresentar nova concepção garantindo segurança e visibilidade.', status: 'parcial' },\n      { text: 'Interseção 2: realizar levantamento topográfico em área maior, que comporte a concepção da interseção.', status: 'atendido' },\n    ] },\n  ];\n\n  terraTopicsData = [\n    { key: 'ter-escav', title: 'Escavação e categorias', summary: 'Classificação do material por categoria de escavação.', detail: 'O material escavado é classificado em 1ª, 2ª e 3ª categoria conforme dificuldade de escavação, orientando o método construtivo e o custo unitário.' },\n    { key: 'ter-compac', title: 'Compactação e controle', summary: 'Grau de compactação exigido e ensaios de controle.', detail: 'O controle tecnológico acompanha grau de compactação, umidade e CBR das camadas, garantindo a qualidade do aterro compactado.' },\n    { key: 'ter-transp', title: 'Transporte (DMT)', summary: 'Distância média de transporte entre origem e destino.', detail: 'A distância média de transporte impacta diretamente o custo de terraplenagem e orienta a definição dos caminhos de serviço.' },\n    { key: 'ter-destino', title: 'Destinação final', summary: 'Corpo do aterro, bota-fora e empréstimo lateral.', detail: 'O material excedente é encaminhado a bota-foras licenciados, enquanto a carência de volume é suprida por empréstimos laterais.' },\n  ];\n\n  terraProfile = [\n    { st: 0, terr: 60, proj: 90 }, { st: 10, terr: 40, proj: 85 }, { st: 20, terr: 70, proj: 80 },\n    { st: 30, terr: 130, proj: 95 }, { st: 40, terr: 170, proj: 120 }, { st: 50, terr: 150, proj: 150 },\n    { st: 60, terr: 110, proj: 155 }, { st: 70, terr: 80, proj: 140 }, { st: 80, terr: 60, proj: 110 },\n    { st: 90, terr: 90, proj: 95 }, { st: 100, terr: 120, proj: 90 },\n  ];\n\n  setActiveSection(key) {\n    this.setState({ active: key });\n  }\n\n  setAvisoField(field, value) {\n    this.setState(s => ({ avisoForm: { ...s.avisoForm, [field]: value } }));\n  }\n\n  addAviso() {\n    const f = this.state.avisoForm;\n    if (!f.data || !f.texto.trim()) return;\n    this.setState(s => ({\n      avisos: [...s.avisos, { id: Date.now(), data: f.data, autor: f.autor.trim() || 'Equipe', texto: f.texto.trim() }],\n      avisoForm: { data: '', autor: '', texto: '' },\n    }));\n  }\n\n  removeAviso(id) {\n    this.setState(s => ({ avisos: s.avisos.filter(a => a.id !== id) }));\n  }\n\n  addConsultaFile(fileList) {\n    const files = Array.from(fileList || []);\n    const novas = files.map(f => ({ id: Date.now() + Math.random(), nome: f.name, url: URL.createObjectURL(f), dataUpload: new Date().toLocaleDateString('pt-BR') }));\n    this.setState(s => ({ consultas: [...s.consultas, ...novas] }));\n  }\n\n  removeConsulta(id) {\n    this.setState(s => ({ consultas: s.consultas.filter(c => c.id !== id) }));\n  }\n\n  toggleCard(key) {\n    this.setState(s => ({ expanded: { ...s.expanded, [key]: !s.expanded[key] } }));\n  }\n\n  onZoomChange(e) {\n    this.setState({ geoZoom: parseFloat(e.target.value) });\n  }\n\n  onPanStart(e) {\n    this.setState({ dragging: true, dragStart: { x: e.clientX - this.state.geoPan.x, y: e.clientY - this.state.geoPan.y } });\n  }\n  onPanMove(e) {\n    if (!this.state.dragging) return;\n    const s = this.state.dragStart;\n    this.setState({ geoPan: { x: e.clientX - s.x, y: e.clientY - s.y } });\n  }\n  onPanEnd() {\n    this.setState({ dragging: false });\n  }\n\n  onScrubChange(e) {\n    this.setState({ terraScrub: parseFloat(e.target.value) });\n  }\n\n  interp(st) {\n    const pts = this.terraProfile;\n    for (let i = 0; i < pts.length - 1; i++) {\n      if (st >= pts[i].st && st <= pts[i + 1].st) {\n        const t = (st - pts[i].st) / (pts[i + 1].st - pts[i].st);\n        return {\n          terr: pts[i].terr + (pts[i + 1].terr - pts[i].terr) * t,\n          proj: pts[i].proj + (pts[i + 1].proj - pts[i].proj) * t,\n        };\n      }\n    }\n    return { terr: pts[pts.length - 1].terr, proj: pts[pts.length - 1].proj };\n  }\n\n  buildPath(key) {\n    return this.terraProfile.map((p, i) => (i === 0 ? 'M' : 'L') + (p.st * 10) + ',' + (220 - p[key])).join(' ');\n  }\n\n  // Each análise below is its OWN frozen, independent record — texts and counts are hardcoded per análise\n  // and must never be derived from (or recalculated against) a later análise. Comparativo stats for análise N\n  // are computed only from análise N's own item list (which already encodes, per item, whether it is new or\n  // carried over) — never by filtering or reconstructing análise N-1's numbers.\n\n  analise1DocsData = [\n    { key: 'texto', label: 'Volume 1 – Texto (Estudo de Traçado)', items: [\n      'Analisando as 3 propostas enviadas, e por se tratar de ponto crítico, deve ser adotada a Alternativa 2: faixas adicionais em ambos os sentidos associadas à barreira New Jersey, para segurança viária e capacidade operacional.',\n      'A decisão foi baseada nos baixos offsets de corte/aterro do projeto preliminar (base topográfica do Google). Após o levantamen 1docs.reduce((s, d) => s + d.count, 0);\n\n    const buildDocs = (docsData, prefix) => docsData.map(d => {\n      const items = d.items.map((it, i) => ({ n: i + 1, text: it.text, statusLabel: this.statusMeta[it.status].label, statusColor: this.statusMeta[it.status].color, statusBg: this.statusMeta[it.status].bg }));\n      const key = prefix + '-' + d.key;\n      return { key, label: d.label, count: items.length, items, toggle: () => this.toggleCard(key), isOpen: !!this.state.expanded[key], chevron: this.state.expanded[key] ? '−' : '+' };\n    });\n    const tally = (docsData) => {\n      let atendido = 0, parcial = 0, nao = 0, novo = 0, pendente = 0;\n      for (const d of docsData) for (const it of d.items) {\n        if (it.status === 'atendido') atendido++;\n        else if (it.status === 'parcial') parcial++;\n        else if (it.status === 'nao') nao++;\n        else if (it.status === 'novo') novo++;\n        else if (it.status === 'pendente') pendente++;\n      }\n      const reiterando = atendido + parcial + nao + pendente;\n      return { atendido, parcial, nao, novo, pendente, reiterando };\n    };\n\n    const a2docs = buildDocs(this.analise2DocsData, 'a2');\n    const total2 = a2docs.reduce((s, d) => s + d.count, 0);\n    const { atendido, parcial, nao, novo, reiterando } = tally(this.analise2DocsData);\n\n    const a3docs = buildDocs(this.analise3DocsData, 'a3');\n    const total3 = a3docs.reduce((s, d) => s + d.count, 0);\n    const comp3 = tally(this.analise3DocsData);\n\n    const a4docs = buildDocs(this.analise4DocsData, 'a4');\n    const total4 = a4docs.reduce((s, d) => s + d.count, 0);\n    const comp4 = tally(this.analise4DocsData);\n\n    const a5docs = buildDocs(this.analise5DocsData, 'a5');\n    const total5 = a5docs.reduce((s, d) => s + d.count, 0);\n    const comp5 = tally(this.analise5DocsData);\n\n    const cardOpen = (key) => this.state.expanded[key] === undefined ? true : this.state.expanded[key];\n\n    return [\n      {\n        key: ' n    ];\n  }\n\n  setGeoDashFilter(f) {\n    this.setState({ geoDashFilter: f });\n  }\n\n  setGeoObsFilter(f) {\n    this.setState({ geoObsFilter: f });\n  }\n\n  selectItemAnalise(key, numero) {\n    this.setState(s => ({ itensRepSelected: { ...s.itensRepSelected, [key]: s.itensRepSelected[key] === numero ? null : numero } }));\n  }\n\n  toggleItemHistorico(key) {\n    this.setState(s => ({ itensRepHistorico: { ...s.itensRepHistorico, [key]: !s.itensRepHistorico[key] } }));\n  }\n\n  buildGeoItensRepetidos() {\n    const raw = this.buildGeoObservacoesRaw();\n    const statusColors = {\n      atendido: { color: '#2f8f4f', bg: '#eef8f0', label: 'Atendido' },\n      parcial: { color: '#b5541f', bg: '#fdf1e8', label: 'Atendido Parcialmente' },\n      nao: { color: '#c0392b', bg: '#fbeaea', label: 'Não Atendido' },\n      novo: { color: '#2f6690', bg: '#eaf1f7', label: 'Item Novo' },\n      pendente: { color: '#8a94a3', bg: '#f4f6f8', label: 'Reiterando Análise Anterior' },\n    };\n    const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9\\s]/g, '').replace(/\\s+/g, ' ').trim();\n\n    const pending = raw.filter(i => i.totalRepeticoes >= 3 && i.statusKey !== 'atendido');\n\n    const items = pending.map((i, idx) => {\n      const key = norm(i.text);\n      const selected = this.state.itensRepSelected[key] ?? i.ultimaAnaliseNumero;\n      const historicoOpen = !!this.state.itensRepHistorico[key];\n      const primaryColor = this.props.primaryColor ?? '#1f3a5f';\n      const analiseButtons = i.analisesNumeros.map(numero => ({\n        numero,\n        bg: selected === numero ? primaryColor : '#f4f6f8',\n        fg: selected === numero ? '#fff' : '#5b6774',\n        select: () => this.selectItemAnalise(key, numero),\n      }));\n      // need per-analise status; re-derive from raw occurrences stored on the item (analisesNumeros aligns 1:1 with a status trail we don't retain) -\n      // rebuild via buildGeoObservacoesRaw
