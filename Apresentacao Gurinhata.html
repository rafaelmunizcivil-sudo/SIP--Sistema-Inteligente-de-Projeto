document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:0.12em;color:rgba(255,255,255,0.55);text-transform:uppercase;margin-bottom:4px;\">Rodovia BR-364/MG<\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:700;color:#fff;line-height:1.3;\">Gurinhatã<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1;\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"8\">\n        <div sc-camel-on-click=\"{{ item.select }}\" style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ item.bg }};\" style-hover=\"background:rgba(255,255,255,0.08);\">\n          <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:{{ item.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;\">{{ item.code }}<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-size:13.5px;font-weight:600;color:#fff;white-space:pre-line;line-height:1.25;\">{{ item.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding:16px 22px;border-top:1px solid rgba(255,255,255,0.12);font-size:11px;color:rgba(255,255,255,0.45);\">\n      Modelo estrutural · v1\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"flex:1;min-width:0;padding:38px 48px 64px;\">\n\n    <!-- ===================== VISÃO GERAL ===================== -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Visão Geral\">\n        <sc-if value=\"{{ onVoltarProjetos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ onVoltarProjetos }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#5b6774;margin-bottom:20px;\">← Voltar<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"margin-bottom:30px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Visão Geral do Projeto<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:30px;color:#1f3a5f;font-weight:700;\">Gurinhatã<\u002Fh1>\n          <div style=\"max-width:760px;font-size:14px;color:#5b6774;line-height:1.7;text-align:justify;display:flex;flex-direction:column;gap:14px;\">\n            <p style=\"margin:0;\">O Projeto Executivo de Geometria apresentado refere-se à BR-364/MG, no trecho compreendido entre o entroncamento com a MG-461 (P/Gurinhatã), aproximadamente no km 189,85, e o entroncamento com a BR-461(A), aproximadamente no km 202,05, totalizando 12,20 km de extensão.<\u002Fp>\n            <p style=\"margin:0;\">O trecho está inserido em um importante eixo rodoviário da região e contempla as condições necessárias para a adequação da rodovia ao longo do segmento, incluindo o correto encaixe com a pista existente ao final do trecho. Para esse ajuste, considera-se ainda uma extensão adicional de 60 metros.<\u002Fp>\n            <p style=\"margin:0;\">O projeto apresenta a configuração da rodovia ao longo do trecho, contemplando seu traçado, suas características principais e as condições necessárias à implantação da infraestrutura prevista.<\u002Fp>\n            <p style=\"margin:0;\">As soluções apresentadas constituem uma das principais referências para o desenvolvimento das demais disciplinas do projeto, contribuindo para a integração entre geometria, terraplenagem, drenagem, sinalização e obras complementares.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:36px;\">\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Extensão do trecho<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;color:#1f3a5f;\">{{ homeStats.extensao }} km<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Matérias técnicas<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;color:#1f3a5f;\">{{ homeStats.materias }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Modelos concluídos<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;color:#1f3a5f;\">{{ homeStats.modelos }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:18px 20px;\">\n            <div style=\"font-size:11px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;\">Fase atual<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:#1f3a5f;padding-top:4px;\">{{ homeStats.fase }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:24px 26px;margin-bottom:36px;\">\n          <div style=\"font-size:15px;font-weight:700;color:#1f3a5f;margin-bottom:18px;\">Cronograma geral (ilustrativo)<\u002Fdiv>\n          <div style=\"position:relative;height:78px;\">\n            <div style=\"position:absolute;left:0;right:0;top:42px;height:6px;background:#eef1f4;border-radius:3px;\"><\u002Fdiv>\n            <sc-for list=\"{{ timelinePhases }}\" as=\"ph\" hint-placeholder-count=\"7\">\n              <div style=\"position:absolute;top:0;left:{{ ph.left }}%;width:{{ ph.width }}%;\">\n                <div style=\"height:6px;top:42px;position:absolute;width:100%;background:{{ ph.color }};border-radius:3px;\"><\u002Fdiv>\n                <div title=\"{{ ph.title }}\" style=\"font-size:9.5px;font-weight:700;color:#5b6774;text-align:center;position:absolute;top:0;width:100%;\">{{ ph.code }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"position:absolute;top:34px;left:{{ todayLeft }}%;width:2px;height:22px;background:#c0392b;\"><\u002Fdiv>\n            <div style=\"position:absolute;top:58px;left:{{ todayLeft }}%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#c0392b;white-space:nowrap;\">hoje<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:15px;font-weight:700;color:#1f3a5f;margin-bottom:14px;\">Disciplinas do Projeto<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n          <sc-for list=\"{{ materiaCards }}\" as=\"m\" hint-placeholder-count=\"7\">\n            <div sc-camel-on-click=\"{{ m.select }}\" style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"display:flex;align-items:center;gap:12px;\">\n                <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:{{ m.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;\">{{ m.code }}<\u002Fdiv>\n                <div style=\"font-size:14.5px;font-weight:700;color:#1f2933;\">{{ m.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#5b6774;line-height:1.5;flex:1;\">{{ m.desc }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:700;color:{{ m.statusColor }};\">{{ m.status }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== ANÁLISE ===================== -->\n    <sc-if value=\"{{ isAnalise }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Análise\">\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Análise<\u002Fdiv>\n          <h1 style=\"margin:0 0 8px;font-size:28px;color:#1f3a5f;font-weight:700;\">Análise por Disciplina<\u002Fh1>\n          <p style=\"margin:0;font-size:14px;color:#5b6774;max-width:680px;line-height:1.6;\">\n            Pareceres e pendências recebidos dos órgãos (DNIT/DER-MG) para cada matéria técnica do projeto.\n          <\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;\">\n          <sc-for list=\"{{ disciplinas }}\" as=\"disc\" hint-placeholder-count=\"7\">\n            <div style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;overflow:hidden;\">\n              <div sc-camel-on-click=\"{{ disc.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;gap:12px;\">\n                <div style=\"display:flex;align-items:center;gap:12px;\">\n                  <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:{{ disc.iconBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;\">{{ disc.code }}<\u002Fdiv>\n                  <div style=\"font-size:15.5px;font-weight:700;color:#1f2933;\">{{ disc.label }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:14px;\">\n                  <div sc-camel-on-click=\"{{ disc.gerarRelatorio }}\" style=\"font-size:12px;font-weight:700;color:#1f3a5f;background:#eef1f4;border:1px solid #dde3ea;padding:8px 14px;border-radius:8px;cursor:pointer;\">Gerar Relatório<\u002Fdiv>\n                  <div style=\"font-size:18px;color:#8a94a3;\">{{ disc.chevron }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ disc.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:0 20px 20px;border-top:1px solid #eef1f4;\">\n                  <sc-if value=\"{{ disc.noAnalises }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-top:16px;padding:20px;background:#f8f9fb;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhuma análise cadastrada ainda para esta disciplina.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ disc.analise }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:16px;background:#f8f9fb;border:1px solid #eef1f4;border-radius:10px;padding:18px 20px;\">\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;margin-bottom:12px;\">\n                        <div style=\"display:flex;align-items:center;gap:10px;\">\n                          <div style=\"font-size:14.5px;font-weight:700;color:#1f2933;margin-right:2.5cm;\">Análise nº {{ disc.analise.numero }}<\u002Fdiv>\n                          <div style=\"display:flex;gap:14px;\">\n                            <div>\n                              <div style=\"font-size:9.5px;color:#8a94a3;text-transform:uppercase;\">Enviado<\u002Fdiv>\n                              <div style=\"font-size:14px;font-weight:700;color:#2f6690;\">{{ disc.analise.enviado }}<\u002Fdiv>\n                            <\u002Fdiv>\n                            <div>\n                              <div style=\"font-size:9.5px;color:#8a94a3;text-transform:uppercase;\">Recebido<\u002Fdiv>\n                              <div style=\"font-size:14px;font-weight:700;color:#2f6690;\">{{ disc.analise.recebido }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ disc.analise.veredito }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"font-size:11.5px;font-weight:700;color:#fff;background:#1f3a5f;border-radius:20px;padding:4px 12px;white-space:nowrap;\">{{ disc.analise.veredito }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ disc.analise.comparativo }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;\">\n                          <div style=\"font-size:11px;font-weight:600;color:#8a94a3;background:#f4f6f8;border:1px solid #dde3ea;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Reiterando análise anterior: {{ disc.analise.comparativo.reiterando }}<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;color:#2f6690;background:#eaf1f7;border:1px solid #d7e4ee;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Questionamentos novos: {{ disc.analise.comparativo.novo }}<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;color:#2f8f4f;background:#eef8f0;border:1px solid #cfe9d6;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Atendidos: {{ disc.analise.comparativo.atendido }}<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;color:#b5541f;background:#fdf1e8;border:1px solid #f0dcc4;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Atendidos parcialmente: {{ disc.analise.comparativo.parcial }}<\u002Fdiv>\n                          <div style=\"font-size:11px;font-weight:600;color:#c0392b;background:#fbeaea;border:1px solid #f2d3d3;padding:4px 10px;border-radius:20px;white-space:nowrap;\">Não atendidos: {{ disc.analise.comparativo.nao }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #eef1f4;\">\n                        <div><span style=\"font-size:10.5px;color:#8a94a3;\">Recebido<\u002Fspan><div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ disc.analise.recebido }}<\u002Fdiv><\u002Fdiv>\n                        <div><span style=\"font-size:10.5px;color:#8a94a3;\">Concluído<\u002Fspan><div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ disc.analise.concluido }}<\u002Fdiv><\u002Fdiv>\n                        <div><span style=\"font-size:10.5px;color:#8a94a3;\">Analista<\u002Fspan><div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ disc.analise.analista }}<\u002Fdiv><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                        <sc-for list=\"{{ disc.analise.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n                          <div style=\"background:#fff;border:1px solid #eef1f4;border-radius:8px;padding:14px 16px;\">\n                            <div style=\"display:flex;gap:8px;align-items:flex-start;\">\n                              <div style=\"font-size:11px;font-weight:700;color:#8a94a3;flex:0 0 auto;margin-top:1px;min-width:30px;\">{{ it.n }}<\u002Fdiv>\n                              <div>\n                                <div style=\"font-size:12.5px;color:#374151;line-height:1.55;\">{{ it.text }}<\u002Fdiv>\n                                <sc-if value=\"{{ it.statusLabel }}\" hint-placeholder-val=\"{{ false }}\">\n                                  <div style=\"font-size:11.5px;font-weight:700;color:{{ it.statusColor }};background:{{ it.statusBg }};border-radius:10px;padding:2px 9px;white-space:nowrap;display:inline-block;margin-top:6px;\">{{ it.statusLab ck=\"{{ toggleReuniaoPasswordVisible }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#8a94a3;display:flex;\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"><\u002Fpath><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"><\u002Fline><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ reuniaoPasswordHidden }}\" hint-placeholder-val=\"{{ true }}\">\n                <div sc-camel-on-click=\"{{ toggleReuniaoPasswordVisible }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#8a94a3;display:flex;\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ reuniaoPasswordError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:11.5px;color:#c0392b;margin-bottom:10px;\">Senha incorreta.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div sc-camel-on-click=\"{{ onReuniaoPasswordSubmit }}\" style=\"font-size:12.5px;font-weight:700;color:#fff;background:{{ primaryColor }};padding:9px 18px;border-radius:8px;cursor:pointer;width:fit-content;\">Entrar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ reuniaoUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;\">\n            <sc-for list=\"{{ disciplinas }}\" as=\"disc\" hint-placeholder-count=\"7\">\n              <div style=\"font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:20px;background:#fff;border:1px solid #dde3ea;color:#5b6774;\">{{ disc.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:40px;background:#fff;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n            <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhuma análise cadastrada ainda para este projeto.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;primaryColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f3a5f&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  PROJETO = 'gurinhata';\n  medicaoSenha = 'consol2026';\n\n  state = {\n    active: 'home',\n    expanded: {},\n    medicaoPasswordDraft: '', medicaoPasswordError: false, medicaoUnlocked: false,\n    terceirosPasswordDraft: '', terceirosPasswordError: false, terceirosUnlocked: false,\n    reuniaoPasswordDraft: '', reuniaoPasswordError: false, reuniaoUnlocked: false,\n  };\n\n  // Ordem replicada do print de pastas enviado pelo usuário (ago/2026).\n  materiaMeta = [\n    { key: 'tracado', code: 'ET', label: 'Estudo de\\nTraçado', desc: 'Estudo das alternativas de traçado e escolha da concepção geométrica preliminar.', hasDados: true },\n    { key: 'trafego', code: 'TR', label: 'Estudo de\\nTráfego', desc: 'Levantamento e projeção de volumes de tráfego (VMD, classificação veicular).', hasDados: true },\n    { key: 'geologico', code: 'GL', label: 'Estudo\\nGeológico', desc: 'Caracterização geológica do trecho e das áreas de interesse.' },\n    { key: 'geot-pav', code: 'GP', label: 'Estudo Geotécnico Pavimentação\\ne Proj. Pavimentação', desc: 'Sondagens e dimensionamento da estrutura do pavimento.' },\n    { key: 'geot-terra', code: 'GT', label: 'Estudos Geotécnicos\\npara Terraplenagem', desc: 'Investigação geotécnica para cortes, aterros e taludes.' },\n    { key: 'hidrologia', code: 'EH', label: 'Estudos\\nHidrológicos', desc: 'Estudos hidrológicos ao longo do traçado.' },\n    { key: 'topografico', code: 'TO', label: 'Estudos\\nTopográficos', desc: 'Levantamento planialtimétrico do trecho.' },\n    { key: 'bueiros', code: 'FB', label: 'Fundação\\nde Bueiros', desc: 'Dimensionamento das fundações das obras de drenagem transversal.' },\n    { key: 'orcamento', code: 'OR', label: 'Orçamento', desc: 'Composição de custos e orçamento da obra.' },\n    { key: 'sondagem', code: 'PS', label: 'Programação\\nde Sondagem', desc: 'Planejamento das campanhas de sondagem geotécnica.' },\n    { key: 'desapropriacao', code: 'DE', label: 'Projeto de\\nDesapropriação', desc: 'Levantamento cadastral e processo indenizatório.' },\n    { key: 'drenagem', code: 'DR', label: 'Projeto de\\nDrenagem', desc: 'Drenagem superficial e profunda ao longo do traçado.' },\n    { key: 'sinalizacao', code: 'SV', label: 'Projeto de\\nSinalização', desc: 'Sinalização horizontal, vertical e dispositivos de segurança.' },\n    { key: 'geometrico', code: 'PG', label: 'Projeto\\nGeométrico', desc: 'Traçado em planta, perfil longitudinal e seções transversais definitivos.' },\n    { key: 'oae', code: 'OA', label: 'Projeto\\nOAE', desc: 'Obras de arte especiais (pontes e viadutos).' },\n    { key: 'obras', code: 'OC', label: 'Projeto Obras\\nComplementares', desc: 'Contenções e demais obras complementares.' },\n    { key: 'terraplenagem', code: 'TE', label: 'Projeto\\nTerraplenagem', desc: 'Volumes de corte, aterro e distribuição de materiais.' },\n    { key: 'ambiental', code: 'RA', label: 'Relatório\\nAmbiental', desc: 'Diagnóstico e condicionantes ambientais do empreendimento.' },\n  ];\n\n  // Parecer DNIT (Relatório de Análise 75-B.4-2024-SEPLAN/COENGE/DNIT, 30/12/2024) — disciplina Estudo de Traçado.\n  // Considerada só a seção \"4. ANÁLISE\" (item por item + veredito \"Análise DNIT: ...\"); Introdução/Antecedentes/Normativo\n  // (seções 1-3) foram descartados a pedido do usuário. Item 4.1 tem dois vereditos \"Análise DNIT\" seguidos no PDF sem\n  // item numerado entre eles — marcado como pendente de confirmação, não inventado. Itens 4.9-4.11 (\"Novos Comentários\")\n  // foram redirecionados pelo próprio DNIT para a disciplina Projeto Geométrico — não entram aqui.\n  tracadoAnalise1Items = [\n    { n: '4.1', text: 'Todas as alternativas foram apresentadas de forma preliminar e a escolhida deverá atender às recomendações abaixo na próxima fase.', statusLabel: 'Não atendido', statusColor: '#c0392b', statusBg: '#fbeaea', nota: 'PDF traz dois vereditos \"Análise DNIT\" em sequência para este item (um \"Não atendido\" com justificativa, outro apenas \"Atendido\"), sem item numerado entre eles — pendente de confirmação com o usuário sobre se são dois itens distintos.' },\n    { n: '4.2', text: 'Na alternativa 1 indicou-se declividade das pistas e acostamentos igual a 2%, recomendamos o valor mínimo de 3%.', statusLabel: 'Não se aplica a esta entrega', statusColor: '#8a94a3', statusBg: '#f4f6f8' },\n    { n: '4.3', text: 'Nas alternativas 1 e 3 adotou-se raio horizontal menor que o mínimo recomendado para a velocidade de 80 km/h e superelevação máxima de 8%.', statusLabel: 'Não se aplica a esta entrega', statusColor: '#8a94a3', statusBg: '#f4f6f8' },\n    { n: '4.4', text: 'Na alternativa 2 a rampa mínima utilizada não obedece ao mínimo recomendado.', statusLabel: 'Atendido', statusColor: '#2f8f4f', statusBg: '#eef8f0' },\n    { n: '4.5', text: 'Os valores das rampas máximas estão acima do recomendado para região ondulada, porém quando da escolha da alternativa a ser detalhada será analisada a flexibilização possível.', statusLabel: 'Atendido', statusColor: '#2f8f4f', statusBg: '#eef8f0' },\n    { n: '4.6', text: 'Nas alternativas 3 e 4 as extensões das rampas máximas estão muito longas, acima de 1 km.', statusLabel: 'Não se aplica a esta entrega', statusColor: '#8a94a3', statusBg: '#f4f6f8' },\n    { n: '4.7', text: 'Os parâmetros K indicados para curvas convexas e côncavas não atendem à velocidade de 80 km/h.', statusLabel: 'Atendido', statusColor: '#2f8f4f', statusBg: '#eef8f0' },\n    { n: '4.8', text: 'Não foi adotada curva de transição para raios menores que 1200.', statusLabel: 'Atendido', statusColor: '#2f8f4f', statusBg: '#eef8f0' },\n  ];\n\n  // Parecer DNIT — disciplina Estudos Geológicos, Análise 1 (relatório 75J-2024-SEPLAN/COENGE/DNIT, 04/04/2025).\n  // Item único conforme Item 4 do PDF: apresentar quadro de programação do plano de sondagens com inclusão SPT na estaca 592.\n  geologicoAnalise1Items = [\n    { n: '4.1', text: 'Conforme Instrução de Serviço 202 - Estudos Geológicos, apresentar o quadro de programação do plano de sondagens, conforme apresentado anteriormente no documento (SEI 19765133), levando em consideração a observação no Relatório de Análise 75H-2 (SEI 19745302), onde solicita a inclusão de sondagem SPT na estaca 592.' },\n  ];\n\n  buildGeologicoAnalises() {\n    return [{\n      numero: 1,\n      codigo: '75J-2024-SEPLAN/COENGE/DNIT',\n      orgao: 'DNIT',\n      veredito: null, comparativo: null,\n      enviado: 'Não informado', recebido: '04/04/2025', concluido: '04/04/2025',\n      analista: 'Janice Mesquita Teodoro',\n      items: this.geologicoAnalise1Items,\n    }];\n  }\n\n  // Parecer DNIT — disciplina Estudo de Tráfego, Análise 1 (primeira análise; sem análise anterior, por isso os\n  // itens não têm veredito Atendido/Não atendido — são só observações/solicitações do DNIT). Identificação do\n  // relatório (código/data/analista) e conclusão não foram enviadas — deixado \"Não informado\", nunca inventado.\n  trafegoAnalise1Items = [\n    { n: '5.1', text: 'Foram implantados 3 postos para a contagem volumétrica e classificatória do tráfego. O posto P1 localizado um pouco antes do início do segmento na interseção para Gurinhatã, contagem de 3 dias de 24 horas. O posto P2 próximo à ponte do Marimbondo, contagem de 7 dias de 24 horas. O posto P3 na BR-365, contagem de 3 dias de 24 horas e pesquisa de origem/destino de 3 dias de 16 horas. Além disto utilizou-se os dados coletados através do Plano Nacional de Contagens de Tráfego - PNCT do DNIT, do posto localizado na BR-365 - Km 714,00. Este posto foi utilizado para correção do fator de sazonalidade mensal dos postos P1, P2 e P3.' },\n    { n: '5.2', text: 'Para fins de cálculo do volume da hora pico, a projetista adotou o Fator Horário de Projeto k = 0,085 e o Fator Hora de Pico FHP = 0,900. Os valores são próximos aos observados no Posto P3, que já se encontra em uma condição estabilizada, diferentemente da situação do segmento em estudo que não está pavimentado.' },\n    { n: '5.3', text: 'Para a projeção do tráfego futuro as taxas de crescimento adotadas foram de 1,62 para veículos leves e 1,61 para veículos pesados. Os valores foram embasados nas taxas de crescimento da população e da motorização das áreas de influência diretas e indiretas ao segmento.' },\n    { n: '5.4', text: 'O VMD total encontrado no Posto P2 foi de 270 veículos, valor baixo mas compatível com a situação não pavimentada do trecho. Para o cálculo do tráfego desviado, após a elaboração das matrizes de origem/destino expandidas e utilização de softwares específicos chegou-se a 632 veículos, sendo 243 de passeio e utilitários e 389 de carga. Em que pese estes valores estejam fundamentados nas pesquisas O/D solicita-se verificar se não faz mais sentido uma maior proporção de veículos de passeio dentro deste total. Solicita-se especial atenção aos veículos dos tipos 3S3, Bitrem e Rodotrem que tiveram a maior proporção entre o volume de veículos desviados e são os que mais vão impactar no dimensionamento da estrutura do pavimento. Pede-se considerar também um volume de motos e ônibus no total de veículos desviados.' },\n    { n: '5.5', text: 'Com relação ao tráfego gerado considerou-se o valor de 40% sobre o volume do tráfego contado e desviado. Por tratar-se de um valor de difícil mensuração pede-se uma nova análise deste valor e solicita-se também que na projeção do tráfego futuro este valor não entre no início, ano de abertura do tráfego, mas sim do meio para o final do período de projeto.' },\n    { n: '5.6', text: 'Foi adotado o ano de abertura do tráfego como sendo 2026 e o ano de vida útil de projeto como sendo 2035. Solicita-se adotar para o ano de abertura 2028, tempo mais adequado para aprovação do projeto, licitação e execução das obras. Solicita-se estender a projeção do número N para o período de 20 anos, pois o edital informa que para o dimensionamento das soluções de pavimento deve ser considerado o período de projeto de 10, 15 e 20 anos.' },\n    { n: '5.7', text: 'Apresentar tabela com o número de repetições por tipo de eixo, por intervalo de carga, para o caso de dimensionamento de pavimento rígido. Deve ser utilizada a metodologia AASHTO E USACE.' },\n    { n: '5.8', text: 'Deve ser apresentada a Declaração de Responsabilidade Técnica pelo Estudo de Tráfego, conforme Figura A.4 do normativo DNIT/IPR-739/2010.' },\n    { n: '5.9', text: 'Deve ser apresentada a Anotação de Responsabilidade Técnica – ART do profissional responsável pelo projeto, com comprovante de pagamento, conforme o item 1.1.4 da Instrução de Serviço DG/DNIT nº 15/2006.' },\n    { n: '5.10', text: 'Não foi analisado neste momento o Ítem 4.13 do material entregue - Capacidade e Níveis de Serviço. Este tópico será analisado após a aprovação do cálculo dos volumes de tráfego.' },\n  ];\n\n  buildTrafegoAnalises() {\n    return [{\n      numero: 1,\n      codigo: 'Não informado', orgao: 'DNIT', veredito: null, comparativo: null,\n      enviado: 'Não informado', recebido: 'Não informado', concluido: 'Não informado', analista: 'Não informado',\n      items: this.trafegoAnalise1Items,\n    }];\n  }\n\n  buildTracadoAnalises() {\n    return [{\n      numero: 1,\n      codigo: '75-B.4-2024-SEPLAN/COENGE/DNIT',\n      orgao: 'DNIT',\n      veredito: 'Está em condições de aceitação',\n      comparativo: null,\n      enviado: 'Não informado', recebido: 'Não informado', concluido: '30/12/2024',\n      analista: 'Márcia Regina de Amorim (SEPLAN/SREMG/DNIT)',\n      items: this.tracadoAnalise1Items,\n    }];\n  }\n\n  // Dashboard genérico por disciplina — replica o padrão (KPIs + gráfico + comparativo) já usado nas outras\n  // disciplinas com dados reais; Comparativo Sequencial/Itens Repetidos só aparecem a partir de 2/3 análises.\n  buildDashboardFor(analises) {\n    const totalAnalises = analises.length;\n    const totalQuestionamentos = analises.reduce((s, a) => s + a.items.length, 0);\n    const media = totalAnalises ? Math.round(totalQuestionamentos / totalAnalises) : 0;\n    const maxTotal = Math.max(1, ...analises.map(a => a.items.length));\n    const chart = analises.map(a => ({ numero: a.numero, total: a.items.length, hPct: Math.round((a.items.length / maxTotal) * 100) }));\n    const comparativos = [];\n    for (let i = 1; i < analises.length; i++) comparativos.push({ numero: analises[i].numero, anterior: analises[i - 1].numero });\n    return {\n      totalAnalises, totalQuestionamentos, media,\n      ultimaAnalise: analises.length ? 'Análise ' + analises[analises.length - 1].numero : '—',\n      chart, comparativos, showItensRepetidosEmpty: analises.length < 3,\n    };\n  }\n\n  toggleCard(key) {\n    this.setState(s => ({ expanded: { ...s.expanded, [key]: !s.expanded[key] } }));\n  }\n\n  setActive(key) { this.setState({ active: key }); }\n\n  buildRelatorioShellHtml(title, bodyHtml) {\n    return '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>' + title + '<\u002Ftitle><style>'\n      + '@page{size:210mm 297mm;margin-top:3cm;margin-left:3cm;margin-right:2cm;margin-bottom:2cm;}'\n      + 'body{font-family:Arial,sans-serif;font-size:11pt;color:#000;}'\n      + 'h1,h2{color:#1f3a5f;} p{text-align:justify;}'\n      + '<\u002Fstyle><\u002Fhead><body>' + bodyHtml + '<\u002Fbody><\u002Fhtml>';\n  }\n\n  openRelatorioWindow(html) {\n    const w = window.open('', '_blank');\n    if (!w) return;\n    w.document.write(html);\n    w.document.close();\n    setTimeout(() => w.print(), 300);\n  }\n\n  generateRelatorioDisciplina(label) {\n    const body = '<h1>Relatório - ' + label + '<\u002Fh1>'\n      + '<p>Projeto: Gurinhatã · Rodovia: BR-364/MG<\u002Fp>'\n      + '<p>Nenhuma análise cadastrada ainda para esta disciplina.<\u002Fp>';\n    this.openRelatorioWindow(this.buildRelatorioShellHtml('Relatório - ' + label, body));\n  }\n\n  onMedicaoPasswordChange(e) { this.setState({ medicaoPasswordDraft: e.target.value }); }\n\n  toggleMedicaoPasswordVisible() {\n    this.setState({ medicaoPasswordVisible: !this.state.medicaoPasswordVisible });\n  }\n  submitMedicaoPassword() {\n    if (this.state.medicaoPasswordDraft === this.medicaoSenha) this.setState({ medicaoUnlocked: true, medicaoPasswordError: false });\n    else this.setState({ medicaoPasswordError: true });\n  }\n  onTerceirosPasswordChange(e) { this.setState({ terceirosPasswordDraft: e.target.value }); }\n\n  toggleTerceirosPasswordVisible() {\n    this.setState({ terceirosPasswordVisible: !this.state.terceirosPasswordVisible });\n  }\n  submitTerceirosPassword() {\n    if (this.state.terceirosPasswordDraft === this.medicaoSenha) this.setState({ terceirosUnlocked: true, terceirosPasswordError: false });\n    else this.setState({ terceirosPasswordError: true });\n  }\n  onReuniaoPasswordChange(e) { this.setState({ reuniaoPasswordDraft: e.target.value }); }\n\n  toggleReuniaoPasswordVisible() {\n    this.setState({ reuniaoPasswordVisible: !this.state.reuniaoPasswordVisible });\n  }\n  submitReuniaoPassword() {\n    if (this.state.reuniaoPasswordDraft === this.medicaoSenha) this.setState({ reuniaoUnlocked: true, reuniaoPasswordError: false });\n    else this.setState({ reuniaoPasswordError: true });\n  }\n\n  renderVals() {\n    const primaryColor = this.props.primaryColor ?? '#1f3a5f';\n    const active = this.state.active;\n    const navDefs = [\n      { key: 'home', code: 'VG', label: 'Visão Geral' },\n      { key: 'analise', code: 'AN', label: 'Análise' },\n      { key: 'linha-tempo', code: 'LT', label: 'Linha do Tempo' },\n      { key: 'correspondencias', code: 'CC', label: 'Correspondências/\\nComunicações' },\n      { key: 'consultas', code: 'CO', label: 'Consultas' },\n      { key: 'medicao', code: 'ME', label: 'Medição' },\n      { key: 'controle-terceiros', code: 'CT', label: 'Controle de\\nTerceiros' },\n      { key: 'reuniao-externa', code: 'RE', label: 'Reunião Externa' },\n    ];\n\n    return {\n      primaryColor,\n      onVoltarProjetos: this.props.onVoltarProjetos ?? null,\n      navItems: navDefs.map(n => ({\n        key: n.key, code: n.code, label: n.label,\n        bg: active === n.key ? '#2f6690' : 'transparent',\n        iconBg: active === n.key ? '#4f8fc0' : 'rgba(255,255,255,0.12)',\n        select: () => this.setActive(n.key),\n      })),\n      isHome: active === 'home',\n      isAnalise: active === 'analise',\n      isLinhaTempo: active === 'linha-tempo',\n      isCorrespondencias: active === 'correspondencias',\n      isConsultas: active === 'consultas',\n      isMedicao: active === 'medicao',\n      isControleTerceiros: active === 'controle-terceiros',\n      isReuniaoExterna: active === 'reuniao-externa',\n\n      disciplinas: this.materiaMeta.map(m => {\n        const analises = m.key === 'tracado' ? this.buildTracadoAnalises() : m.key === 'trafego' ? this.buildTrafegoAnalises() : m.key === 'geologico' ? this.buildGeologicoAnalises() : [];\n        return {\n          key: m.key, code: m.code, label: m.label,\n          iconBg: primaryColor,\n          toggle: () => this.toggleCard('disc-' + m.key),\n          isOpen: !!this.state.expanded['disc-' + m.key],\n          chevron: this.state.expanded['disc-' + m.key] ? '▲' : '▼',\n          gerarRelatorio: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.generateRelatorioDisciplina(m.label.replace('\\n', ' ')); },\n          noAnalises: analises.length === 0,\n          analise: analises.length ? analises[0] : null,\n          dashboard: analises.length ? this.buildDashboardFor(analises) : null,\n        };\n      }),\n\n      homeStats: { extensao: '12,20', materias: this.materiaMeta.length, modelos: this.materiaMeta.filter(m => m.hasDados).length, fase: 'Projeto Básico' },\n      materiaCards: this.materiaMeta.map(m => ({\n        key: m.key, code: m.code, label: m.label, desc: m.desc,\n        iconBg: m.hasDados ? '#2f6690' : '#b7c0ca',\n        status: m.hasDados ? 'Dados cadastrados' : 'Aguardando dados',\n        statusColor: m.hasDados ? '#2f8f4f' : '#8a94a3',\n        select: () => this.setState(s => ({ active: 'analise', expanded: { ...s.expanded, ['disc-' + m.key]: true } })),\n      })),\n      timelinePhases: this.materiaMeta.map((m, i) => ({\n        code: m.code, title: m.label.replace('\\n', ' '),\n        color: m.hasDados ? '#2f6690' : '#b7c0ca',\n        left: i * (100 / this.materiaMeta.length),\n        width: 100 / this.materiaMeta.length - 1.5,\n      })),\n      todayLeft: 3.5,\n\n      medicaoLocked: !this.state.medicaoUnlocked,\n      medicaoUnlocked: this.state.medicaoUnlocked,\n      medicaoPasswordDraft: this.state.medicaoPasswordDraft,\n      medicaoPasswordError: this.state.medicaoPasswordError,\n      onMedicaoPasswordChange: (e) => this.onMedicaoPasswordChange(e),\n      medicaoPasswordVisible: this.state.medicaoPasswordVisible,\n      medicaoPasswordHidden: !this.state.medicaoPasswordVisible,\n      medicaoPasswordInputType: this.state.medicaoPasswordVisible ? 'text' : 'password',\n      toggleMedicaoPasswordVisible: () => this.toggleMedicaoPasswordVisible(),\n      onMedicaoPasswordSubmit: () => this.submitMedicaoPassword(),\n\n      terceirosLocked: !this.state.terceirosUnlocked,\n      terceirosUnlocked: this.state.terceirosUnlocked,\n      terceirosPasswordDraft: this.state.terceirosPasswordDraft,\n      terceirosPasswordError: this.state.terceirosPasswordError,\n      onTerceirosPasswordChange: (e) => this.onTerceirosPasswordChange(e),\n      terceirosPasswordVisible: this.state.terceirosPasswordVisible,\n      terceirosPasswordHidden: !this.state.terceirosPasswordVisible,\n      terceirosPasswordInputType: this.state.terceirosPasswordVisible ? 'text' : 'password',\n      toggleTerceirosPasswordVisible: () => this.toggleTerceirosPasswordVisible(),\n      onTerceirosPasswordSubmit: () => this.submitTerceirosPassword(),\n\n      reuniaoLocked: !this.state.reuniaoUnlocked,\n      reuniaoUnlocked: this.state.reuniaoUnlocked,\n      reuniaoPasswordDraft: this.state.reuniaoPasswordDraft,\n      reuniaoPasswordError: this.state.reuniaoPasswordError,\n      onReuniaoPasswordChange: (e) => this.onReuniaoPasswordChange(e),\n      reuniaoPasswordVisible: this.state.reuniaoPasswordVisible,\n      reuniaoPasswordHidden: !this.state.reuniaoPasswordVisible,\n      reuniaoPasswordInputType: this.state.reuniaoPasswordVisible ? 'text' : 'password',\n      toggleReuniaoPasswordVisible: () => this.toggleReuniaoPasswordVisible(),\n      onReuniaoPasswordSubmit: () => this.submitReuniaoPassword(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
