  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tyle=\"font-size:13px;color:#5b6774;margin-bottom:12px;\">Contrato Nº CRLSA 021/2026.GOP · Concessionária Rota da Liberdade · Duplicação rodoviária BR-356/MG-262 (Lote 07 do PER)<\u002Fdiv>\n          <p style=\"margin:0;max-width:820px;font-size:14px;color:#5b6774;line-height:1.7;text-align:justify;\">Termo de Referência para contratação de serviços técnicos de engenharia para elaboração do Projeto Executivo de duplicação da BR-356 (km 29,10 ao km 43,80) e implantação da 3ª faixa na MG-262, além de intervenções pontuais previstas para os Anos 1, 2 e 3 da concessão. O sistema rodoviário da concessão (BR-356/MG-262/MG-329) totaliza aproximadamente 187 km, atravessando 11 municípios de Minas Gerais.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:30px;\">\n          <sc-for list=\"{{ trKpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ k.onClick }}\" style=\"background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88px;box-sizing:border-box;cursor:{{ k.clickable ? 'pointer' : 'default' }};\">\n              <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;line-height:1.3;\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:700;color:#1f3a5f;\">{{ k.value }}<\u002Fdiv>\n              <sc-if value=\"{{ k.hasSub }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:11.5px;color:#5b6774;margin-top:2px;\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:15px;font-weight:700;color:#1f3a5f;margin-bottom:14px;\">Trechos do Projeto<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16p ;\">\n              <div style=\"font-size:11px;font-weight:700;color:#2f6690;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;\">{{ d.codigo }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;font-weight:700;color:#1f2933;margin-bottom:6px;\">{{ d.nome }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#5b6774;line-height:1.5;\">{{ d.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div sc-camel-on-click=\"{{ toggleIntervencoes }}\" style=\"display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:16px 20px;cursor:pointer;margin-bottom:14px;\">\n          <div style=\"display:flex;align-items:center;gap:12px;\">\n            <div style=\"font-size:15px;font-weight:700;color:#1f3a5f;\">Intervenções Pontuais (Tabela 3 do TR)<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a94a3;\">{{ trIntervencoes.length }} intervenções cadastradas<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:18px;color:#8a94a3;\">{{ intervencoesChevron }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ intervencoesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-if value=\"{{ hasFiltroAtivo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;\">\n            <div style=\"font-size:12px;color:#2f6690;background:#eaf1f8;border:1px solid #cfe0ee;border-radius:20px;padding:5px 12px;\">{{ filtroAtivoLabel }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ limparFiltro }}\" style=\"font-size:12px;color:#8a94a3;cursor:pointer;text-decoration:underline;\">ver todas<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"width:100%;box-sizing:border-box;background:#fff;border:1px solid #dde3ea;border-radius:10px;overflow-x:auto;margin-bottom:30px;\">\n          <sc-raw-table style=\"width:100 dding:8px 12px;border-bottom:1px solid #eef1f4;height:32px;color:#5b6774;\">{{ isv.rodovia }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #eef1f4;height:32px;color:#5b6774;\">{{ isv.kmIni }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #eef1f4;height:32px;color:#5b6774;\">{{ isv.kmFim }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #eef1f4;height:32px;color:#5b6774;\">{{ isv.ext }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #eef1f4;height:32px;color:#5b6774;\">{{ isv.lado }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #eef1f4;height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#5b6774;\" title=\"{{ isv.obs }}\">{{ isv.obs }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:5px 12px;border-bottom:1px solid #eef1f4;height:32px;\">\n                  <sc-if value=\"{{ podeEditarStatus }}\" hint-placeholder-val=\"{{ true }}\">\n                    <sc-raw-select value=\"{{ isv.status }}\" sc-camel-on-change=\"{{ isv.setStatus }}\" style=\"font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:6px;border:1px solid transparent;background:{{ isv.statusBg }};color:{{ isv.statusColor }};cursor:pointer;width:100%;\"><option value=\"Não iniciado\">Não iniciado<\u002Foption><option value=\"Em estudo\">Em estudo<\u002Foption><option value=\"Desenvolvendo\">Desenvolvendo<\u002Foption><option value=\"Concluído\">Concluído<\u002Foption><\u002Fsc-raw-select>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ naoPodeEditarStatus }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:6px;background:{{ isv.statusBg }};color:{{ isv.statusColor }};width:100%;box-sizing:border-box;text-align:center; px;font-weight:600;color:#8a94a3;\">Nenhum item de terceiros cadastrado ainda para este projeto.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== REUNIÃO EXTERNA ===================== -->\n    <sc-if value=\"{{ isReuniaoExterna }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Reunião Externa\">\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Reunião Externa<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:28px;color:#1f3a5f;font-weight:700;\">Reunião Externa<\u002Fh1>\n        <\u002Fdiv>\n        <sc-if value=\"{{ reuniaoLocked }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:360px;background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:24px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#1f2933;margin-bottom:10px;\">Área restrita<\u002Fdiv>\n            <div style=\"position:relative;\">\n              <input type=\"{{ reuniaoPasswordInputType }}\" value=\"{{ reuniaoPasswordDraft }}\" sc-camel-on-change=\"{{ onReuniaoPasswordChange }}\" placeholder=\"Senha\" style=\"width:100%;box-sizing:border-box;font-size:13px;padding:9px 12px;border:1px solid #dde3ea;border-radius:8px;margin-bottom:10px;\">\n              <sc-if value=\"{{ reuniaoPasswordVisible }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ toggleReuniaoPasswordVisible }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#8a94a3;display:flex;\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A der:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n            <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhuma análise cadastrada ainda para este projeto.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;primaryColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f3a5f&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  PROJETO = 'rota-liberdade';\n  medicaoSenha = 'consol2026';\n\n  db() {\n    return firebase.firestore();\n  }\n\n  // Garante que o Firebase está pronto e inicializado antes de qualquer uso do Firestore.\n  // Esse componente é carregado dentro do SIP.dc.html (via dc-import), e não dá pra confiar\n  // que o \"pai\" já terminou de inicializar o Firebase no momento em que este componente monta\n  // — por isso essa checagem própria, no mesmo padrão já usado e comprovado no NovaMedicao.dc.html.\n  waitForFirebase(attempt) {\n    return new Promise((resolve) => {\n      const tenta = (n) => {\n        if (window.firebase && firebase.firestore) {\n          if (!firebase.apps || !firebase.apps.length) {\n            firebase.initializeApp({\n              apiKey: \"AIzaSyDNBXkzFJFAsOKefmBesSWmwRHgS0i7ACA\",\n              authDomain: \"sip-sistema-intelig-de-projeto.firebaseapp.com\",\n              projectId: \"sip-sistema-intelig-de-projeto\",\n              storageBucket: \"sip-sistema-intelig-de-projeto.firebasestorage.app\",\n              messagingSenderId: \"957059964424\",\n              appId: \"1:957059964424:web:30ba5c315b713c2c05bbbd\"\n            });\n          }\n          resolve(true);\n          return;\n        }\n        if (n > 100) { resolve(false); return; }\n        setTimeout(() => tenta(n + 1), 100);\n      };\n      tenta(attempt || 0);\n    });\n  }\n\n  async componentDidMount() {\n    // Carrega o status de cada intervenção salvo no Firestore, pra ficar igual em qualquer\n    // sessão (CONSOL ou Cliente, qualquer navegador/dispositivo) — antes, o status só existia\n    // na memória temporária da própria sessão, por isso não sincronizava de verdade.\n    try {\n      const pronto = await this.waitForFirebase();\n      if (!pronto) return;\n      const snap = await this.db().collection('intervencaoStatus').where('projeto', '==', this.PROJETO).get();\n      const mapa = {};\n      snap.forEach(doc => { mapa[doc.id] = doc.data().status; });\n      if (Object.keys(mapa).length) {\n        this.setState(s => ({ statusMap: { ...s.statusMap, ...mapa } }));\n      }\n    } catch (e) {\n      console.error('Falha ao carregar status das intervenções:', e);\n    }\n  }\n\n  state = {\n    active: 'home',\n    expanded: {},\n    intervencoesOpen: false,\n    kpiFiltro: null,\n    statusMap: {},\n    medicaoPasswordDraft: '', medicaoPasswordError: false, medicaoUnlocked: false,\n    terceirosPasswordDraft: '', terceirosPasswordError: false, terceirosUnlocked: false,\n    reuniaoPasswordDraft: '', reuniaoPasswordError: false, reuniaoUnlocked: false,\n  };\n\n  // Mesma ordem/estrutura de disciplinas usada nos demais projetos (padrão replicado). Nenhuma tem dados ainda.\n  materiaMeta = [\n    { key: 'tracado', code: 'ET', label: 'Estudo de\\nTraçado', desc: 'Estudo das alternativas de traçado e escolha da concepção geométrica preliminar.' },\n    { key: 'trafego', code: 'TR', label: 'Estudo de\\nTráfego', desc: 'Levantamento e projeção de volumes de tráfego (VMD, classificação veicular).' },\n    { key: 'geologico', code: 'GL', label: 'Estudo\\nGeológico', desc: 'Caracterização geológica do trecho e das áreas de interesse.' },\n    { key: 'geot-pav', code: 'GP', label: 'Estudo Geotécnico Pavimentação\\ne Proj. Pavimentação', desc: 'Sondagens e dimensionamento da estrutura do  toggleCard(key) {\n    this.setState(s => ({ expanded: { ...s.expanded, [key]: !s.expanded[key] } }));\n  }\n\n  setActive(key) { this.setState({ active: key }); }\n\n  buildRelatorioShellHtml(title, bodyHtml) {\n    return '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>' + title + '<\u002Ftitle><style>'\n      + '@page{size:210mm 297mm;margin-top:3cm;margin-left:3cm;margin-right:2cm;margin-bottom:2cm;}'\n      + 'body{font-family:Arial,sans-serif;font-size:11pt;color:#000;}'\n      + 'h1,h2{color:#1f3a5f;} p{text-align:justify;}'\n      + '<\u002Fstyle><\u002Fhead><body>' + bodyHtml + '<\u002Fbody><\u002Fhtml>';\n  }\n\n  openRelatorioWindow(html) {\n    const w = window.open('', '_blank');\n    if (!w) return;\n    w.document.write(html);\n    w.document.close();\n    setTimeout(() => w.print(), 300);\n  }\n\n  generateRelatorioDisciplina(label) {\n    const body = '<h1>Relatório - ' + label + '<\u002Fh1>'\n      + '<p>Projeto: Rota da Liberdade · Rodovias: BR-356/BR-262<\u002Fp>'\n      + '<p>Nenhuma análise cadastrada ainda para esta disciplina.<\u002Fp>';\n    this.openRelatorioWindow(this.buildRelatorioShellHtml('Relatório - ' + label, body));\n  }\n\n  onMedicaoPasswordChange(e) { this.setState({ medicaoPasswordDraft: e.target.value }); }\n\n  toggleMedicaoPasswordVisible() {\n    this.setState({ medicaoPasswordVisible: !this.state.medicaoPasswordVisible });\n  }\n  submitMedicaoPassword() {\n    if (this.state.medicaoPasswordDraft === this.medicaoSenha) this.setState({ medicaoUnlocked: true, medicaoPasswordError: false });\n    else this.setState({ medicaoPasswordError: true });\n  }\n  onTerceirosPasswordChange(e) { this.setState({ terceirosPasswordDraft: e.target.value }); }\n\n  toggleTerceirosPasswordVisible() {\n    this.setState({ terceirosPasswordVisible: !this.state.terceirosPasswordVisible });\n  }\n  submitTerceirosPassword() {\n    if (this.state.terceirosPasswordDraft === this.medicaoSenha) this.setState({ terceirosUnlocked: true, terceirosPasswordError: false });\n    else this.setState({ terceirosPasswordError: true });\n  }\n  onReuniaoPasswordChange(e) { this.setState({ reuniaoPasswordDraft: e.target.value }); }\n\n  toggleReuniaoPasswordVisible() {\n    this.setState({ reuniaoPasswordVisible: !this.state.reuniaoPasswordVisible });\n  }\n  submitReuniaoPassword() {\n    if (this.state.reuniaoPasswordDraft === this.medicaoSenha) this.setState({ reuniaoUnlocked: true, reuniaoPasswordError: false });\n    else this.setState({ reuniaoPasswordError: true });\n  }\n\n  renderVals() {\n    const primaryColor = this.props.primaryColor ?? '#1f3a5f';\n    const active = this.state.active;\n    this.trIntervencoesComStatus = this.withStatus(this.trIntervencoes, 'trinterv');\n    // Status das intervenções: editável só pra CONSOL. Cliente vê o mesmo dado (sempre\n    // sincronizado, é a mesma fonte), só que como etiqueta fixa, sem poder alterar.\n    const podeEditarStatus = !this.props.isClienteMode;\n    const naoPodeEditarStatus = !!this.props.isClienteMode;\n    const navDefs = [\n      { key: 'home', code: 'VG', label: 'Visão Geral' },\n      { key: 'analise', code: 'AN', label: 'Análise' },\n      { key: 'linha-tempo', code: 'LT', label: 'Linha do Tempo' },\n      { key: 'correspondencias', code: 'CC', label: 'Correspondências/\\nComunicações' },\n      { key: 'consultas', code: 'CO', label: 'Consultas' },\n      { key: 'medicao', code: 'ME', label: 'Medição' },\n      { key: 'controle-terceiros', code: 'CT', label: 'Controle de\\nTerceiros' },\n      { key: 'reuniao-externa', code: 'RE', label: 'Reunião Externa' },\n    ];\n\n    // Mesmo padrão usado nos projetos DER-MG (Trinta Reis, Araçuaí, Rubim): esconde do modo\n    // cliente as abas internas/operacionais. Estrutura pronta mesmo sem cliente ativo ainda\n    // usando este projeto (só o DER-MG tem acesso cliente ligado de verdade hoje).\n    // Análise e Medição ainda não têm dado nenhum lançado pra este projeto (é novo) — escondidas\n    // do cliente por enquanto. Quando essas áreas forem alimentadas, é só tirar 'analise' e\n    // 'medicao' desta lista pra elas passarem a aparecer, igual já acontece no DER-MG.\n    const ABAS_ESCONDIDAS_CLIENTE = ['correspondencias', 'consultas', 'controle-terceiros', 'reuniao-externa', 'linha-tempo', 'analise', 'medicao'];\n    const navDefsFiltrados = this.props.isClienteMode\n      ? navDefs.filter(n => !ABAS_ESCONDIDAS_CLIENTE.includes(n.key))\n      : navDefs;\n\n    return {\n      primaryColor,\n      onVoltarProjetos: this.props.onVoltarProjetos ?? null,\n      navItems: navDefsFiltrados.map(n => ({\n        key: n.key, code: n.code, label: n.label,\n        bg: active === n.key ? '#2f6690' : 'transparent',\n        iconBg: active === n.key ? '#4f8fc0' : 'rgba(255,255,255,0.12)',\n        select: () => this.setActive(n.key),\n      })),\n      isHome: active === 'home',\n      isAnalise: active === 'analise',\n      isLinhaTempo: active === 'linha-tempo',\n      isCorrespondencias: active === 'correspondencias',\n      isConsultas: active === 'consultas',\n      isMedicao: active === 'medicao',\n      isControleTerceiros: active === 'controle-terceiros',\n      isReuniaoExterna: active === 'reuniao-externa',\n\n      trKpis: (() => {\n        const curvas = this.trIntervencoes.filter(i => i.tipo === 'Adequação de curva crítica');\n        const somaExtCurvas = curvas.reduce((s, c) => s + parseFloat((c.ext || '0 km').replace(' km', '').replace(',', '.')), 0);\n        const oae = this.trIntervencoes.filter(i => i.tipo.includes('OAE'));\n        return [\n          { label: 'Duplicação BR-356', value: '14,70 km' },\n          { label: '3ª Faixa MG-262', value: '6,69 km' },\n          { label: 'Intervenções Pontuais', value: String(this.trIntervencoes.length) },\n          { label: 'Curvas Críticas', value: `${curvas.length} curvas`, sub: `${somaExtCurvas.toFixed(2).replace('.', ',')} km`, hasSub: true, clickable: false },\n          { label: 'OAE', value: `${oae.length} OAE`, sub: 'com intervenção', hasSub: true, clickable: true,\n            onClick: () => this.setState(s => ({ intervencoesOpen: true, kpiFiltro: s.kpiFiltro === 'oae' ? null : 'oae' })) },\n        ];\n      })(),\n      intervencoesOpen: this.state.intervencoesOpen,\n      toggleIntervencoes: () => this.setState(s => ({ intervencoesOpen: !s.intervencoesOpen })),\n      intervencoesChevron: this.state.intervencoesOpen ? '▲' : '▼',\n      trTrechosFaixa: this.trTrechosFaixa,\n      trDisciplinas: this.trDisciplinas,\n      podeEditarStatus, naoPodeEditarStatus,\n      trIntervencoes: this.state.kpiFiltro === 'oae' ? this.trIntervencoesComStatus.filter(i => i.tipo.includes('OAE')) : this.trIntervencoesComStatus,\n      trCategoriasBR356: this.categoriasPorRodovia(this.trIntervencoesComStatus, 'BR-356', 'Ouro Preto/Mariana (Lote 07, conforme TR)'),\n      trCategoriasMG262: this.categoriasPorRodovia(this.trIntervencoesComStatus, 'MG-262', 'Mariana'),\n      hasFiltroAtivo: this.state.kpiFiltro === 'oae',\n      filtroAtivoLabel: this.state.kpiFiltro === 'oae' ? `Mostrando apenas OAE (${this.trIntervencoes.filter(i => i.tipo.includes('OAE')).length})` : '',\n      limparFiltro: () => this.setState({ kpiFiltro: null }),\n\n\n      obrasDestaqueBR356: this.buildObrasDestaqueBR356(),\n      linBR356PrincipalTl: this.buildLinTimeline(this.linBR356Principal),\n      linBR356Principal: this.withStatus(this.linRowsWithColor(this.linBR356Principal), 'br356-principal'),\n      linBR356IntersecoesTl: this.buildLinTimeline(this.linBR356Intersecoes),\n      linBR356Intersecoes: this.withStatus(this.linBR356Intersecoes, 'br356-intersecoes'),\n      linBR356PassarelasTl: this.buildLinTimeline(this.linBR356Passarelas),\n      linBR356Passarelas: this.withStatus(this.linBR356Passarelas, 'br356-passarelas'),\n      linBR356OnibusTl: this.buildLinTimeline(this.linBR356Onibus),\n      linBR356Onibus: this.withStatus(this.linRowsWithColor(this.linBR356Onibus), 'br356-onibus'),\n      linMG262Acostamentos: this.withStatus(this.linMG262Acostamentos, 'mg262-acostamentos'),\n      linMG262Intersecoes: this.withStatus(this.linMG262Intersecoes, 'mg262-intersecoes'),\n      linMG262Onibus: this.withStatus(this.linMG262Onibus, 'mg262-onibus'),\n      linMG262Oae: this.withStatus(this.linMG262Oae, 'mg262-oae'),\n      linMG262Acessos: this.withStatus(this.linMG262Acessos, 'mg262-acessos'),\n      linMG262Curvas: this.withStatus(this.linMG262Curvas, 'mg262-curvas'),\n      linMG262Unificado: this.buildLinMG262Unificado(),\n      mg262Legend: Object.keys(this.mg262CatLabel).map(k => ({ cor: this.mg262CatColor[k], label: this.mg262CatLabel[k] })),\n\n      disciplinas: this.materiaMeta.map(m => ({\n        key: m.key, code: m.code, label: m.label,\n        iconBg: primaryColor,\n        toggle: () => this.toggleCard('disc-' + m.key),\n        isOpen: !!this.state.expanded['disc-' + m.key],\n        chevron: this.state.expanded['disc-' + m.key] ? '▲' : '▼',\n        gerarRelatorio: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.generateRelatorioDisciplina(m.label.replace('\\n', ' ')); },\n      })),\n\n      medicaoLocked: !this.state.medicaoUnlocked,\n      medicaoUnlocked: this.state.medicaoUnlocked,\n      medicaoPasswordDraft: this.state.medicaoPasswordDraft,\n      medicaoPasswordError: this.state.medicaoPasswordError,\n      onMedicaoPasswordChange: (e) => this.onMedicaoPasswordChange(e),\n      medicaoPasswordVisible: this.state.medicaoPasswordVisible,\n      medicaoPasswordHidden: !this.state.medicaoPasswordVisible,\n      medicaoPasswordInputType: this.state.medicaoPasswordVisible ? 'text' : 'password',\n      toggleMedicaoPasswordVisible: () => this.toggleMedicaoPasswordVisible(),\n      onMedicaoPasswordSubmit: () => this.submitMedicaoPassword(),\n\n      terceirosLocked: !this.state.terceirosUnlocked,\n      terceirosUnlocked: this.state.terceirosUnlocked,\n      terceirosPasswordDraft: this.state.terceirosPasswordDraft,\n      terceirosPasswordError: this.state.terceirosPasswordError,\n      onTerceirosPasswordChange: (e) => this.onTerceirosPasswordChange(e),\n      terceirosPasswordVisible: this.state.terceirosPasswordVisible,\n      terceirosPasswordHidden: !this.state.terceirosPasswordVisible,\n      terceirosPasswordInputType: this.state.terceirosPasswordVisible ? 'text' : 'password',\n      toggleTerceirosPasswordVisible: () => this.toggleTerceirosPasswordVisible(),\n      onTerceirosPasswordSubmit: () => this.submitTerceirosPassword(),\n\n      reuniaoLocked: !this.state.reuniaoUnlocked,\n      reuniaoUnlocked: this.state.reuniaoUnlocked,\n      reuniaoPasswordDraft: this.state.reuniaoPasswordDraft,\n      reuniaoPasswordError: this.state.reuniaoPasswordError,\n      onReuniaoPasswordChange: (e) => this.onReuniaoPasswordChange(e),\n      reuniaoPasswordVisible: this.state.reuniaoPasswordVisible,\n      reuniaoPasswordHidden: !this.state.reuniaoPasswordVisible,\n      reuniaoPasswordInputType: this.state.reuniaoPasswordVisible ? 'text' : 'password',\n      toggleReuniaoPasswordVisible: () => this.toggleReuniaoPasswordVisible(),\n      onReuniaoPasswordSubmit: () => this.submitReuniaoPassword(),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
