<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { width: 100%; height: 100%; }
  .city-label { font-family: sans-serif; font-size: 13px; font-weight: 700; color: #1f3a5f; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
  .route-label { font-family: sans-serif; font-size: 12px; font-weight: 700; color: #8a5a1a; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var aracuai = [-16.8508, -42.0664];
  var novoCruzeiro = [-17.4667, -41.9333];

  var map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  var bounds = L.latLngBounds([aracuai, novoCruzeiro]);
  map.fitBounds(bounds, { padding: [60, 60] });

  function drawStraightFallback() {
    L.polyline([aracuai, novoCruzeiro], { color: '#e8a33d', weight: 5, opacity: 0.9 }).addTo(map);
  }

  fetch('https://router.project-osrm.org/route/v1/driving/' + aracuai[1] + ',' + aracuai[0] + ';' + novoCruzeiro[1] + ',' + novoCruzeiro[0] + '?overview=full&geometries=geojson')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.routes && data.routes[0]) {
        var coords = data.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
        var line = L.polyline(coords, { color: '#e8a33d', weight: 5, opacity: 0.9 }).addTo(map);
        map.fitBounds(line.getBounds(), { padding: [60, 60] });
      } else {
        drawStraightFallback();
      }
    })
    .catch(function (e) {
      console.error('Falha na rota OSRM', e);
      drawStraightFallback();
    });

  function cityMarker(latlng, name, offsetClass) {
    L.circleMarker(latlng, { radius: 7, color: '#fff', weight: 2, fillColor: '#1f3a5f', fillOpacity: 1 }).addTo(map);
    L.marker(latlng, {
      icon: L.divIcon({ className: '', html: '<div class="city-label" style="transform:translate(' + offsetClass + ');">' + name + '</div>', iconSize: [0, 0] })
    }).addTo(map);
  }
  cityMarker(aracuai, 'Araçuaí', '-100%,-140%');
  cityMarker(novoCruzeiro, 'Novo Cruzeiro', '10px,-40%');

  var mid = [(aracuai[0] + novoCruzeiro[0]) / 2, (aracuai[1] + novoCruzeiro[1]) / 2];
  L.marker(mid, {
    icon: L.divIcon({ className: '', html: '<div class="route-label">LMG-678</div>', iconSize: [0, 0] })
  }).addTo(map);
</script>
</body>
</html>
