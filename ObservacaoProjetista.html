  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"cc69a026-a007-4960-8771-ec7b7792b257\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <style>\n    body{margin:0;font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}\n    a{color:#2f6690;}\n    a:hover{color:#1f3a5f;}\n  <\u002Fstyle>\n  \n  <script src=\"f15d7d11-14cc-4914-bae6-7a77f447587e\"><\u002Fscript>\n  <script src=\"c139734a-dd44-485d-b0a9-4377be844262\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#eef1f4;padding:40px 20px;box-sizing:border-box;\">\n  <div style=\"max-width:720px;margin:0 auto;\">\n    <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;color:#2f6690;text-transform:uppercase;margin-bottom:6px;\">Rodovia MG-259 — Serro / Trinta Reis<\u002Fdiv>\n    <h1 style=\"margin:0 0 6px;font-size:26px;color:#1f3a5f;font-weight:700;\">Observações do Projetista<\u002Fh1>\n\n    <sc-if value=\"{{ isMenu }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"margin:0 0 24px;font-size:13.5px;color:#5b6774;line-height:1.6;\">Selecione sua disciplina.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <sc-for list=\"{{ discButtons }}\" as=\"db\" hint-placeholder-count=\"7\">\n          <div sc-camel-on-click=\"{{ db.select }}\" style=\"background:#fff;border:1px solid #eef1f4;border-radius:10px;padding:16px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;\">\n            <div style=\"font-size:14.5px;font-weight:700;color:#1f2933;\">{{ db.label }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a94a3;\">Acessar →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPassword }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0 0 24px;font-size:13.5px;color:#5b6774;line-height:1.6;\">Digite a senha da disciplina <strong>{{ selectedLabel }}<\u002Fstrong> para acessar.<\u002Fp>\n      <div style=\"background:#fff;border:1px solid #eef1f4;border-radius:10px;padding:24px;max-width:360px;\">\n        <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:6px;\">Senha<\u002Fdiv>\n        <input type=\"password\" value=\"{{ passwordDraft }}\" sc-camel-on-change=\"{{ onPasswordChange }}\" sc-camel-on-key-down=\"{{ onPasswordKeyDown }}\" placeholder=\"Senha da disciplina\" style=\"width:100%;font-size:13px;font-family:inherit;color:#1f2933;border:1px solid #dde3ea;border-radius:6px;padding:9px 10px;box-sizing:border-box;margin-bottom:10px;\">\n        <sc-if value=\"{{ showPasswordError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:11.5px;color:#c0392b;margin-bottom:10px;\">Senha incorreta.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:10px;\">\n          <div sc-camel-on-click=\"{{ onPasswordSubmit }}\" style=\"font-size:12.5px;font-weight:700;color:#fff;background:#1f3a5f;padding:9px 18px;border-radius:8px;cursor:pointer;width:fit-content;\">Entrar<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ backToMenu }}\" style=\"font-size:12.5px;font-weight:600;color:#5b6774;padding:9px 14px;border-radius:8px;cursor:pointer;width:fit-content;\">Voltar<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;\">\n        <div style=\"font-size:15px;font-weight:700;color:#2f6690;\">{{ discLabel }}<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ backToMenu }}\" style=\"font-size:12px;font-weight:600;color:#5b6774;cursor:pointer;\">← Trocar disciplina<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 24px;font-size:13.5px;color:#5b6774;line-height:1.6;\">Preencha a justificativa apenas das etapas marcadas como <strong style=\"color:#c0392b;\">Atrasado<\u002Fstrong>. Seu nome e a data ficam registrados automaticamente.<\u002Fp>\n\n      <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:24px;background:#fff;border:1px solid #eef1f4;border-radius:10px;text-align:center;font-size:12.5px;color:#8a94a3;\">Carregando…<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:24px;background:#fdecea;border:1px solid #f4c7c3;border-radius:10px;text-align:center;font-size:12.5px;color:#c0392b;\">{{ errorMsg }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ noItems }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:40px;background:#f8f9fb;border:1.5px dashed #c9d2db;border-radius:10px;text-align:center;\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#8a94a3;\">Nenhuma pendência cadastrada ainda para esta disciplina.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasItems }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <sc-for list=\"{{ items }}\" as=\"it\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #eef1f4;border-radius:10px;padding:18px 20px;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;\">\n                <div style=\"font-size:14.5px;font-weight:700;color:#1f2933;\">Análise {{ it.numero }} — Resposta do Responsável<\u002Fdiv>\n                <div style=\"font-size:11.5px;font-weight:700;color:{{ it.statusColor }};\">{{ it.statusLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px;\">\n                <div>\n                  <div style=\"font-size:10px;color:#8a94a3;text-transform:uppercase;margin-bottom:2px;\">Recebido<\u002Fdiv>\n                  <div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ it.recebido }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:10px;color:#8a94a3;text-transform:uppercase;margin-bottom:2px;\">Tempo<\u002Fdiv>\n                  <div style=\"font-size:13px;font-weight:600;color:#1f2933;\">{{ it.tempo }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ it.hasHistorico }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top:1px solid #eef1f4;padding-top:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;\">\n                  <sc-for list=\"{{ it.historico }}\" as=\"ob\" hint-placeholder-count=\"1\">\n                    <div>\n                      <div style=\"font-size:13px;color:#1f2933;line-height:1.5;\">{{ ob.texto }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#8a94a3;\">— {{ ob.autor }}, em {{ ob.data }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ it.showForm }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top:1px solid #eef1f4;padding-top:14px;display:flex;flex-direction:column;gap:10px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;color:#5b6774;\">Nova atualização<\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:4px;\">Nome do Responsável<\u002Fdiv>\n                    <input value=\"{{ it.nomeVal }}\" sc-camel-on-change=\"{{ it.onNomeChange }}\" placeholder=\"Nome do projetista responsável\" style=\"width:100%;font-size:13px;font-family:inherit;color:#1f2933;border:1px solid #dde3ea;border-radius:6px;padding:8px 10px;box-sizing:border-box;\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10.5px;color:#8a94a3;text-transform:uppercase;margin-bottom:4px;\">Motivo do atraso<\u002Fdiv>\n                    <textarea value=\"{{ it.textoVal }}\" sc-camel-on-change=\"{{ it.onTextoChange }}\" placeholder=\"Descreva o motivo do atraso nesta etapa.\" style=\"width:100%;min-height:90px;font-size:13px;font-family:inherit;color:#1f2933;border:1px solid #dde3ea;border-radius:6px;padding:8px 10px;resize:vertical;box-sizing:border-box;\"><\u002Ftextarea>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ it.showFormError }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px;color:#c0392b;\">Preencha nome e motivo antes de salvar.<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div sc-camel-on-click=\"{{ it.save }}\" style=\"font-size:12.5px;font-weight:700;color:#fff;background:#1f3a5f;padding:9px 18px;border-radius:8px;cursor:pointer;width:fit-content;\">Salvar<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ it.proximaEm }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top:1px solid #eef1f4;padding-top:14px;font-size:12px;color:#8a94a3;\">Próxima atualização necessária em: {{ it.proximaEm }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'menu', selectedDisc: null, discKey: null, passwordDraft: '', passwordError: false,\n    loading: true, error: '', saved: {}, drafts: {}, editing: {}, formErrors: {},\n  };\n\n  disciplinaMeta = {\n    geometria: 'Geometria', terraplenagem: 'Terraplenagem', sinalizacao: 'Sinalização',\n    obras: 'Obras Complementares', desapropriacao: 'Desapropriação', intersecao: 'Interseção',\n    seguranca: 'Segurança Viária', pavimentacao: 'Pavimentação', drenagem: 'Drenagem',\n    topografia: 'Topografia', meioambiente: 'Meio Ambiente',\n  };\n\n  // Senha de cada disciplina: nome sem acento/espaço, minúsculo — igual à própria chave.\n  disciplinaSenhas = {\n    geometria: 'geometria', terraplenagem: 'terraplenagem', sinalizacao: 'sinalizacao',\n    obras: 'obras', desapropriacao: 'desapropriacao', intersecao: 'intersecao', seguranca: 'seguranca',\n    pavimentacao: 'pavimentacao', drenagem: 'drenagem', topografia: 'topografia', meioambiente: 'meioambiente',\n  };\n\n  // Só Geometria tem dados reais de recebido/concluido hoje (mesmas datas do dashboard principal).\n  disciplinaAnalises = {\n    geometria: [\n      { numero: 1, recebido: '02/06/2025', concluido: '09/06/2025' },\n      { numero: 2, recebido: '07/07/2025', concluido: '11/07/2025' },\n      { numero: 3, recebido: '31/07/2025', concluido: '08/08/2025' },\n      { numero: 4, recebido: '28/11/2025', concluido: '10/12/2025' },\n      { numero: 5, recebido: '30/01/2026', concluido: '10/02/2026' },\n    ],\n  };\n\n  normalize(s) {\n    return (s || '').trim().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n  }\n\n  selectDisc(key) {\n    this.setState({ screen: 'password', selectedDisc: key, passwordDraft: '', passwordError: false });\n  }\n\n  backToMenu() {\n    this.setState({ screen: 'menu', selectedDisc: null, discKey: null, passwordDraft: '', passwordError: false });\n  }\n\n  onPasswordChange(e) {\n    const value = e && e.target ? e.target.value : e;\n    this.setState({ passwordDraft: value, passwordError: false });\n  }\n\n  onPasswordKeyDown(e) {\n    if (e && e.key === 'Enter') this.submitPassword();\n  }\n\n  submitPassword() {\n    const key = this.state.selectedDisc;\n    const expected = this.disciplinaSenhas[key];\n    if (this.normalize(this.state.passwordDraft) === expected) {\n      this.setState({ screen: 'form', discKey: key, loading: true });\n      this.waitForFirebase(key, 0);\n    } else {\n      this.setState({ passwordError: true });\n    }\n  }\n\n  componentDidMount() {}\n\n  waitForFirebase(discKey, attempt) {\n    if (window.firebase && firebase.firestore) {\n      if (!firebase.apps || !firebase.apps.length) {\n        firebase.initializeApp({\n          apiKey: \"AIzaSyDNBXkzFJFAsOKefmBesSWmwRHgS0i7ACA\",\n          authDomain: \"sip-sistema-intelig-de-projeto.firebaseapp.com\",\n          projectId: \"sip-sistema-intelig-de-projeto\",\n          storageBucket: \"sip-sistema-intelig-de-projeto.firebasestorage.app\",\n          messagingSenderId: \"957059964424\",\n          appId: \"1:957059964424:web:30ba5c315b713c2c05bbbd\"\n        });\n      }\n      this.subscribeFirestore(discKey);\n      return;\n    }\n    if (attempt > 100) {\n      this.setState({ error: 'Não foi possível carregar a biblioteca do Firebase (tempo esgotado).', loading: false });\n      return;\n    }\n    setTimeout(() => this.waitForFirebase(discKey, attempt + 1), 100);\n  }\n\n  subscribeFirestore(discKey) {\n    try {\n      firebase.firestore().collection('linhaTempoObservacoes').where('disc', '==', discKey)\n        .onSnapshot(snap => {\n          const saved = {};\n          snap.forEach(doc => {\n            const d = doc.data();\n            if (!saved[d.obsKey]) saved[d.obsKey] = [];\n            saved[d.obsKey].push(d);\n          });\n          this.setState({ saved, loading: false });\n        }, e => { console.error('Firestore onSnapshot error:', e); this.setState({ error: e.message, loading: false }); });\n    } catch (e) {\n      console.error('Firebase sync error:', e);\n      this.setState({ error: 'Não foi possível conectar ao Firestore. Detalhe: ' + (e && e.message ? e.message : String(e)), loading: false });\n    }\n  }\n\n  tsMillis(ts) {\n    if (ts && ts.toMillis) return ts.toMillis();\n    return 0;\n  }\n\n  parseBR(s) {\n    const [d, m, y] = s.split('/').map(Number);\n    return new Date(y, m - 1, d);\n  }\n\n  diffDays(a, b) {\n    return Math.round((b - a) / 86400000);\n  }\n\n  setDraft(obsKey, field, e) {\n    const value = e && e.target ? e.target.value : e;\n    this.setState(s => ({ drafts: { ...s.drafts, [obsKey]: { ...s.drafts[obsKey], [field]: value } } }));\n  }\n\n  save(obsKey, numero, discKey) {\n    const draft = this.state.drafts[obsKey] || {};\n    const nome = (draft.nome || '').trim();\n    const texto = (draft.texto || '').trim();\n    if (!nome || !texto) {\n      this.setState(s => ({ formErrors: { ...s.formErrors, [obsKey]: true } }));\n      return;\n    }\n    if (!window.firebase || !firebase.firestore) return;\n    firebase.firestore().collection('linhaTempoObservacoes').add({\n      disc: discKey, obsKey, analiseNumero: numero, nome, texto,\n      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),\n    }).then(() => {\n      this.setState(s => ({\n        drafts: { ...s.drafts, [obsKey]: { nome: '', texto: '' } },\n        formErrors: { ...s.formErrors, [obsKey]: false },\n      }));\n    });\n  }\n\n  fmtTimestamp(ts) {\n    if (!ts || !ts.toDate) return '';\n    const d = ts.toDate();\n    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();\n  }\n\n  buildItems() {\n    const discKey = this.state.discKey;\n    const PRAZO = 20;\n    const analises = this.disciplinaAnalises[discKey] || [];\n    if (!analises.length) return [];\n    const today = new Date();\n\n    return analises.map((a, i) => {\n      const conc = this.parseBR(a.concluido);\n      const proximo = analises[i + 1];\n      let tempo, atrasado;\n      if (proximo) {\n        const dias = this.diffDays(conc, this.parseBR(proximo.recebido));\n        tempo = dias + ' dias'; atrasado = dias > PRAZO;\n      } else {\n        const dias = this.diffDays(conc, today);\n        tempo = dias + ' dias (em aberto)'; atrasado = dias > PRAZO;\n      }\n      const obsKey = 'an-' + a.numero + '-resp';\n      const list = (this.state.saved[obsKey] || []).slice().sort((x, y) => this.tsMillis(x.criadoEm || x.preenchidoEm) - this.tsMillis(y.criadoEm || y.preenchidoEm));\n      const historico = list.map(d => ({ texto: d.texto || '', autor: d.nome || '', data: this.fmtTimestamp(d.criadoEm || d.preenchidoEm) }));\n\n      let showForm = false, proximaEm = '';\n      if (atrasado) {\n        if (!list.length) {\n          showForm = true;\n        } else {\n          const last = list[list.length - 1];\n          const lastTs = last.criadoEm || last.preenchidoEm;\n          const lastDate = lastTs && lastTs.toDate ? lastTs.toDate() : null;\n          if (lastDate) {\n            const diasDesde = this.diffDays(lastDate, today);\n            showForm = diasDesde >= 10;\n            if (!showForm) {\n              const prox = new Date(lastDate.getTime() + 10 * 86400000);\n              proximaEm = String(prox.getDate()).padStart(2, '0') + '/' + String(prox.getMonth() + 1).padStart(2, '0') + '/' + prox.getFullYear();\n            }\n          } else {\n            showForm = true;\n          }\n        }\n      }\n\n      return {\n        key: obsKey, numero: a.numero, recebido: a.concluido, tempo,\n        statusLabel: atrasado ? 'Atrasado' : 'Dentro do Prazo',\n        statusColor: atrasado ? '#c0392b' : '#2f8f4f',\n        atrasado, showForm, proximaEm, historico, hasHistorico: historico.length > 0,\n        nomeVal: (this.state.drafts[obsKey] && this.state.drafts[obsKey].nome) || '',\n        textoVal: (this.state.drafts[obsKey] && this.state.drafts[obsKey].texto) || '',\n        showFormError: !!this.state.formErrors[obsKey],\n        onNomeChange: (v) => this.setDraft(obsKey, 'nome', v),\n        onTextoChange: (v) => this.setDraft(obsKey, 'texto', v),\n        save: () => this.save(obsKey, a.numero, discKey),\n      };\n    }).filter(it => it.atrasado || it.hasHistorico);\n  }\n\n  renderVals() {\n    const discKey = this.state.discKey;\n    const items = this.state.screen === 'form' && discKey ? this.buildItems() : [];\n    return {\n      isMenu: this.state.screen === 'menu',\n      isPassword: this.state.screen === 'password',\n      isForm: this.state.screen === 'form',\n      discButtons: Object.keys(this.disciplinaMeta).map(key => ({\n        key, label: this.disciplinaMeta[key], select: () => this.selectDisc(key),\n      })),\n      selectedLabel: this.state.selectedDisc ? this.disciplinaMeta[this.state.selectedDisc] : '',\n      passwordDraft: this.state.passwordDraft,\n      showPasswordError: this.state.passwordError,\n      onPasswordChange: (e) => this.onPasswordChange(e),\n      onPasswordKeyDown: (e) => this.onPasswordKeyDown(e),\n      onPasswordSubmit: () => this.submitPassword(),\n      backToMenu: () => this.backToMenu(),\n      discLabel: discKey ? (this.disciplinaMeta[discKey] || discKey) : '',\n      isLoading: this.state.loading,\n      hasError: !!this.state.error,\n      errorMsg: this.state.error,\n      hasItems: this.state.screen === 'form' && !this.state.loading && !this.state.error && items.length > 0,\n      noItems: this.state.screen === 'form' && !this.state.loading && !this.state.error && items.length === 0,\n      items,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
